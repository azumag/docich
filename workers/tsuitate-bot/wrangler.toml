name = "docich-tsuitate-bot"
main = "src/index.js"
compatibility_date = "2026-09-21"

[vars]
# Replace this with the Bot ID from the Tsuitate site before configuring local
# or hosted execution. The webhook secret is set separately with Wrangler.
BOT_ID = "replace-with-tsuitate-bot-id"

[[durable_objects.bindings]]
name = "GAME_STATE"
class_name = "GameState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameState"]
