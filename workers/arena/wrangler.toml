name = "docich-arena"
main = "src/worker.js"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]
preview_urls = false

# Same-worker Durable Object bindings: rooms and the lobby live in this worker.
[[durable_objects.bindings]]
name = "ARENA_ROOM"
class_name = "OthelloRoom"

[[durable_objects.bindings]]
name = "ARENA_LOBBY"
class_name = "ArenaLobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OthelloRoom", "ArenaLobby"]
