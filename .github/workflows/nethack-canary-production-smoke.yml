name: NetHack production canary smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nethack-production-canary-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  smoke:
    if: ${{ github.actor_id == 9018513 && github.triggering_actor == 'azumag' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current protected main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
          submodules: false

      - name: Resolve current main
        id: current
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          remote="$(git ls-remote --refs https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')"
          [[ "$remote" =~ ^[0-9a-f]{40}$ ]]
          [[ "$sha" == "$remote" ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH client
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -m 700 -d "$RUNNER_TEMP/vm-ssh"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm-ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/vm-ssh/key" "$RUNNER_TEMP/vm-ssh/known_hosts"
          printf 'port=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Wait for reviewed production deployment
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.current.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          ready=0
          for _ in $(seq 1 120); do
            status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA" || true)"
            if python3 - "$status_json" "$SHA" <<'PY'
          import json, sys
          try:
              data = json.loads(sys.argv[1])
          except Exception:
              raise SystemExit(1)
          ok = data.get("status") == "configured" and data.get("sha") == sys.argv[2] and not data.get("pending_repairs")
          raise SystemExit(0 if ok else 1)
          PY
            then
              ready=1
              break
            fi
            sleep 2
          done
          [[ "$ready" -eq 1 ]]

      - name: Request one isolated NetHack episode
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.current.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          request_id="$(printf '%s' "$SHA:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-32)"
          [[ "$request_id" =~ ^[0-9a-f]{32}$ ]]
          set +e
          gateway_json="$(printf "bash ops/vm_actions/request_nethack_canary_smoke.sh '%s' '%s'\n" "$SHA" "$request_id" |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA")"
          ssh_rc=$?
          set -e
          python3 - "$gateway_json" "$ssh_rc" "$SHA" "$RUNNER_TEMP/nethack-canary-smoke.json" <<'PY'
          import json, pathlib, re, sys
          raw, transport_raw, expected, destination = sys.argv[1:]
          try:
              transport = int(transport_raw)
              data = json.loads(raw)
          except Exception:
              data = {}
              transport = 255
          valid = (
              isinstance(data, dict)
              and set(data) == {"status", "sha", "exit_code", "output", "operation_id"}
              and data.get("status") == "executed"
              and data.get("sha") == expected
              and data.get("output") == "withheld"
              and isinstance(data.get("exit_code"), int)
              and not isinstance(data.get("exit_code"), bool)
              and re.fullmatch(r"[0-9a-f]{32}", str(data.get("operation_id", ""))) is not None
              and transport == data.get("exit_code")
          )
          code = data.get("exit_code") if valid else 255
          categories = {
              0: "terminal",
              10: "policy_stall",
              11: "turn_limit",
              12: "other_timeout",
              20: "request_invalid",
              21: "service_unavailable",
              22: "request_busy",
              23: "result_timeout",
              24: "smoke_failed",
              25: "result_invalid",
              26: "production_sha_mismatch",
              27: "duplicate_request",
          }
          category = categories.get(code, "gateway_error")
          accepted = valid and code in {0, 10, 11, 12}
          pathlib.Path(destination).write_text(
              json.dumps({"accepted": accepted, "category": category, "exit_code": code}, sort_keys=True),
              encoding="utf-8",
          )
          PY

      - name: Verify production remained non-critical
        if: ${{ always() }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.current.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          diagnostics_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "diagnostics docich production $SHA")"
          python3 - "$diagnostics_json" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          diagnostics = data.get("diagnostics") or {}
          ok = data.get("status") == "diagnosed" and diagnostics.get("status") != "critical"
          raise SystemExit(0 if ok else 1)
          PY

      - name: Enforce smoke result
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/nethack-canary-smoke.json" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          if not path.is_file():
              print("nethack_canary_smoke_result=missing")
              raise SystemExit(1)
          data = json.loads(path.read_text(encoding="utf-8"))
          print(f"nethack_canary_smoke_result={data.get('category', 'invalid')}")
          raise SystemExit(0 if data.get("accepted") is True else 1)
          PY
