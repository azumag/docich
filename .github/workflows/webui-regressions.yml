name: WebUI regressions

on:
  pull_request:
    paths:
      - '.github/workflows/webui-regressions.yml'
      - 'src/docich/webui.py'
      - 'src/docich/webui_resources/**'
      - 'src/docich/webui_resources_loader.py'
      - 'src/docich/config.py'
      - 'src/docich/speech.py'
      - 'src/docich/soren91_renderer.py'
      - 'src/docich/llm/**'
      - 'src/docich/runtime_backend.py'
      - 'ops/build_webui_resources.py'
      - 'config/**'
      - 'tests/test_webui.py'
      - 'tests/test_webui_resources.py'
      - 'tests/test_opencode_go_free_chain.py'
      - 'requirements-test.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/webui-regressions.yml'
      - 'src/docich/webui.py'
      - 'src/docich/webui_resources/**'
      - 'src/docich/webui_resources_loader.py'
      - 'src/docich/config.py'
      - 'src/docich/speech.py'
      - 'src/docich/soren91_renderer.py'
      - 'src/docich/llm/**'
      - 'src/docich/runtime_backend.py'
      - 'ops/build_webui_resources.py'
      - 'config/**'
      - 'tests/test_webui.py'
      - 'tests/test_webui_resources.py'
      - 'tests/test_opencode_go_free_chain.py'
      - 'requirements-test.txt'

permissions:
  contents: read

concurrency:
  group: webui-regressions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  webui-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: WebUI mutation guard and authz audit contract
        run: python3 -m pytest -q tests/test_webui.py tests/test_webui_resources.py tests/test_opencode_go_free_chain.py
      - name: WebUI resource manifest matches reviewed HTML and defaults
        run: python3 ops/build_webui_resources.py --check
