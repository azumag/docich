name: Corner rotation operator

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed operation
        required: true
        default: restart-service
        type: choice
        options: [restart-service, recover-failed, rollback-timer, start-hanjuku, recover-runtime, check-cancel-hanjuku, cancel-hanjuku, check-admin-release-hanjuku, admin-release-hanjuku, check-admin-cancel-retro-queues, admin-cancel-retro-queues]
      expected_reservation:
        description: Reviewed reservation fingerprint (cancel or separately approved administrative release)
        required: false
        default: ''
        type: string
      plan_handle:
        description: Public check run ID-attempt for the one-use queue admin plan (never a context fingerprint)
        required: false
        default: ''
        type: string
      unknown_resources:
        description: Separately approved administrative queue cancellation accepts unknown historical resource release
        required: false
        default: not-acknowledged
        type: choice
        options: [not-acknowledged, acknowledged]
      confirm:
        description: Type production
        required: true
        default: ''
        type: string

permissions:
  contents: read

# Same group as the legacy retro-corner-operator workflow: the two entry
# points must serialize instead of operating on the same unit concurrently.
concurrency:
  group: retro-corner-operator-${{ github.repository }}
  cancel-in-progress: false

jobs:
  operate:
    if: >-
      github.actor_id == 9018513 &&
      github.triggering_actor == 'azumag' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted operator from current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          path: control
          persist-credentials: false
          submodules: false

      - name: Authorize fixed corner rotation operation
        id: auth
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: python3 control/ops/vm_actions/authorize_corner_rotation.py >/dev/null

      - name: Resolve immutable current-main SHA
        id: candidate
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="$(git -C control rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$sha" == "$EVENT_SHA" ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH client
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -m 700 -d "$RUNNER_TEMP/vm-ssh"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm-ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/vm-ssh/key" "$RUNNER_TEMP/vm-ssh/known_hosts"
          printf 'port=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Require production to equal current protected main
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA")"
          python3 - "$status_json" "$SHA" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          expected = sys.argv[2]
          if data.get('status') != 'configured' or data.get('sha') != expected:
              raise SystemExit('production is not exactly current protected main')
          PY

      - name: Check or cancel only the reviewed detached Hanjuku manual reservation
        if: steps.auth.outputs.operation == 'check-cancel-hanjuku' || steps.auth.outputs.operation == 'cancel-hanjuku'
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
          OPERATION: ${{ steps.auth.outputs.operation }}
        run: |
          set -euo pipefail
          EXPECTED="$(python3 -I control/ops/vm_actions/corner_rotation_input.py)"
          mode=check
          if [[ "$OPERATION" == cancel-hanjuku ]]; then
            [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]
            mode=apply
          else
            [[ "$OPERATION" == check-cancel-hanjuku && -z "$EXPECTED" ]]
          fi
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          { printf 'CANCEL_MODE=%s\nCANCEL_EXPECTED=%s\n' "$mode" "$EXPECTED"; cat control/ops/vm_actions/cancel_hanjuku_manual.sh; } |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Check or administratively release only the separately approved Hanjuku reservation
        if: steps.auth.outputs.operation == 'check-admin-release-hanjuku' || steps.auth.outputs.operation == 'admin-release-hanjuku'
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
          OPERATION: ${{ steps.auth.outputs.operation }}
        run: |
          set -euo pipefail
          EXPECTED="$(python3 -I control/ops/vm_actions/corner_rotation_input.py)"
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]
          mode=check
          if [[ "$OPERATION" == admin-release-hanjuku ]]; then
            mode=release
          else
            [[ "$OPERATION" == check-admin-release-hanjuku ]]
          fi
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          if gateway_result="$(
            { printf 'ADMIN_RELEASE_MODE=%s\nADMIN_RELEASE_EXPECTED=%s\nADMIN_RELEASE_SHA=%s\n' "$mode" "$EXPECTED" "$SHA"; cat control/ops/vm_actions/admin_release_hanjuku_manual.sh; } |
              ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA" 2>/dev/null
          )"; then
            gateway_rc=0
          else
            gateway_rc=$?
          fi
          python3 -I control/src/docich/hanjuku_admin_result.py "$gateway_result" "$mode" "$SHA" "$gateway_rc"

      - name: Prepare or execute only the one-use fixed two-queue administrative plan
        if: steps.auth.outputs.operation == 'check-admin-cancel-retro-queues' || steps.auth.outputs.operation == 'admin-cancel-retro-queues'
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
          OPERATION: ${{ steps.auth.outputs.operation }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          ACTOR_ID: ${{ github.actor_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          HANDLE="$(python3 -I control/ops/vm_actions/hanjuku_queue_admin_input.py handle)"
          ACK="$(python3 -I control/ops/vm_actions/hanjuku_queue_admin_input.py acknowledgement)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REPOSITORY" == azumag/docich && "$REPOSITORY_ID" == 1327276249 && "$ACTOR_ID" == 9018513 ]]
          [[ "$WORKFLOW_REF" == azumag/docich/.github/workflows/corner-rotation-operator.yml@refs/heads/main && "$REF" == refs/heads/main ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$RUN_ATTEMPT" =~ ^[1-9][0-9]{0,3}$ ]]
          mode=check
          if [[ "$OPERATION" == admin-cancel-retro-queues ]]; then
            [[ "$HANDLE" =~ ^[1-9][0-9]{0,19}-[1-9][0-9]{0,3}$ && "$ACK" == acknowledged ]]
            mode=execute
          else
            [[ "$OPERATION" == check-admin-cancel-retro-queues && -z "$HANDLE" && "$ACK" == not-acknowledged ]]
          fi
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          remote_main="$(git -C control -c core.hooksPath=/dev/null ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$SHA" ]]
          if gateway_result="$(
            { printf 'QUEUE_ADMIN_MODE=%s\nQUEUE_ADMIN_SHA=%s\nQUEUE_ADMIN_HANDLE=%s\nQUEUE_ADMIN_ACK=%s\nQUEUE_ADMIN_REPOSITORY=%s\nQUEUE_ADMIN_REPOSITORY_ID=%s\nQUEUE_ADMIN_ACTOR_ID=%s\nQUEUE_ADMIN_WORKFLOW_REF=%s\nQUEUE_ADMIN_REF=%s\nQUEUE_ADMIN_RUN_ID=%s\nQUEUE_ADMIN_RUN_ATTEMPT=%s\n' "$mode" "$SHA" "$HANDLE" "$ACK" "$REPOSITORY" "$REPOSITORY_ID" "$ACTOR_ID" "$WORKFLOW_REF" "$REF" "$RUN_ID" "$RUN_ATTEMPT"; cat control/ops/vm_actions/admin_cancel_hanjuku_queues.sh; } |
              ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA" 2>/dev/null
          )"; then
            gateway_rc=0
          else
            gateway_rc=$?
          fi
          python3 -I control/ops/vm_actions/hanjuku_queue_admin_result.py "$gateway_result" "$mode" "$SHA" "$gateway_rc"

      - name: Recover only the failed corner rotation slot
        if: steps.auth.outputs.operation == 'recover-failed'
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          cat control/ops/vm_actions/recover_corner_rotation.sh |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Restart only the corner rotation service
        if: steps.auth.outputs.operation == 'restart-service'
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          cat control/ops/vm_actions/restart_corner_rotation.sh |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Recover a dead Hanjuku runtime through the reviewed CLI
        if: steps.auth.outputs.operation == 'recover-runtime'
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          cat control/ops/vm_actions/recover_hanjuku_runtime.sh |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Roll back only the corner rotation timer
        if: steps.auth.outputs.operation == 'rollback-timer'
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          cat control/ops/vm_actions/rollback_corner_rotation_timer.sh |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Start only Hanjuku through the common coordinator
        if: steps.auth.outputs.operation == 'start-hanjuku'
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          cat control/ops/vm_actions/start_hanjuku_corner.sh |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"
