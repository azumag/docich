name: Publish docich wiki once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-wiki-once.yml

permissions:
  contents: write

concurrency:
  group: docich-wiki-publication
  cancel-in-progress: false

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify live GitHub Wiki matches repository source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          WIKI_URL="https://github.com/${GITHUB_REPOSITORY}.wiki.git" scripts/publish_wiki.sh --dry-run
