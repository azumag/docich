name: tmp-hanjuku-resume-prediction

on:
  push:
    branches:
      - feat/hanjuku-resume-prediction
    paths:
      - .github/workflows/tmp-hanjuku-resume-prediction.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hanjuku-resume-prediction
      - name: Apply reviewed patch
        run: python ops/tmp_materialize_hanjuku_resume_prediction.py
      - name: Validate syntax and whitespace
        run: |
          python -m compileall -q src/docich/hanjuku_predictions.py tests/test_hanjuku_resume_predictions.py
          git diff --check
      - name: Commit generated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/docich/hanjuku_predictions.py tests/test_hanjuku_resume_predictions.py
          git commit -m 'feat(hanjuku): add resume chapter prediction'
          git push origin HEAD:feat/hanjuku-resume-prediction
