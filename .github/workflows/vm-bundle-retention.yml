name: VM bundle retention

on:
  workflow_run:
    workflows: ['VM operations']
    types: [completed]
  schedule:
    - cron: '37 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-bundle-retention-${{ github.repository }}
  cancel-in-progress: false

jobs:
  rotate:
    if: >-
      ${{
        github.repository == 'azumag/docich' &&
        (
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository &&
            github.event.workflow_run.actor.id == 9018513
          ) ||
          github.event_name == 'schedule' ||
          (
            github.event_name == 'workflow_dispatch' &&
            github.actor_id == 9018513 &&
            github.triggering_actor == 'azumag'
          )
        )
      }}
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
          submodules: false

      - name: Configure pinned SSH client
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -m 700 -d "$RUNNER_TEMP/vm-ssh"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm-ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/vm-ssh/key" "$RUNNER_TEMP/vm-ssh/known_hosts"
          printf 'port=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Verify production is exactly current protected main
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $sha")"
          printf '%s\n' "$status_json" > "$RUNNER_TEMP/production-status.json"
          python3 - "$RUNNER_TEMP/production-status.json" "$sha" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          expected=sys.argv[2]
          if data.get('status')!='configured' or data.get('sha')!=expected:
              raise SystemExit('production is not exactly current main; refusing bundle rotation')
          PY

      - name: Rotate unreferenced Git bundles under owner-only VM lock
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          command='python3 ops/vm_actions/prune_bundles.py /etc/azumag-vm-ops.json --repo docich --json'
          ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $sha" <<< "$command"

      - name: Verify production remains configured
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $sha")"
          printf '%s\n' "$status_json" > "$RUNNER_TEMP/post-retention-status.json"
          python3 - "$RUNNER_TEMP/post-retention-status.json" "$sha" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          expected=sys.argv[2]
          if data.get('status')!='configured' or data.get('sha')!=expected:
              raise SystemExit('production health changed during bundle rotation')
          storage=data.get('storage') or {}
          print(f"post-retention storage used={int(storage['used_percent'])}% available_bytes={int(storage['available_bytes'])}")
          PY
