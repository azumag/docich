name: Market provider probe

on:
  workflow_run:
    workflows: ["VM operations"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: market-provider-probe-${{ github.repository }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.actor.id == 9018513 &&
          github.repository_owner_id == 9018513 }}
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact deployed main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          submodules: false

      - name: Verify trusted probe source
        shell: bash
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SHA" ]]
          bash -n ops/vm_actions/run_market_provider_probe.sh
          python3 -m py_compile src/docich/trading/markets/provider_probe.py

      - name: Configure pinned SSH client
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -m 700 -d "$RUNNER_TEMP/vm-ssh"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm-ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/vm-ssh/key" "$RUNNER_TEMP/vm-ssh/known_hosts"
          printf 'port=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Probe Moomoo JP quote entitlement on production VM
        id: probe
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          set +e
          cat ops/vm_actions/run_market_provider_probe.sh | \
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA" >/dev/null
          rc=$?
          set -e
          case "$rc" in
            0) status=realtime_ready ;;
            10) status=entitled_not_realtime_ready ;;
            11) status=jp_quote_unavailable ;;
            12) status=sdk_unavailable ;;
            13) status=opend_unreachable ;;
            14) status=probe_failed ;;
            15) status=invalid_probe_request ;;
            *) echo "unexpected provider probe transport/status code: $rc" >&2; exit 1 ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Moomoo JP read-only provider probe: $status"

      - name: Record readiness boundary
        shell: bash
        env:
          STATUS: ${{ steps.probe.outputs.status }}
        run: |
          set -euo pipefail
          case "$STATUS" in
            realtime_ready)
              echo 'VM-only Moomoo JP quote path is currently realtime-ready. This does not enable stocks or orders.'
              ;;
            entitled_not_realtime_ready)
              echo 'JP quote entitlement is visible, but current evidence is not realtime-ready (for example, market closed or quote stale).'
              ;;
            jp_quote_unavailable|sdk_unavailable|opend_unreachable|probe_failed|invalid_probe_request)
              echo "VM-only Moomoo path not ready: $STATUS. Stocks/selector remain disabled."
              ;;
            *) exit 1 ;;
          esac
