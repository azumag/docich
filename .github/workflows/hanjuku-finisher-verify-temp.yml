name: Hanjuku finisher isolated verification
on:
  push:
    branches: ['fix/hanjuku-sufficient-finisher-20261009']
    paths: ['.github/workflows/hanjuku-finisher-verify-temp.yml']
permissions:
  contents: write
jobs:
  verify-and-publish:
    if: github.repository == 'azumag/docich' && github.ref == 'refs/heads/fix/hanjuku-sufficient-finisher-20261009'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
      - name: Verify reviewed instruction scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          assert subprocess.check_output(['git', 'hash-object', 'AGENTS.md'], text=True).strip() == '933baa2ecd2221a70317d12ce9ae4dfe7cc76c25'
          for folder in ('.', 'src', 'src/docich', 'tests', 'docs', '.github', '.github/workflows'):
              for name in ('AGENTS.md', 'AGENTS.override.md'):
                  path = Path(folder) / name
                  if path != Path('AGENTS.md') and path.exists():
                      raise SystemExit('Unreviewed scoped instruction: ' + str(path))
          print('Reviewed instruction scope matches.')
          PY
      - name: Install existing test dependencies
        run: python3 -m pip install -q -r requirements-test.txt
      - name: Reproduce waste on unchanged runtime
        run: |
          set +e
          python3 -m pytest -q --tb=short tests/test_hanjuku_finisher_conservation.py --junitxml="$RUNNER_TEMP/finisher-before.xml" >"$RUNNER_TEMP/finisher-before.log" 2>&1
          code=$?
          set -e
          tail -n 100 "$RUNNER_TEMP/finisher-before.log"
          test "$code" -eq 1
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ['RUNNER_TEMP'], 'finisher-before.xml')).getroot()
          totals = {k: sum(int(s.get(k, 0)) for s in root.findall('testsuite')) for k in ('tests', 'failures', 'errors', 'skipped')}
          print('Unchanged runtime baseline:', totals)
          assert totals['tests'] >= 25 and totals['failures'] > 0 and totals['errors'] == 0
          PY
      - name: Apply only the reviewed exact-blob policy change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          path = Path('src/docich/hanjuku_policy.py')
          data = path.read_bytes()
          actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert actual == 'f3e0d974efe5f1a072cda9bcae4c5fa5c40a0342'
          old = "            if choices:\n                choice = _rescue_card(choices, cur)\n                break\n"
          new = "            if choices:\n                choice = _rescue_card(choices, cur)\n                # Conserve firepower only between already-proven finishers.\n                # Critical/unknown HP keeps the existing emergency order;\n                # healing above, explicit chart choices, and final A gates\n                # remain unchanged. Do not rank guessed or self-harming hits.\n                if (role == 'single_card_lethal'\n                        and type(cur.get('ally_hp')) is int\n                        and cur['ally_hp'] > GENERAL_CRITICAL_RETREAT_HP):\n                    safe = [card for card in choices\n                            if gates[card]['estimate']['self_harm'] is False\n                            and type(gates[card]['estimate']['raw_damage_min']) is int\n                            and gates[card]['estimate']['raw_damage_min'] > 0]\n                    if safe:\n                        minimum = min(gates[card]['estimate']['raw_damage_min'] for card in safe)\n                        choice = _rescue_card([card for card in safe\n                            if gates[card]['estimate']['raw_damage_min'] == minimum], cur)\n                break\n"
          text = data.decode('utf-8')
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == {'src/docich/hanjuku_policy.py'}
          print('Applied the single reviewed policy change.')
          PY
      - name: Verify new regression suite
        run: python3 -m pytest -q --tb=short tests/test_hanjuku_finisher_conservation.py
      - name: Verify all existing Hanjuku contracts
        run: |
          python3 -m pytest -q --tb=short tests/test_hanjuku*.py
          python3 -m py_compile src/docich/hanjuku_policy.py tests/test_hanjuku_finisher_conservation.py
          git diff --check
          git diff --stat
      - name: Publish only reviewed policy change to the feature branch
        run: |
          branch='fix/hanjuku-sufficient-finisher-20261009'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git add src/docich/hanjuku_policy.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(hanjuku): conserve high-power cards between proven finishers'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
          git hash-object src/docich/hanjuku_policy.py tests/test_hanjuku_finisher_conservation.py
