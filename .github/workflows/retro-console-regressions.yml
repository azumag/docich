name: Retro console regressions

on:
  pull_request:
    paths:
      - '.github/workflows/retro-console-regressions.yml'
      - 'src/docich/retro_corner*.py'
      - 'src/docich/eval_tmux.py'
      - 'src/docich/corner_*.py'
      - 'src/docich/agent/**'
      - 'src/docich/ninvaders/**'
      - 'src/docich/tsuitate_protocol.py'
      - 'src/docich/moon_buggy_ab.py'
      - 'src/docich/config.py'
      - 'src/docich/stream_category*.py'
      - 'src/docich/stream_title_context.py'
      - 'src/docich/procs.py'
      - 'src/docich/tmux.py'
      - 'src/docich/game_switch.py'
      - 'src/docich/adapters/retroarch.py'
      - 'src/docich/adapters/cli_game.py'
      - 'brains/**'
      - '!brains/hanjuku/**'
      - 'config/games/**'
      - '!config/games/hanjuku-hero.toml'
      - '!config/games/*nethack*'
      - 'tests/test_retro*.py'
      - 'tests/test_eval_tmux.py'
      - 'tests/test_corner*.py'
      - 'tests/test_failed_improvement_terminal_recovery_required.py'
      - 'tests/test_agent*.py'
      - 'tests/test_ninvaders*.py'
      - 'tests/test_tsuitate_protocol.py'
      - 'tests/test_bastet_brain.py'
      - 'tests/test_moon_buggy_brain.py'
      - 'tests/test_pacman4console_brain.py'
      - 'tests/test_nsnake*.py'
      - 'tests/test_bot_eval.py'
      - 'tests/test_config.py'
      - 'tests/test_robots_config.py'
      - 'tests/test_stream_category.py'
      - 'tests/test_stream_title_context.py'
      - 'tests/test_procs.py'
      - 'games/soviet_now'
      - 'requirements-test.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/retro-console-regressions.yml'
      - 'src/docich/retro_corner*.py'
      - 'src/docich/eval_tmux.py'
      - 'src/docich/corner_*.py'
      - 'src/docich/agent/**'
      - 'src/docich/ninvaders/**'
      - 'src/docich/tsuitate_protocol.py'
      - 'src/docich/moon_buggy_ab.py'
      - 'src/docich/config.py'
      - 'src/docich/stream_category*.py'
      - 'src/docich/stream_title_context.py'
      - 'src/docich/procs.py'
      - 'src/docich/tmux.py'
      - 'src/docich/game_switch.py'
      - 'src/docich/adapters/retroarch.py'
      - 'src/docich/adapters/cli_game.py'
      - 'brains/**'
      - '!brains/hanjuku/**'
      - 'config/games/**'
      - '!config/games/hanjuku-hero.toml'
      - '!config/games/*nethack*'
      - 'tests/test_retro*.py'
      - 'tests/test_eval_tmux.py'
      - 'tests/test_corner*.py'
      - 'tests/test_failed_improvement_terminal_recovery_required.py'
      - 'tests/test_agent*.py'
      - 'tests/test_ninvaders*.py'
      - 'tests/test_tsuitate_protocol.py'
      - 'tests/test_bastet_brain.py'
      - 'tests/test_moon_buggy_brain.py'
      - 'tests/test_pacman4console_brain.py'
      - 'tests/test_nsnake*.py'
      - 'tests/test_bot_eval.py'
      - 'tests/test_config.py'
      - 'tests/test_robots_config.py'
      - 'tests/test_stream_category.py'
      - 'tests/test_stream_title_context.py'
      - 'tests/test_procs.py'
      - 'games/soviet_now'
      - 'requirements-test.txt'

permissions:
  contents: read

concurrency:
  group: retro-console-regressions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  retro-corner-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Retro corner contract
        run: >-
          python3 -m pytest -q
          tests/test_retro_corner.py tests/test_retro_corner_manual.py
          tests/test_retro_corner_recover_runtime.py tests/test_eval_tmux.py
          tests/test_corner_rotation.py tests/test_corner_rotation_execution.py
          tests/test_failed_improvement_terminal_recovery_required.py
          tests/test_agent_loop.py tests/test_agent_fence.py tests/test_agent_action_lock.py
          tests/test_ninvaders_wrapper.py tests/test_ninvaders_wrapper_policy.py
          tests/test_ninvaders_arena.py tests/test_ninvaders_frame.py tests/test_ninvaders_improve.py
          tests/test_ninvaders_nudge.py tests/test_ninvaders_player.py tests/test_ninvaders_policy.py
          tests/test_ninvaders_sandbox.py tests/test_ninvaders_store.py
          tests/test_corner_boundary.py
          tests/test_retro_daily_schedule.py tests/test_corner_improve.py
          tests/test_tsuitate_protocol.py
          tests/test_corner_improve_dispatch.py tests/test_retro_command_brains.py
          tests/test_retro_wrapper_limits.py tests/test_retro_wrapper_real_panes.py
          tests/test_bastet_brain.py tests/test_moon_buggy_brain.py
          tests/test_pacman4console_brain.py tests/test_ninvaders_brain.py
          tests/test_nsnake_brain.py tests/test_nsnake_agent_config.py tests/test_bot_eval.py
          tests/test_retro_lottery.py
          tests/test_config.py tests/test_robots_config.py tests/test_stream_category.py tests/test_stream_title_context.py
          tests/test_procs.py
