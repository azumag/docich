name: Hanjuku egg stock corrected-fixture verification
on:
  push:
    branches: ['fix/hanjuku-observed-egg-recovery-20261009']
    paths: ['.github/workflows/hanjuku-egg-stock-retry-temp.yml']
permissions:
  contents: write
jobs:
  verify-and-publish:
    if: github.repository == 'azumag/docich' && github.ref == 'refs/heads/fix/hanjuku-observed-egg-recovery-20261009'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
      - name: Install existing test dependencies
        run: python3 -m pip install -q -r requirements-test.txt
      - name: Reproduce the corrected regression suite
        run: |
          set +e
          python3 -m pytest -q tests/test_hanjuku_egg_stock.py --junitxml="$RUNNER_TEMP/egg-stock-baseline.xml" >"$RUNNER_TEMP/egg-stock-baseline.log" 2>&1
          result=$?
          set -e
          tail -n 70 "$RUNNER_TEMP/egg-stock-baseline.log"
          test "$result" -eq 1
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ['RUNNER_TEMP'], 'egg-stock-baseline.xml')).getroot()
          suites = root.findall('testsuite')
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ('tests', 'failures', 'errors', 'skipped')}
          print('Corrected-fixture baseline:', totals)
          assert totals == {'tests': 85, 'failures': 23, 'errors': 0, 'skipped': 0}
          PY
      - name: Reuse the reviewed exact-byte instruction check and patch
        run: |
          python3 - <<'PY'
          import hashlib
          import textwrap
          from pathlib import Path
          data = Path('.github/workflows/hanjuku-egg-stock-verify-temp.yml').read_bytes()
          digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert digest == 'b6b1b96f53c86eb8d928b5622fd1c5bb3bffd262'
          source = data.decode('utf-8')
          for marker in ('PY_SCOPE', 'PY_PATCH'):
              begin = "python3 - <<'" + marker + "'\n"
              end = '\n          ' + marker + '\n'
              assert source.count(begin) == 1 and source.count(end) == 1
              block = source.split(begin, 1)[1].split(end, 1)[0]
              exec(compile(textwrap.dedent(block), '<reviewed-' + marker + '>', 'exec'), {})
          PY
      - name: Verify all Hanjuku and adjacent corner contracts
        run: |
          python3 -m pytest -q tests/test_hanjuku_egg_stock.py
          python3 -m pytest -q tests/test_hanjuku*.py tests/test_retro_corner.py tests/test_corner_rotation.py
          python3 -m compileall -q src/docich/hanjuku*.py tests/test_hanjuku*.py
          git diff --check
          git diff --stat
      - name: Publish only the five reviewed changes to the feature branch
        run: |
          branch='fix/hanjuku-observed-egg-recovery-20261009'
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git add src/docich/hanjuku_house.py src/docich/hanjuku_camp_recheck.py src/docich/hanjuku_defense_read_model.py src/docich/hanjuku_policy.py tests/test_hanjuku_retreat_egg_status.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(hanjuku): accept observed five-use eggs across status readers'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
