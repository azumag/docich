name: Operations hotfix contracts

on:
  pull_request:
    paths:
      - 'ops/hotfixes/apply_soren_news_spam_improve_wait_hotfix.py'
      - 'ops/hotfixes/apply_soren_news_spam_queue_wait_hotfix.py'
      - 'ops/hotfixes/payloads/soren_6a59ea7/**'
      - 'ops/hotfixes/apply_improve_command_20260907.py'
      - 'ops/hotfixes/improve_command_20260907.json'
      - 'ops/hotfixes/apply_analysis_contract_20260907.py'
      - 'ops/hotfixes/analysis_contract_20260907.json'
      - 'ops/shadow_once/**'
      - 'tests/test_soren_news_spam_improve_wait_hotfix.py'
      - 'tests/test_soren_news_spam_queue_wait_hotfix.py'
      - 'tests/test_improve_command_deploy.py'
      - 'tests/test_analysis_contract_deploy.py'
      - 'tests/test_shadow_once.py'
      - 'requirements-test.txt'
      - '.github/workflows/ops-hotfix-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'ops/hotfixes/apply_soren_news_spam_improve_wait_hotfix.py'
      - 'ops/hotfixes/apply_soren_news_spam_queue_wait_hotfix.py'
      - 'ops/hotfixes/payloads/soren_6a59ea7/**'
      - 'ops/hotfixes/apply_improve_command_20260907.py'
      - 'ops/hotfixes/improve_command_20260907.json'
      - 'ops/hotfixes/apply_analysis_contract_20260907.py'
      - 'ops/hotfixes/analysis_contract_20260907.json'
      - 'ops/shadow_once/**'
      - 'tests/test_soren_news_spam_improve_wait_hotfix.py'
      - 'tests/test_soren_news_spam_queue_wait_hotfix.py'
      - 'tests/test_improve_command_deploy.py'
      - 'tests/test_analysis_contract_deploy.py'
      - 'tests/test_shadow_once.py'
      - 'requirements-test.txt'
      - '.github/workflows/ops-hotfix-contracts.yml'

permissions:
  contents: read

concurrency:
  group: ops-hotfix-contracts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-test.txt
      - name: Soren news and deployment hotfix contracts
        run: >-
          python3 -m pytest -q
          tests/test_soren_news_spam_improve_wait_hotfix.py
          tests/test_soren_news_spam_queue_wait_hotfix.py
          tests/test_improve_command_deploy.py
          tests/test_analysis_contract_deploy.py
          tests/test_shadow_once.py
