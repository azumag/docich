name: Reply routing acceptance canary

on:
  push:
    branches:
      - feat/jev-reply-evidence-routing

permissions:
  contents: read

concurrency:
  group: reply-routing-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-jev:
    if: ${{ github.repository == 'azumag/docich' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Probe reply-evidence-v1 with fixed synthetic Japanese turns
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -P scripts/reply_routing_live_canary.py | tee "$RUNNER_TEMP/reply-routing-canary.json"
          {
            echo '### reply-evidence-v1 live canary'
            echo '~~~json'
            cat "$RUNNER_TEMP/reply-routing-canary.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
