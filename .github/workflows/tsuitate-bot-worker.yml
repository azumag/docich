name: Tsuitate Bot Worker

on:
  pull_request:
    paths:
      - "workers/tsuitate-bot/**"
      - ".github/workflows/tsuitate-bot-worker.yml"
  push:
    branches: [main]
    paths:
      - "workers/tsuitate-bot/**"
      - ".github/workflows/tsuitate-bot-worker.yml"

permissions:
  contents: read

jobs:
  fixture-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: workers/tsuitate-bot
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Run local protocol and state fixtures
        run: |
          node --version
          npm test
