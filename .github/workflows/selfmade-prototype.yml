name: Selfmade prototype regressions

on:
  pull_request:
    paths:
      - 'src/docich/selfmade_prototype.py'
      - 'tests/test_selfmade_prototype.py'
      - 'tests/fixtures/selfmade_key_switch/**'
      - '.github/workflows/selfmade-prototype.yml'
  push:
    branches: [main]
    paths:
      - 'src/docich/selfmade_prototype.py'
      - 'tests/test_selfmade_prototype.py'
      - 'tests/fixtures/selfmade_key_switch/**'
      - '.github/workflows/selfmade-prototype.yml'

permissions:
  contents: read

concurrency:
  group: selfmade-prototype-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  synthetic-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-test.txt
      - run: PYTHONPATH=src python3 -m pytest -q tests/test_selfmade_prototype.py ops/vm_actions/tests/test_ops_brief.py
      - run: python3 ops/vm_actions/ops_brief.py check-artifact
