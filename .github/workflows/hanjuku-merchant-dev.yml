name: Hanjuku merchant development validation
on:
  push:
    branches: ['fix/hanjuku-surplus-merchant-cards-20261015']
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 50c825db9af297a1f9841f0fa8af9088d127f609
          persist-credentials: false
          submodules: false
      - name: Archive tracked development sources only
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merchant-development-source
          path: source.tar.gz
          retention-days: 1
