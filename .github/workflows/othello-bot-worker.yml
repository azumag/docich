name: Othello Bot Worker

on:
  pull_request:
    paths:
      - "workers/othello-bot/**"
      - ".github/workflows/othello-bot-worker.yml"
  push:
    branches: [main]
    paths:
      - "workers/othello-bot/**"
      - ".github/workflows/othello-bot-worker.yml"

permissions:
  contents: read

concurrency:
  group: othello-bot-worker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: workers/othello-bot
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies (none pinned; stdlib node:test only)
        run: npm install --no-audit --no-fund
      - name: Run room, rules and HTTP routing tests
        run: |
          node --version
          npm test
