name: TDD prediction worker status red

on:
  push:
    branches:
      - codex/prediction-worker-status-reasons

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/prediction-worker-status-reasons
          fetch-depth: 0
      - name: Append prediction worker display tests
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p = Path("tests/test_webui.py")
          t = p.read_text(encoding="utf-8")
          b = base64.b64decode("").decode("utf-8")
          p.write_text(t if "class TestPredictionWorkerDisplay(unittest.TestCase):" in t else t + b, encoding="utf-8")
          PY
      - name: Verify tests fail before implementation
        id: red_test
        continue-on-error: true
        run: python3 -m unittest tests.test_webui.TestPredictionWorkerDisplay
      - name: Assert red state
        run: |
          test "${{ steps.red_test.outcome }}" = "failure"
      - name: Commit red tests
        run: |
          set -euo pipefail
          rm -f .github/workflows/tdd-prediction-worker-status-red.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_webui.py .github/workflows/tdd-prediction-worker-status-red.yml
          git commit -m "test: define prediction worker status reasons"
          git push origin HEAD:codex/prediction-worker-status-reasons
