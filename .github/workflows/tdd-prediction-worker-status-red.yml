name: TDD prediction worker status red

on:
  push:
    branches:
      - codex/prediction-worker-status-reasons

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/prediction-worker-status-reasons
          fetch-depth: 0
      - name: Append prediction worker display tests
        run: cat .github/tdd/prediction_worker_display_tests.txt >> tests/test_webui.py
      - name: Verify tests fail before implementation
        id: red_test
        continue-on-error: true
        run: python3 -m unittest tests.test_webui.TestPredictionWorkerDisplay
      - name: Assert red state
        run: |
          test "${{ steps.red_test.outcome }}" = "failure"
      - name: Commit red tests
        run: |
          set -euo pipefail
          rm -f .github/workflows/tdd-prediction-worker-status-red.yml
          rm -f .github/tdd/prediction_worker_display_tests.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_webui.py .github/workflows/tdd-prediction-worker-status-red.yml .github/tdd/prediction_worker_display_tests.txt
          git commit -m "test: define prediction worker status reasons"
          git push origin HEAD:codex/prediction-worker-status-reasons
