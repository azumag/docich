name: JEV corner operator

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed JEV corner operation
        required: true
        default: start
        type: choice
        options: [start, finish, status, recover, diagnose, recover-diagnose, refresh-bridge, recover-bridge]
      confirm:
        description: Type production
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: jev-corner-operator-${{ github.repository }}
  cancel-in-progress: false

jobs:
  operate:
    if: >-
      github.actor_id == 9018513 &&
      github.triggering_actor == 'azumag' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted operator from current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          path: control
          persist-credentials: false
          submodules: false

      - name: Authorize fixed JEV corner operation
        id: auth
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: python3 control/ops/vm_actions/authorize_jev_corner.py >/dev/null

      - name: Resolve immutable current-main SHA
        id: candidate
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="$(git -C control rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$sha" == "$EVENT_SHA" ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH client
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -m 700 -d "$RUNNER_TEMP/vm-ssh"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm-ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/vm-ssh/key" "$RUNNER_TEMP/vm-ssh/known_hosts"
          printf 'port=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Require production to equal current protected main
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA")"
          python3 - "$status_json" "$SHA" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          expected = sys.argv[2]
          if data.get("status") != "configured" or data.get("sha") != expected:
              raise SystemExit("production is not exactly current protected main")
          PY

      - name: Start one-game JEV corner
        id: start
        if: ${{ steps.auth.outputs.operation == 'start' }}
        continue-on-error: true
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          printf '%s\n' '/home/ubuntu/docich/bin/docich-jev-corner --config /home/ubuntu/docich/config/docich.soren-live.toml start --timeout-seconds 600' |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Diagnose fixed JEV preflight
        id: diagnose
        if: ${{ steps.auth.outputs.operation == 'diagnose' }}
        continue-on-error: true
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -uo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          set +e
          printf '%s\n' '/home/ubuntu/docich/bin/docich-jev-corner --config /home/ubuntu/docich/config/docich.soren-live.toml diagnose' |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA" >/dev/null
          code=$?
          set -e
          echo "::notice::JEV preflight diagnostic exit=${code} (fixed category vocabulary)"
          (( code == 0 ))

      - name: Diagnose stopped bridge recovery preflight
        id: recover_diagnose
        if: ${{ steps.auth.outputs.operation == 'recover-diagnose' }}
        continue-on-error: true
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -uo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          set +e
          printf '%s\n' '/home/ubuntu/docich/bin/docich-jev-corner --config /home/ubuntu/docich/config/docich.soren-live.toml recover-diagnose' |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA" >/dev/null
          code=$?
          set -e
          echo "::notice::JEV bridge recovery preflight exit=${code} (fixed category vocabulary)"
          (( code == 0 ))

      - name: Refresh only the Soren game bridge
        id: refresh_bridge
        if: ${{ steps.auth.outputs.operation == 'refresh-bridge' }}
        continue-on-error: true
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          printf '%s\n' '/home/ubuntu/docich/bin/docich-jev-corner --config /home/ubuntu/docich/config/docich.soren-live.toml refresh-bridge' |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Finish JEV corner and restore existing player
        id: finish
        if: ${{ steps.auth.outputs.operation == 'finish' }}
        continue-on-error: true
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          printf '%s\n' '/home/ubuntu/docich/bin/docich-jev-corner --config /home/ubuntu/docich/config/docich.soren-live.toml finish --timeout-seconds 600' |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Recover stopped Soren game bridge
        id: recover_bridge
        if: ${{ steps.auth.outputs.operation == 'recover-bridge' }}
        continue-on-error: true
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          printf '%s\n' '/home/ubuntu/docich/bin/docich-jev-corner --config /home/ubuntu/docich/config/docich.soren-live.toml recover-bridge' |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Read JEV corner status
        id: status
        if: ${{ steps.auth.outputs.operation == 'status' }}
        continue-on-error: true
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -uo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          set +e
          printf '%s\n' '/home/ubuntu/docich/bin/docich-jev-corner --config /home/ubuntu/docich/config/docich.soren-live.toml status --json' |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA" >/dev/null
          code=$?
          set -e
          echo "::notice::JEV corner status command exit=${code} (output is retained by the production gateway)"
          (( code == 0 ))

      - name: Recover JEV corner state
        id: recover
        if: ${{ steps.auth.outputs.operation == 'recover' }}
        continue-on-error: true
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          printf '%s\n' '/home/ubuntu/docich/bin/docich-jev-corner --config /home/ubuntu/docich/config/docich.soren-live.toml recover' |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Fail unsuccessful JEV start
        if: ${{ steps.start.outcome == 'failure' }}
        run: |
          echo '::error::JEV corner start failed'
          exit 1

      - name: Fail unsuccessful JEV preflight diagnosis
        if: ${{ steps.diagnose.outcome == 'failure' }}
        run: |
          echo '::error::JEV preflight diagnosis failed'
          exit 1

      - name: Fail unsuccessful stopped bridge recovery preflight
        if: ${{ steps.recover_diagnose.outcome == 'failure' }}
        run: |
          echo '::error::Soren stopped bridge recovery preflight failed'
          exit 1

      - name: Fail unsuccessful game bridge refresh
        if: ${{ steps.refresh_bridge.outcome == 'failure' }}
        run: |
          echo '::error::Soren game bridge refresh failed'
          exit 1

      - name: Fail unsuccessful stopped game bridge recovery
        if: ${{ steps.recover_bridge.outcome == 'failure' }}
        run: |
          echo '::error::Soren stopped game bridge recovery failed'
          exit 1

      - name: Fail unsuccessful JEV finish
        if: ${{ steps.finish.outcome == 'failure' }}
        run: |
          echo '::error::JEV corner finish failed'
          exit 1

      - name: Fail unsuccessful JEV status
        if: ${{ steps.status.outcome == 'failure' }}
        run: |
          echo '::error::JEV corner status failed'
          exit 1

      - name: Fail unsuccessful JEV recover
        if: ${{ steps.recover.outcome == 'failure' }}
        run: |
          echo '::error::JEV corner recover failed'
          exit 1
