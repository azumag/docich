name: Hanjuku isolated source-defense patch
on:
  push:
    branches: [fix/hanjuku-adjusted-source-defense]
    paths: [.github/workflows/hanjuku-adjusted-source-bootstrap.yml]
permissions:
  contents: write
concurrency:
  group: hanjuku-adjusted-source-bootstrap
  cancel-in-progress: false
jobs:
  verify-and-commit:
    if: github.repository == 'azumag/docich' && github.ref == 'refs/heads/fix/hanjuku-adjusted-source-defense'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Check exact source baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/docich/hanjuku_policy.py)" = '6a78736156280265b5e96886a43930d947e457f5'
          test -z "$(git status --porcelain)"
      - name: Install offline test requirements
        run: python3 -m pip install -r requirements-test.txt
      - name: Reproduce regression on unchanged policy
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set +e
          python3 -m pytest -q tests/test_hanjuku_adjusted_source_defense.py --junitxml=/tmp/hanjuku-source-baseline.xml
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/hanjuku-source-baseline.xml').getroot()
          assert not root.findall('.//error'), 'Baseline must fail assertions, not setup/import'
          failed = [case.attrib['name'] for case in root.iter('testcase')
                    if case.find('failure') is not None]
          assert any(name.startswith('test_attack_guard_requires_two_distinct_available_generals')
                     and 'A:guard001' in name for name in failed), failed
          print('Confirmed baseline assertion failures:', len(failed))
          PY
      - name: Apply only reviewed source-defense change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/docich/hanjuku_policy.py')
          source = path.read_text(encoding='utf-8')
          old = '''def _reserve_source_guard(order, mem):
              # Original chart offensives and boss waves retain their sequences. A
              # recapture or an off-chart attack must leave a measured idle defender.
              return (_retake_order(order, mem)
                      or (order.get('purpose') == 'attack' and order['step'].startswith('I:')))
          '''
          new = '''def _reserve_source_guard(order, mem):
              # The original chart and boss waves retain their sequences. Adjusted
              # and interim attacks must leave a measured idle defender, like retakes.
              return (not _is_boss_order(order, mem)
                      and (_retake_order(order, mem)
                           or (order.get('purpose') == 'attack'
                               and order['step'].startswith(
                                   (chart_adjust.PLAN_PREFIX, chart_adjust.INTERIM_PREFIX)))))
          '''
          assert source.count(old) == 1, 'Source drift: refusing approximate replacement'
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Verify source-defense and related policy regressions
        env:
          PYTHONPATH: src
        run: |
          python3 -m pytest -q tests/test_hanjuku_adjusted_source_defense.py tests/test_hanjuku_retake_guard.py tests/test_hanjuku_chart_bot.py tests/test_hanjuku_chart_adjust.py
          python3 -m py_compile src/docich/hanjuku_policy.py tests/test_hanjuku_adjusted_source_defense.py
          git diff --check
      - name: Commit only the verified policy to this feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'src/docich/hanjuku_policy.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/docich/hanjuku_policy.py
          git commit -m 'fix(hanjuku): retain source defenders for adjusted attacks'
          git push origin HEAD:refs/heads/fix/hanjuku-adjusted-source-defense
