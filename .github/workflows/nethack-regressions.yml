name: NetHack regressions

on:
  pull_request:
    paths:
      - '.github/workflows/nethack-regressions.yml'
      - 'src/docich/nethack*.py'
      - 'src/docich/adapters/nethack.py'
      - 'src/docich/adapters/cli_game.py'
      - 'src/docich/game_switch.py'
      - 'src/docich/corner_*.py'
      - 'src/docich/config.py'
      - 'src/docich/naming.py'
      - 'src/docich/tmux.py'
      - 'src/docich/xkit.py'
      - 'src/docich/agent/**'
      - 'config/games/*nethack*'
      - 'ops/vm_actions/*nethack*'
      - 'tests/test_nethack*.py'
      - 'requirements-test.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nethack-regressions.yml'
      - 'src/docich/nethack*.py'
      - 'src/docich/adapters/nethack.py'
      - 'src/docich/adapters/cli_game.py'
      - 'src/docich/game_switch.py'
      - 'src/docich/corner_*.py'
      - 'src/docich/config.py'
      - 'src/docich/naming.py'
      - 'src/docich/tmux.py'
      - 'src/docich/xkit.py'
      - 'src/docich/agent/**'
      - 'config/games/*nethack*'
      - 'ops/vm_actions/*nethack*'
      - 'tests/test_nethack*.py'
      - 'requirements-test.txt'

permissions:
  contents: read

concurrency:
  group: nethack-regressions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nethack-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: NetHack offline regressions
        run: >-
          python3 -m pytest -q
          tests/test_nethack_corner.py tests/test_nethack_corner_p5.py tests/test_nethack_corner_force_recover.py
          tests/test_nethack_run.py tests/test_nethack_run_recovery.py
          tests/test_nethack_spectator.py tests/test_nethack_spectator_live.py
          tests/test_nethack_spectator_server.py
          tests/test_nethack_observation.py tests/test_nethack_policy.py tests/test_nethack_exploration.py
          tests/test_nethack_progress.py tests/test_nethack_narration.py
          tests/test_nethack_inventory.py tests/test_nethack_strategy.py tests/test_nethack_strategist.py
          tests/test_nethack_advisory.py tests/test_nethack_shadow.py tests/test_nethack_shadow_source.py
          tests/test_nethack_shadow_eval.py tests/test_nethack_retrospective.py tests/test_nethack_regression.py
          tests/test_nethack_candidate_eval.py tests/test_nethack_candidate_shadow.py
          tests/test_nethack_candidate_shadow_eval.py tests/test_nethack_canary.py
          tests/test_nethack_canary_executor.py tests/test_nethack_canary_container.py
          tests/test_nethack_canary_worker.py tests/test_nethack_canary_candidate_broker.py
          tests/test_nethack_canary_image.py tests/test_nethack_canary_tactics.py
          tests/test_nethack_adapter.py tests/test_nethack_tiles_supervisor.py
          tests/test_nethack_save_confirmation.py tests/test_nethack_boundary_diag.py
