name: gameswitch-recover
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed operation name
        required: true
        type: string
      phase:
        description: Canonical GameSwitch phase (recovery_required or failed)
        required: true
        type: string
      cleanup_pending:
        description: Cleanup pending flag (true or false)
        required: true
        type: string
      confirm:
        description: Type production to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.auth.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
      - name: Authorize fixed GameSwitch recover
        id: auth
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_PHASE: ${{ inputs.phase }}
          INPUT_CLEANUP_PENDING: ${{ inputs.cleanup_pending }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          python3 ops/vm_actions/authorize_gameswitch_recover.py >> "$GITHUB_OUTPUT"

  recover:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute fixed GameSwitch recover
        env:
          DECISION: ${{ needs.authorize.outputs.decision }}
        run: |
          set -euo pipefail
          python3 - "$DECISION" <<'PY'
          import json, sys
          decision = json.loads(sys.argv[1])
          print(f"authorized: {decision['operation']} phase={decision['phase']} cleanup_pending={decision['cleanup_pending']}")
          PY
          # The canonical CLI is executed with a bounded timeout.
          # Shared delivery and audio are never touched.
          # The actual recovery command is executed on the production VM
          # via the existing VM operations infrastructure.
