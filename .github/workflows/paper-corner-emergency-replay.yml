name: PAPER emergency restore replay

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  issues: write

# This dispatcher is read-only with respect to the VM and intentionally does
# not join the VM concurrency lane.  It must remain able to observe a durable
# request while that lane is occupied and hand it back to the serialized
# restore workflow.
jobs:
  inspect:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      github.repository == 'azumag/docich'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      needed: ${{ steps.queue.outputs.needed }}
      nonce: ${{ steps.queue.outputs.nonce }}
    steps:
      - name: Checkout trusted request parser from current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          path: control
          persist-credentials: false
          submodules: false

      - name: Read durable restore queue
        id: queue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue_file="$RUNNER_TEMP/paper-restore-issue.json"
          comments_file="$RUNNER_TEMP/paper-restore-comments.jsonl"
          gh api "repos/$GITHUB_REPOSITORY/issues/569" > "$issue_file"
          issue_state="$(python3 - "$issue_file" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if data.get('number') != 569:
              raise SystemExit('unexpected restore issue')
          user = data.get('user') or {}
          if user.get('login') != 'azumag' or user.get('id') != 9018513:
              raise SystemExit('unexpected restore issue owner')
          print('open' if data.get('state') == 'open' else 'closed')
          PY
          )"
          if [[ "$issue_state" != open ]]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate --jq '.[]' "repos/$GITHUB_REPOSITORY/issues/569/comments?per_page=100" > "$comments_file"
          python3 control/ops/vm_actions/paper_restore_queue.py queue "$comments_file" >> "$GITHUB_OUTPUT"

  restore:
    needs: inspect
    if: needs.inspect.outputs.needed == 'true'
    uses: ./.github/workflows/paper-corner-emergency-restore.yml
    with:
      nonce: ${{ needs.inspect.outputs.nonce }}
    secrets: inherit
