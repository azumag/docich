name: PR merge audio report

# When a pull request is merged into protected main, read its title and queue
# one short Japanese sentence for the VM audio-worker.  The pull request data
# comes from the GitHub API after the owner/protected-main authorization check;
# there is no free-form workflow input.  A push that is not a merged pull
# request (for example a direct push) is a no-op: the VM steps are skipped.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# No shared concurrency group: Actions keeps only one running plus one pending
# run, so a third merge would cancel the pending report of the second.  Every
# push runs its own report; the VM gateway lock serializes the enqueue step.
jobs:
  report:
    if: >-
      github.actor_id == 9018513 &&
      github.triggering_actor == 'azumag' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout trusted operator from current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          path: control
          persist-credentials: false
          submodules: false

      - name: Authorize owner PR merge report
        id: auth
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 control/ops/vm_actions/authorize_pr_merge_audio.py

      # The checkout is current main, which may be newer than the event commit
      # when runs are queued.  The parity gate below compares production with
      # this immutable checkout SHA, not with the event SHA.
      - name: Resolve immutable current-main SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C control rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Find the merged pull request and build the sentence
        id: report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pulls="$RUNNER_TEMP/pr-merge-pulls.json"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$MERGE_SHA/pulls" > "$pulls"
          python3 control/ops/vm_actions/pr_merge_audio_report.py \
            "$pulls" --merge-sha "$MERGE_SHA"

      - name: Stop when the push has no merged pull request
        if: steps.report.outputs.found != 'true'
        shell: bash
        run: echo 'no merged pull request for this push; nothing to report'

      - name: Configure pinned SSH client
        if: steps.report.outputs.found == 'true'
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -m 700 -d "$RUNNER_TEMP/vm-ssh"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm-ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/vm-ssh/key" "$RUNNER_TEMP/vm-ssh/known_hosts"
          printf 'port=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Require production at the deployed reviewed baseline
        if: steps.report.outputs.found == 'true'
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          error_file="$RUNNER_TEMP/pr-merge-status.err"
          # The same push also starts the deploy workflow.  The gateway rejects a
          # read-only status query immediately with gateway_busy while a deploy
          # holds the lock, so retry only that fixed reason with a bound.  Any
          # other rejection (drift, authorization, a missing gateway) is not
          # retried.
          status_ok=0
          for attempt in $(seq 1 18); do
            if status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA" 2>"$error_file")"; then
              status_ok=1
              break
            fi
            if ! grep -Fxq 'VM operation rejected: gateway_busy' "$error_file" || (( attempt == 18 )); then
              break
            fi
            sleep $(( attempt <= 6 ? 5 : 15 ))
          done
          if (( status_ok != 1 )); then
            cat "$error_file" >&2
            exit 1
          fi
          python3 -I control/ops/vm_actions/check_operator_parity.py "$status_json" "$SHA" control

      - name: Queue the sentence for the VM audio-worker
        if: steps.report.outputs.found == 'true'
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
          TEXT_B64: ${{ steps.report.outputs.text_b64 }}
        run: |
          set -euo pipefail
          [[ "$TEXT_B64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          # The sentence reaches the VM only as validated base64 on one
          # assignment line ahead of the reviewed script; exec output is
          # withheld by the gateway.
          { printf 'TEXT_B64=%s\n' "$TEXT_B64"; cat control/ops/vm_actions/report_pr_merge_audio.sh; } |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"
