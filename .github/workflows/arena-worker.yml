name: Arena Worker

on:
  pull_request:
    paths:
      - "workers/arena/**"
      - ".github/workflows/arena-worker.yml"
  push:
    branches: [main]
    paths:
      - "workers/arena/**"
      - ".github/workflows/arena-worker.yml"

permissions:
  contents: read

concurrency:
  group: arena-worker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: workers/arena
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build check without deploying
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
      - name: Run unit and workerd integration tests
        run: |
          node --version
          npm test
          npm run test:workerd
