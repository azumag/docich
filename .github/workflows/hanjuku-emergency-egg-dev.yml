name: Hanjuku emergency egg development
on:
  push:
    branches: [fix/hanjuku-emergency-egg-20261016]
    paths: [.github/workflows/hanjuku-emergency-egg-dev.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.ref == 'refs/heads/fix/hanjuku-emergency-egg-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
      - name: Archive tracked development sources only
        run: |
          set -euo pipefail
          git status --short
          git ls-files '*AGENTS*' '*CLAUDE*'
          git archive --format=tar HEAD > "$RUNNER_TEMP/docich-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hanjuku-emergency-egg-source
          path: ${{ runner.temp }}/docich-source.tar
          retention-days: 1
          if-no-files-found: error
