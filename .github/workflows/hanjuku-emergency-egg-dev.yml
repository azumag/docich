name: Hanjuku emergency egg development
on:
  push:
    branches: [fix/hanjuku-emergency-egg-20261016]
    paths: [.github/workflows/hanjuku-emergency-egg-dev.yml]
permissions:
  contents: write
jobs:
  validate-patch:
    if: github.ref == 'refs/heads/fix/hanjuku-emergency-egg-20261016' && github.actor_id == '9018513'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Validate exact local-tested patch bytes and apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib
          data = pathlib.Path('.dev/hanjuku-general-egg.patch').read_bytes()
          data = data.replace(b'\n diff --git ', b'\ndiff --git ')
          assert hashlib.sha256(data).hexdigest() == '46a5484f722b986560cdaa29a56387c6c128c93bfa40122d917809bb46c27d2c'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'reviewed.patch').write_bytes(data)
          PY
          git apply --check "$RUNNER_TEMP/reviewed.patch"
          git apply "$RUNNER_TEMP/reviewed.patch"
          git diff --check
      - name: Install existing test requirements
        run: python3 -m pip install -r requirements-test.txt
      - name: Regression tests and syntax
        run: |
          python3 -m compileall -q src tests
          python3 -m pytest -q tests/test_hanjuku_general_egg_recheck.py tests/test_hanjuku_survival.py tests/test_hanjuku_egg_timing.py tests/test_hanjuku_overwhelming_egg_conservation.py tests/test_hanjuku_egg_before_retreat.py tests/test_hanjuku_hero_losing_melee.py tests/test_hanjuku_critical_pending_menu.py tests/test_hanjuku_chart_bot.py ops/vm_actions/tests/test_hanjuku_decision_diagnostics.py
      - name: Commit only reviewed source changes to the same work branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/fix/hanjuku-emergency-egg-20261016' ]]
          git add -- ops/vm_actions/collect_diagnostics.py src/docich/hanjuku/flows/battle.py src/docich/hanjuku/flows/battle_menus.py src/docich/hanjuku/judgment/battle.py src/docich/hanjuku/version.py tests/test_hanjuku_chart_bot.py
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(hanjuku): retry unopened egg rescue for endangered generals before collapse'
          git push origin HEAD:refs/heads/fix/hanjuku-emergency-egg-20261016
