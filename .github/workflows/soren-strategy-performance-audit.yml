name: Soren strategy performance audit

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type production
        required: true
        default: ''
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  # Shares the short-lived Soren91 evidence transport staging area, so serialize
  # with the manual evidence exporter rather than racing its chunk selection.
  group: soren91-evidence-export-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.actor_id == 9018513 &&
      github.triggering_actor == 'azumag' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.confirm == 'production') ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 414 &&
          github.event.comment.user.id == 9018513 &&
          github.event.comment.body == '/soren-strategy-performance-audit'
        )
      )
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted audit code from current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          path: control
          persist-credentials: false
          submodules: false

      - name: Resolve immutable current-main SHA
        id: candidate
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="$(git -C control rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$sha" == "$EVENT_SHA" ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH client
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -m 700 -d "$RUNNER_TEMP/vm-ssh"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm-ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/vm-ssh/key" "$RUNNER_TEMP/vm-ssh/known_hosts"
          printf 'port=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Require production at the deployed reviewed baseline
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          status_json="$(timeout --signal=TERM --kill-after=10s 120s ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA")"
          python3 -I control/ops/vm_actions/check_operator_parity.py "$status_json" "$SHA" control

      - name: Prepare and transfer aggregate performance report
        id: transfer
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          archive="$RUNNER_TEMP/soren-strategy-performance.tar.gz"
          meta="$RUNNER_TEMP/soren-strategy-performance-meta.json"
          envelope="$RUNNER_TEMP/soren-strategy-performance-envelope.json"

          command='python3 ops/vm_actions/soren_strategy_performance_export.py prepare'
          timeout --signal=TERM --kill-after=10s 120s ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA" <<< "$command" >/dev/null
          diagnostics_json="$(timeout --signal=TERM --kill-after=10s 120s ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "diagnostics docich production $SHA")"
          printf '%s\n' "$diagnostics_json" > "$envelope"
          chunk_count="$(python3 control/ops/vm_actions/extract_soren91_evidence.py append "$envelope" 0 "$archive" "$meta")"
          [[ "$chunk_count" == '1' ]]
          python3 control/ops/vm_actions/extract_soren91_evidence.py verify "$archive" "$meta" >/dev/null

          python3 - "$archive" "$RUNNER_TEMP/performance.json" <<'PY'
          import json, re, sys, tarfile
          from pathlib import Path
          archive, output = Path(sys.argv[1]), Path(sys.argv[2])
          with tarfile.open(archive, 'r:gz') as tf:
              if tf.getnames() != ['performance.json']:
                  raise SystemExit('unexpected performance bundle members')
              handle = tf.extractfile('performance.json')
              if handle is None:
                  raise SystemExit('missing performance report')
              raw = handle.read(64 * 1024 + 1)
          if len(raw) > 64 * 1024:
              raise SystemExit('performance report too large')
          data = json.loads(raw)
          if data.get('schema') != 1 or not isinstance(data.get('current'), dict):
              raise SystemExit('performance report schema mismatch')
          if not re.fullmatch(r'[0-9a-f]{8,64}', str(data['current'].get('hash', ''))):
              raise SystemExit('performance report hash mismatch')
          output.write_bytes(raw)
          PY

      - name: Format fixed numeric performance summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/performance.json" "$RUNNER_TEMP/performance.md" <<'PY'
          import json, re, sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text())
          out = Path(sys.argv[2])

          def safe_hash(value):
              value = str(value or '')
              if not re.fullmatch(r'[0-9a-f]{8,64}', value):
                  raise SystemExit('unsafe hash')
              return value[:12]

          def number(value):
              if value is None:
                  return 'n/a'
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  raise SystemExit('unsafe numeric field')
              return f'{value:g}'

          def metrics(m):
              return (
                  f"n={number(m.get('n'))}, score p50={number(m.get('score_p50'))}, "
                  f"p25={number(m.get('score_p25'))}, mean={number(m.get('score_mean'))}, "
                  f"turns p50={number(m.get('turns_p50'))}, "
                  f"T14/T15/T16={number(m.get('t14'))}/{number(m.get('t15'))}/{number(m.get('t16'))}, "
                  f"Russia/Soviet={number(m.get('russia'))}/{number(m.get('soviet'))}, "
                  f"instadeath={number(m.get('instadeath'))}"
              )

          current = data['current']
          lines = [
              '## Soren strategy performance audit',
              '',
              f"Current `{safe_hash(current.get('hash'))}`: fresh_n={number(current.get('fresh_n'))}, seeded_n={number(current.get('seeded_n'))}, games_total={number(current.get('games_total'))}",
              f"- post-current fresh: {metrics(current.get('fresh_metrics') or {})}",
              f"- retained window: {metrics(current.get('retained_metrics') or {})}",
              '',
              'Recent strategy windows:',
          ]
          for item in data.get('recent_strategies', [])[:8]:
              if not isinstance(item, dict):
                  raise SystemExit('unsafe strategy row')
              stamp = item.get('last_seen') or 'n/a'
              if stamp != 'n/a' and not re.fullmatch(r'\d{8}_\d{6}', str(stamp)):
                  raise SystemExit('unsafe timestamp')
              lines.append(
                  f"- `{safe_hash(item.get('hash'))}` last={stamp}, games_total={number(item.get('games_total'))}: {metrics(item.get('metrics') or {})}; "
                  f"recorded Russia/Soviet={number((item.get('metrics') or {}).get('russia_recorded'))}/{number((item.get('metrics') or {}).get('soviet_recorded'))}, bestT={number((item.get('metrics') or {}).get('best_max_type'))}"
              )
          lines += [
              '',
              'Read-only aggregate from fixed production state files. No raw game history, paths, prompts, screenshots, or credentials are published.',
          ]
          out.write_text('\n'.join(lines) + '\n')
          PY
          cat "$RUNNER_TEMP/performance.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post audit summary to control issue
        shell: bash
        run: gh issue comment 414 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/performance.md"

      - name: Clear shared evidence transport staging
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "${SHA:-}" && -f "$RUNNER_TEMP/vm-ssh/key" ]] || exit 0
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          command='python3 ops/vm_actions/soren91_evidence_export.py clear'
          timeout --signal=TERM --kill-after=10s 120s ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA" <<< "$command" >/dev/null
