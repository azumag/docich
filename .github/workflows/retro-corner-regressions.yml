      - 'requirements-test.txt'

permissions:
  contents: read

concurrency:
  group: retro-corner-regressions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  soren-gitlink-gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - name: Decide whether retro integration is affected
        id: decide
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run="$(python3 .github/scripts/soren_gitlink_gate.py \
            --before "$BEFORE_SHA" \
            --after "$AFTER_SHA" \
            --root-path '.github/workflows/retro-corner-regressions.yml' \
            --root-path 'src/docich/retro*.py' \
            --root-path 'src/docich/hanjuku*.py' \
            --root-path 'src/docich/nethack*.py' \
            --root-path 'src/docich/ninvaders/**' \
            --root-path 'src/docich/paper_corner*.py' \
            --root-path 'src/docich/corner*.py' \
            --root-path 'src/docich/adapters/**' \
            --root-path 'src/docich/agent/**' \
            --root-path 'src/docich/config.py' \
            --root-path 'src/docich/game_switch.py' \
            --root-path 'src/docich/watchdog.py' \
            --root-path 'src/docich/actions.py' \
            --root-path 'src/docich/state.py' \
            --root-path 'src/docich/naming.py' \
            --root-path 'src/docich/cli.py' \
            --root-path 'src/docich/tmux.py' \
            --root-path 'src/docich/procs.py' \
            --root-path 'src/docich/process_tree.py' \
            --root-path 'src/docich/presentation.py' \
            --root-path 'src/docich/stream_category.py' \
            --root-path 'src/docich/stream_title_context.py' \
            --root-path 'src/docich/tsuitate_protocol.py' \
            --root-path 'src/docich/soren91*.py' \
            --root-path 'src/docich/meriken_voice.py' \
            --root-path 'src/docich/soren_*recovery*.py' \
            --root-path 'brains/**' \
            --root-path 'scripts/hanjuku_scene_generate.sh' \
            --root-path 'config/games/**' \
            --root-path 'tests/test_retro*.py' \
            --root-path 'tests/test_hanjuku*.py' \
            --root-path 'tests/test_nethack*.py' \
            --root-path 'tests/test_ninvaders*.py' \
            --root-path 'tests/test_corner*.py' \
            --root-path 'tests/test_agent*.py' \
            --root-path 'tests/test_paper_corner*.py' \
            --root-path 'tests/test_bastet*.py' \
            --root-path 'tests/test_moon_buggy*.py' \
            --root-path 'tests/test_pacman4console*.py' \
            --root-path 'tests/test_nsnake*.py' \
            --root-path 'tests/test_soren91*.py' \
            --root-path 'tests/test_soren_adapter.py' \
            --root-path 'tests/test_soren_round_recovery.py' \
            --root-path 'tests/test_presentation*.py' \
            --root-path 'tests/test_round_boundary.py' \
            --root-path 'tests/test_cli_adapter.py' \
            --root-path 'tests/test_cli_coordinator.py' \
            --root-path 'tests/test_coordinator*.py' \
            --root-path 'tests/test_game_switch*.py' \
            --root-path 'requirements-test.txt' \
            --root-path '.github/scripts/soren_gitlink_gate.py' \
            --soren-path 'status_dashboard.py' \
            --soren-path 'update_stream_game.sh' \
            --soren-path 'start_all.sh' \
            --soren-path 'strategy/**')"
          [[ "$run" == true || "$run" == false ]]
          echo "run=$run" >> "$GITHUB_OUTPUT"

  retro-corner-regressions:
    needs: soren-gitlink-gate
    if: needs.soren-gitlink-gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Retro corner contract
        run: >-
          python3 -m pytest -q
          tests/test_retro_corner.py tests/test_retro_corner_manual.py
          tests/test_retro_corner_recover_runtime.py tests/test_eval_tmux.py
          tests/test_corner_rotation.py tests/test_corner_rotation_execution.py tests/test_hanjuku_manual_cancel.py tests/test_hanjuku_manual_admin_release.py
          tests/test_failed_improvement_terminal_recovery_required.py
          tests/test_hanjuku_retro_registration.py tests/test_hanjuku_brain.py
          tests/test_hanjuku_script.py tests/test_hanjuku_entry_return.py tests/test_hanjuku_defense_ownership.py tests/test_hanjuku_font_regions.py tests/test_hanjuku_commentary_evidence.py tests/test_hanjuku_chart_bot.py tests/test_hanjuku_melee_cadence.py tests/test_hanjuku_egg_risk.py tests/test_hanjuku_hp_visibility.py tests/test_hanjuku_chart_chapters.py tests/test_hanjuku_survival.py tests/test_hanjuku_map_events.py
          tests/test_hanjuku_boss_events.py tests/test_hanjuku_sortie_evidence.py tests/test_hanjuku_sortie_interruption.py tests/test_hanjuku_chart_adjust.py tests/test_hanjuku_off_chart.py tests/test_hanjuku_castle_panel.py
          tests/test_hanjuku_house.py tests/test_hanjuku_recruit_roster.py tests/test_hanjuku_execution.py tests/test_hanjuku_cursor_components.py
          tests/test_hanjuku_loss_accounting.py
          tests/test_hanjuku_scene_commentary.py tests/test_hanjuku_scene_process.py
          tests/test_hanjuku_scene_dispatcher.py tests/test_hanjuku_fixed_narration_disabled.py
          tests/test_agent_loop.py tests/test_agent_fence.py tests/test_agent_action_lock.py
          tests/test_nethack_corner.py tests/test_nethack_corner_p5.py tests/test_nethack_corner_force_recover.py
          tests/test_nethack_run.py tests/test_nethack_run_recovery.py
          tests/test_nethack_spectator.py tests/test_nethack_spectator_live.py
          tests/test_nethack_spectator_server.py
          tests/test_nethack_observation.py tests/test_nethack_policy.py tests/test_nethack_exploration.py
          tests/test_nethack_progress.py
          tests/test_nethack_narration.py
          tests/test_nethack_inventory.py tests/test_nethack_strategy.py tests/test_nethack_strategist.py
          tests/test_nethack_advisory.py tests/test_nethack_shadow.py tests/test_nethack_shadow_source.py
          tests/test_nethack_shadow_eval.py tests/test_nethack_retrospective.py tests/test_nethack_regression.py
          tests/test_nethack_candidate_eval.py tests/test_nethack_candidate_shadow.py
          tests/test_nethack_candidate_shadow_eval.py tests/test_nethack_canary.py
          tests/test_nethack_canary_executor.py tests/test_nethack_canary_container.py
          tests/test_nethack_canary_worker.py tests/test_nethack_canary_candidate_broker.py
          tests/test_nethack_canary_image.py tests/test_nethack_canary_tactics.py
          tests/test_ninvaders_wrapper.py tests/test_ninvaders_wrapper_policy.py
          tests/test_ninvaders_arena.py tests/test_ninvaders_frame.py tests/test_ninvaders_improve.py
          tests/test_ninvaders_nudge.py tests/test_ninvaders_player.py tests/test_ninvaders_policy.py
          tests/test_ninvaders_sandbox.py tests/test_ninvaders_store.py
          tests/test_corner_boundary.py tests/test_paper_corner.py
          tests/test_opencode_go_free_chain.py
          tests/test_retro_daily_schedule.py tests/test_corner_improve.py
          tests/test_tsuitate_protocol.py
          tests/test_corner_improve_dispatch.py tests/test_retro_command_brains.py
          tests/test_retro_wrapper_limits.py tests/test_retro_wrapper_real_panes.py
          tests/test_bastet_brain.py tests/test_moon_buggy_brain.py
          tests/test_pacman4console_brain.py tests/test_ninvaders_brain.py
          tests/test_nsnake_brain.py tests/test_nsnake_agent_config.py tests/test_bot_eval.py
          tests/test_retro_lottery.py
          tests/test_paper_corner_manual.py tests/test_paper_corner_chatter_schedule.py
          tests/test_paper_corner_meriken_rotation.py
          tests/test_config.py tests/test_robots_config.py tests/test_stream_category.py tests/test_stream_title_context.py
          tests/test_procs.py
      - name: RetroArch saved-boundary and native presentation contracts
        run: >-
          python3 -m pytest -q
          tests/test_retroarch_safe_boundary.py tests/test_retroarch_adapter.py
          tests/test_hanjuku_saved_stop.py
          tests/test_coordinator_adapter_retroarch.py tests/test_retroarch_readiness_contract.py
          tests/test_presentation.py tests/test_presentation_viewer_wait.py tests/test_presentation_script_volume.py
      - name: Transactional switch contract
        run: >-
          python3 -m pytest -q
          tests/test_game_switch.py tests/test_coordinator.py tests/test_coordinator_source_fence.py
          tests/test_coordinator_adapter.py tests/test_cli_coordinator.py
          tests/test_cli_adapter.py
          tests/test_nethack_adapter.py tests/test_nethack_tiles_supervisor.py
          tests/test_nethack_save_confirmation.py
          tests/test_nethack_boundary_diag.py
          tests/test_soren91_graceful_stop.py tests/test_soren91_adapter.py tests/test_soren_adapter.py
          tests/test_soren_round_recovery.py
      - name: Round-boundary contract
        run: python3 -m pytest -q tests/test_round_boundary.py
