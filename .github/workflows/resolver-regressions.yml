name: Resolver regressions

on:
  pull_request:
    paths:
      - 'src/docich/resolver/**'
      - 'src/docich/config.py'
      - 'src/docich/adapters/base.py'
      - 'src/docich/agent/**'
      - 'tests/test_resolver.py'
      - 'config/**'
      - 'requirements-test.txt'
      - '.github/workflows/resolver-regressions.yml'
  push:
    branches: [main]
    paths:
      - 'src/docich/resolver/**'
      - 'src/docich/config.py'
      - 'src/docich/adapters/base.py'
      - 'src/docich/agent/**'
      - 'tests/test_resolver.py'
      - 'config/**'
      - 'requirements-test.txt'
      - '.github/workflows/resolver-regressions.yml'

permissions:
  contents: read

concurrency:
  group: resolver-regressions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-test.txt
      - run: python3 -m pytest -q tests/test_resolver.py
