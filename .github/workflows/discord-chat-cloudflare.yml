name: Discord Chat Cloudflare

on:
  pull_request:
    paths:
      - ".node-version"
      - "workers/discord-chat/**"
      - "src/docich/comment/prompts/comment_persona_main.md"
      - ".github/workflows/discord-chat-cloudflare.yml"
  push:
    branches: [main]
    paths:
      - ".node-version"
      - "workers/discord-chat/**"
      - "src/docich/comment/prompts/comment_persona_main.md"
      - ".github/workflows/discord-chat-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: discord-chat-cloudflare-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: workers/discord-chat
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install pinned Cloudflare build dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build Cloudflare Worker without deploying
        run: ./node_modules/.bin/cf build
      - name: Run offline contracts
        run: npm test
      - name: Run SQLite Durable Object contracts in local workerd
        run: npm run test:workerd
