name: Container host provisioning contracts

on:
  pull_request:
    paths:
      - 'ops/container_host/**'
      - 'docs/operations/container-host-provisioning.md'
      - 'docs/operations/free-strategy-paper-worker.md'
      - 'tests/test_container_host_provisioning.py'
      - 'requirements-test.txt'
      - '.github/workflows/container-host-provisioning-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ops/container_host/**'
      - 'docs/operations/container-host-provisioning.md'
      - 'docs/operations/free-strategy-paper-worker.md'
      - 'tests/test_container_host_provisioning.py'
      - 'requirements-test.txt'
      - '.github/workflows/container-host-provisioning-ci.yml'

permissions:
  contents: read

concurrency:
  group: container-host-provisioning-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-test.txt
      - run: python3 -m pytest -q tests/test_container_host_provisioning.py
