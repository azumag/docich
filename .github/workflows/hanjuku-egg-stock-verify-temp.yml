name: Hanjuku egg stock implementation verification
on:
  push:
    branches: ['fix/hanjuku-observed-egg-recovery-20261009']
    paths: ['.github/workflows/hanjuku-egg-stock-verify-temp.yml']
permissions:
  contents: write
jobs:
  verify-and-publish:
    if: github.repository == 'azumag/docich' && github.ref == 'refs/heads/fix/hanjuku-observed-egg-recovery-20261009'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
      - name: Check instruction scope
        run: |
          python3 - <<'PY_SCOPE'
          from pathlib import Path
          import subprocess
          expected = '933baa2ecd2221a70317d12ce9ae4dfe7cc76c25'
          assert subprocess.check_output(['git', 'hash-object', 'AGENTS.md'], text=True).strip() == expected
          for folder in ('.', 'src', 'src/docich', 'tests', '.github', '.github/workflows'):
              for name in ('AGENTS.md', 'AGENTS.override.md'):
                  path = Path(folder) / name
                  if path == Path('AGENTS.md'):
                      continue
                  if path.exists():
                      raise SystemExit('Unreviewed scoped instruction: ' + str(path))
          print('Reviewed root instructions match; no additional scoped instruction files.')
          PY_SCOPE
      - name: Install existing test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Reproduce regressions on unchanged runtime
        run: |
          set +e
          python3 -m pytest -q tests/test_hanjuku_egg_stock.py --junitxml="$RUNNER_TEMP/egg-stock-baseline.xml" >"$RUNNER_TEMP/egg-stock-baseline.log" 2>&1
          result=$?
          set -e
          tail -n 100 "$RUNNER_TEMP/egg-stock-baseline.log"
          test "$result" -eq 1
          python3 - <<'PY_BASELINE'
          import os
          import xml.etree.ElementTree as ET
          path = os.path.join(os.environ['RUNNER_TEMP'], 'egg-stock-baseline.xml')
          suites = ET.parse(path).getroot().findall('testsuite')
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ('tests', 'failures', 'errors', 'skipped')}
          print('Unchanged runtime baseline:', totals)
          assert totals['tests'] >= 70 and totals['failures'] > 0 and totals['errors'] == 0
          PY_BASELINE
      - name: Apply reviewed exact-blob patch
        run: |
          python3 - <<'PY_PATCH'
          from pathlib import Path
          import hashlib
          import subprocess

          expected = {
              'src/docich/hanjuku_house.py': 'a6c3db62cdce2f0254ff13fe5ffb9fed9cd9759b',
              'src/docich/hanjuku_camp_recheck.py': '4145985f0bd4be5693578aeaba1099b370b8a798',
              'src/docich/hanjuku_defense_read_model.py': 'd058999af14c39386d21b02f40c1d6b88ee78df0',
              'src/docich/hanjuku_policy.py': '3e98e83a35e8a794e5f694562ab3240a9eb40f00',
              'tests/test_hanjuku_retreat_egg_status.py': '164718f9989d1862acbfeabea0c0a4f017a91e6a',
          }
          patches = {
              'src/docich/hanjuku_house.py': [
                  ('from .hanjuku_font import UNKNOWN\n', 'from .hanjuku_font import UNKNOWN\nfrom .hanjuku_egg_stock import observed_uses\n'),
                  ("        uses = re.fullmatch(r'(.+?)([0-4])', body)\n", "        # Angelin can leave five uses. Never fold extra digits into the egg name.\n        uses = re.fullmatch(r'([^\\d]+)([0-9])', body)\n        if uses and observed_uses(int(uses[2])) is None:\n            uses = None\n"),
              ],
              'src/docich/hanjuku_camp_recheck.py': [
                  ('from . import hanjuku_roster as roster_receipts\n', 'from . import hanjuku_roster as roster_receipts\nfrom .hanjuku_egg_stock import observed_uses\n'),
                  ("    if type(uses) is not int or not 0 <= uses <= 4 or not _clean_name(egg):\n", "    if observed_uses(uses) is None or not _clean_name(egg):\n"),
              ],
              'src/docich/hanjuku_defense_read_model.py': [
                  ('from . import hanjuku_chart as chart, hanjuku_roster as roster\n', 'from . import hanjuku_chart as chart, hanjuku_roster as roster\nfrom .hanjuku_egg_stock import observed_uses\n'),
                  ('        if type(uses) is int and 0 <= uses <= 4:\n', '        if observed_uses(uses) is not None:\n'),
              ],
              'src/docich/hanjuku_policy.py': [
                  ('from . import hanjuku_reference as reference\n', 'from . import hanjuku_reference as reference\nfrom .hanjuku_egg_stock import observed_uses\n'),
                  ("        if cells.get(16) == 'たまご' and cells.get(48) and (cells.get(112) or '').isdigit():\n            egg, uses = cells[48], int(cells[112])\n    if not general or UNKNOWN in general or egg is None:\n", "        if (cells.get(16) == 'たまご' and cells.get(48)\n                and re.fullmatch(r'[0-9]', cells.get(112) or '')):\n            egg, uses = cells[48], observed_uses(int(cells[112]))\n    if not general or UNKNOWN in general or egg is None or UNKNOWN in egg or uses is None:\n"),
              ],
              'tests/test_hanjuku_retreat_egg_status.py': [
                  ("@pytest.mark.parametrize('uses', [0, 1, 2, 3, 4])", "@pytest.mark.parametrize('uses', [0, 1, 2, 3, 4, 5])"),
                  ("@pytest.mark.parametrize('uses', [None, True, False, '0', -1, 5])", "@pytest.mark.parametrize('uses', [None, True, False, '0', -1, 6])"),
                  ('def test_only_strict_observed_zero_to_four_updates_the_cache(', 'def test_only_strict_observed_zero_to_five_updates_the_cache('),
              ],
          }
          for name, sha in expected.items():
              data = Path(name).read_bytes()
              blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if blob != sha:
                  raise SystemExit('Unexpected base blob: ' + name)
              text = data.decode('utf-8')
              for old, new in patches[name]:
                  if text.count(old) != 1:
                      raise SystemExit('Replacement not unique: ' + name)
                  text = text.replace(old, new, 1)
              Path(name).write_text(text, encoding='utf-8')
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != set(expected):
              raise SystemExit('Unexpected change set')
          print('Applied reviewed patches to exactly five files.')
          PY_PATCH
      - name: Verify new and adjacent Hanjuku contracts
        run: |
          python3 -m pytest -q tests/test_hanjuku_egg_stock.py
          python3 -m pytest -q tests/test_hanjuku*.py tests/test_retro_corner.py tests/test_corner_rotation.py
          python3 -m compileall -q src/docich/hanjuku*.py tests/test_hanjuku*.py
          git diff --check
          git diff --stat
      - name: Publish only the five reviewed changes to the feature branch
        run: |
          branch='fix/hanjuku-observed-egg-recovery-20261009'
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git add src/docich/hanjuku_house.py src/docich/hanjuku_camp_recheck.py src/docich/hanjuku_defense_read_model.py src/docich/hanjuku_policy.py tests/test_hanjuku_retreat_egg_status.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(hanjuku): accept observed five-use eggs across status readers'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
