name: Public visibility cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-visibility-cleanup.yml

permissions:
  actions: write
  contents: read

jobs:
  purge-private-action-data:
    if: >-
      ${{ github.actor_id == 9018513 &&
          github.triggering_actor == 'azumag' &&
          github.ref == 'refs/heads/main' &&
          github.ref_protected == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Purge completed workflow logs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          purge_completed_logs() {
            gh api --paginate "repos/$REPO/actions/runs?status=completed&per_page=100" \
              --jq '.workflow_runs[].id' | while read -r run_id; do
                [[ -n "$run_id" ]] || continue
                [[ "$run_id" == "$CURRENT_RUN_ID" ]] && continue
                gh api --method DELETE "repos/$REPO/actions/runs/$run_id/logs" >/dev/null 2>&1 || true
              done
          }

          purge_artifacts() {
            gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
              --jq '.artifacts[].id' | while read -r artifact_id; do
                [[ -n "$artifact_id" ]] || continue
                gh api --method DELETE "repos/$REPO/actions/artifacts/$artifact_id" >/dev/null 2>&1 || true
              done
          }

          # Sibling CI/deploy jobs from this merge may still be finishing. Re-scan
          # briefly so their completed logs are removed too. This workflow's own
          # log is intentionally retained; it contains only the cleanup summary.
          for _ in 1 2 3 4 5; do
            purge_completed_logs
            purge_artifacts
            sleep 20
          done

          remaining_artifacts="$(gh api "repos/$REPO/actions/artifacts?per_page=1" --jq '.total_count')"
          echo "Cleanup complete; remaining artifacts: $remaining_artifacts"
