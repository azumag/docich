name: Isolated Hanjuku 2289 CI repair

on:
  push:
    branches: [fix/hanjuku-2289-ci-repair-20261015]

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'azumag/docich'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 32
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Preserve current main and resolve only the reviewed version conflicts
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 76bda0f8e83e78d43f8e5bfb717778d032016ce3
          git config user.name 'docich CI repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags --depth=32 origin 826a51265d95483422e9e0697c1442eeef01b947
          python3 - <<'PY'
          from pathlib import Path
          import ast
          import subprocess

          main = '826a51265d95483422e9e0697c1442eeef01b947'
          base = '5215beace9c015d6577a0b752ee55d692aefda3d'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True)
          if git('merge-base', 'HEAD', main).strip() != base:
              raise SystemExit('Unexpected merge base; no automatic resolution')
          for directory in ('ops', 'ops/vm_actions'):
              for name in ('AGENTS.md', 'AGENTS.override.md', 'CLAUDE.md'):
                  path = Path(directory) / name
                  if path.exists():
                      raise SystemExit(f'Additional instructions need review: {path}')
          merged = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', main])
          if merged.returncode not in (0, 1):
              raise SystemExit('Merge failed before conflict resolution')
          conflicts = git('diff', '--name-only', '--diff-filter=U').splitlines()
          allowed = {'src/docich/hanjuku/version.py', 'tests/test_hanjuku_chart_bot.py'}
          if not set(conflicts) <= allowed:
              raise SystemExit(f'Unexpected merge conflicts: {conflicts}')
          previous = 'hanjuku-chart-v223-value-aware-retreat'
          main_version = 'hanjuku-chart-v224-overwhelming-melee-egg-save'
          merchant_version = 'hanjuku-chart-v224-merchant-bargains'
          combined_version = 'hanjuku-chart-v225-merchant-bargains'
          for name in conflicts:
              ancestor = git('show', f':1:{name}')
              theirs = git('show', f':3:{name}')
              ours = git('show', f':2:{name}')
              # The incoming changes in these two files are only version labels.
              # Any additional main change must be reviewed instead of discarded.
              if theirs.replace(main_version, previous) != ancestor:
                  raise SystemExit(f'Non-version conflict requires review: {name}')
              Path(name).write_text(ours, encoding='utf-8')
              subprocess.run(['git', 'add', name], check=True)
          for name, count in (('src/docich/hanjuku/version.py', 1),
                              ('tests/test_hanjuku_chart_bot.py', 2)):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if text.count(merchant_version) != count:
                  raise SystemExit(f'Unexpected merchant version count: {name}')
              text = text.replace(merchant_version, combined_version)
              ast.parse(text, filename=name)
              path.write_text(text, encoding='utf-8')
          diagnostics = Path('ops/vm_actions/collect_diagnostics.py')
          text = diagnostics.read_text(encoding='utf-8')
          anchor = '            "hanjuku-chart-v224-overwhelming-melee-egg-save",\n'
          if text.count(anchor) != 1 or combined_version in text:
              raise SystemExit('Unexpected diagnostics version allowlist')
          text = text.replace(anchor, anchor + f'            "{combined_version}",\n')
          ast.parse(text, filename=str(diagnostics))
          diagnostics.write_text(text, encoding='utf-8')
          subprocess.run(['git', 'add', 'src/docich/hanjuku/version.py',
                          'tests/test_hanjuku_chart_bot.py', str(diagnostics)], check=True)
          if git('diff', '--name-only', '--diff-filter=U').strip():
              raise SystemExit('Unresolved conflicts remain')
          PY
      - name: Install existing test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Verify merchant and preserved egg-conservation behavior
        run: >-
          python3 -m pytest -q tests/test_hanjuku_chart_bot.py
          tests/test_hanjuku_merchant_bargains.py
          tests/test_hanjuku_merchant_bargain_payment.py
          tests/test_hanjuku_merchant_reserve.py
          tests/test_hanjuku_overwhelming_egg_conservation.py
          tests/test_hanjuku_egg_timing.py
      - name: Commit tested integration only to the isolated branch
        env:
          REPAIR_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git diff --check
          git diff --cached --check
          git commit -m 'fix(hanjuku): integrate merchant bargains without reverting egg conservation'
          auth="$(printf 'x-access-token:%s' "$REPAIR_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/hanjuku-2289-ci-repair-20261015
          unset auth
          printf 'Tested integration commit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
