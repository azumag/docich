name: Isolated Hanjuku 2289 CI repair

on:
  push:
    branches: [fix/hanjuku-2289-ci-repair-20261015]

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'azumag/docich'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply exact reviewed replacements to the isolated branch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast
          import hashlib
          import subprocess

          expected_parent = '4105044561d78abba403c907d6c0aea4e67bcbaa'
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          if parent != expected_parent:
              raise SystemExit('Repair base moved; review before retrying')
          for directory in ('.github', '.github/workflows', 'src', 'src/docich',
                            'src/docich/hanjuku', 'src/docich/hanjuku/flows', 'tests'):
              for name in ('AGENTS.md', 'AGENTS.override.md', 'CLAUDE.md'):
                  candidate = Path(directory) / name
                  if candidate.exists():
                      raise SystemExit(f'Additional instructions need review: {candidate}')
          expected = {
              'src/docich/hanjuku/flows/shop.py': 'a7c90dee4fc99041f727c55ade085b366be113c4',
              'tests/test_hanjuku_chart_bot.py': 'fd3d60d0d585d832832a99d37c51148d6e6e7dbf',
              'tests/test_hanjuku_merchant_bargains.py': '53d85c6f1a73e27ba7dea17a0eacadedd3c2e4c5',
              'tests/test_hanjuku_merchant_bargain_payment.py': 'ad279e1c55fad388877fe54c2104da2d18c4af72',
          }
          source = {}
          for name, oid in expected.items():
              raw = Path(name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if actual != oid:
                  raise SystemExit(f'Unexpected source revision: {name}')
              source[name] = raw.decode('utf-8')

          def replace(name, before, after, count=1):
              if source[name].count(before) != count:
                  raise SystemExit(f'Unexpected replacement count: {name}')
              source[name] = source[name].replace(before, after)

          replace('src/docich/hanjuku/flows/shop.py',
                  "        m = re.match(r'^(\\S+?)(\\d+)G$', joined)",
                  "        # Numeric cash headers (for example 300G) are not product names.\n"
                  "        m = re.match(r'^([^\\d\\s]+)(\\d+)G$', joined)")
          chart = 'tests/test_hanjuku_chart_bot.py'
          replace(chart, "'hanjuku-chart-v223-value-aware-retreat'",
                  "'hanjuku-chart-v224-merchant-bargains'", count=2)
          replace(chart,
                  "    assert refill['items'] == [] and refill['soldiers'] == 99",
                  "    assert refill['items'] == [['ノリウツール', 3], ['クースカン', 1]]\n"
                  "    assert refill['soldiers'] == 99  # optional cards do not take the refill budget")
          before = '''def test_uncovered_month_opens_refill_instead_of_leaving_the_menu():
              mem = {'chapter': 1}
              shop = policy._plan(mem, {'year': 1, 'month': 7, 'gold': 130})
              assert shop['items'] == [] and shop['soldiers'] == 50 and shop['soldiers_done'] is False
              rec = mem['_records'][-1]
              assert rec['strategy_variant'] == 'soldier_refill_only'
              assert rec['deviation_reason'] == 'chart_month_uncovered'
              assert rec['plan'] == {'cards': [], 'soldiers': 50}
              # No gold left: the month closes without opening the refill.
              assert policy._plan({'chapter': 1}, {'year': 1, 'month': 8, 'gold': 0})['soldiers_done'] is True
              c = Canvas()
              c.text(48, 15, '1ねん 7のつき 130G')
              c.text(48, 47, 'しょうにん')
              c.text(48, 63, 'へいしほじゅう')
              c.text(128, 95, 'も〜おしまい!')
              c.hand(26, 41)
              assert policy.month_step(parse(c.frame()), mem)[0]['buttons'] == ['down']
          '''
          after = '''def test_uncovered_month_refills_soldiers_and_plans_spare_cash_cards():
              mem = {'chapter': 1}
              shop = policy._plan(mem, {'year': 1, 'month': 7, 'gold': 130})
              assert shop['items'] == [['ノリウツール', 1]]
              assert shop['soldiers'] == 50 and shop['soldiers_done'] is False
              rec = next(r for r in mem['_records'] if r['decision'] == 'month_plan')
              assert rec['strategy_variant'] == 'soldier_refill_only'
              assert rec['deviation_reason'] == 'chart_month_uncovered'
              assert rec['plan'] == {'cards': [], 'soldiers': 50}
              extra = mem['_records'][-1]
              assert extra['strategy_variant'] == 'spare_cash_strong_cards'
              assert extra['plan'] == {'cards': [['ノリウツール', 1]]}
              # No gold left: the month closes without opening the refill.
              assert policy._plan({'chapter': 1}, {'year': 1, 'month': 8, 'gold': 0})['soldiers_done'] is True
              c = Canvas()
              c.text(48, 15, '1ねん 7のつき 130G')
              c.text(48, 47, 'しょうにん')
              c.text(48, 63, 'へいしほじゅう')
              c.text(128, 95, 'も〜おしまい!')
              c.hand(26, 41)
              refill_mem = json.loads(json.dumps(mem))
              assert policy.month_step(parse(c.frame()), mem)[0]['buttons'] == ['a']
              # A separately prepared post-merchant state still opens the refill.
              refill_mem['shop'].update(items=[], merchant_done=True)
              assert policy.month_step(parse(c.frame()), refill_mem)[0]['buttons'] == ['down']
          '''
          replace(chart, before, after)
          payment = 'tests/test_hanjuku_merchant_bargain_payment.py'
          replace(payment,
                  '    mem = memory(complete=True)\n',
                  '    mem = memory(complete=True)\n'
                  "    mem['shop']['egg'] = 'done'  # isolate card bounds from pending egg recovery\n",
                  count=3)
          source[payment] += '''

          def test_exact_per_card_cap_can_be_confirmed_after_recovery(monkeypatch):
              monkeypatch.setattr(b, '_charted_purchase_ahead', lambda mem, header: False)
              mem = memory(complete=True)
              mem['shop'].update(egg='done', bargain_cards=['ノリウツール'],
                                 items=[['ノリウツール', 3]], want=['ノリウツール', 3, 18])
              assert b.merchant_card_spendable(mem, mem['shop'], quote(999).header,
                                              'ノリウツール', 18) == 54
              assert p.quantity_step(quote(999, count=3, cost=54), mem) == [p.pad('a')]
              assert mem['shop']['bought'] == [['ノリウツール', 3, 18]]


          def test_pending_egg_recovery_still_blocks_optional_payment(monkeypatch):
              monkeypatch.setattr(b, '_charted_purchase_ahead', lambda mem, header: False)
              mem = memory(complete=True)
              mem['shop'].update(bargain_cards=['ノリウツール'],
                                 items=[['ノリウツール', 1]], want=['ノリウツール', 1, 18])
              assert p.quantity_step(quote(999), mem) == [p.pad('b')]
              assert not mem['shop'].get('bought')
          '''
          source['tests/test_hanjuku_merchant_bargains.py'] += '''

          @pytest.mark.parametrize('gold', [100, 200, 300, 400, 500, 1000, 2000])
          def test_round_cash_header_never_poisoned_as_zero_price_stock(ready, gold):
              actions = p.shop_step(listing(gold), ready)
              quantity = min(3, max(0, gold - 8 - 50 - 30) // 18)
              assert actions == [p.pad('a' if quantity else 'b')]
              assert ready['shop']['bargain_listing_planned'] is True
              assert (ready['shop'].get('want') or [None, 0])[1] == quantity
              assert not ready['shop'].get('bought')
          '''
          for name, text in source.items():
              ast.parse(text, filename=name)
              Path(name).write_bytes(text.encode('utf-8'))
          PY
      - name: Install existing test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Run chart and merchant regressions without production access
        run: >-
          python3 -m pytest -q tests/test_hanjuku_chart_bot.py
          tests/test_hanjuku_merchant_bargains.py
          tests/test_hanjuku_merchant_bargain_payment.py
          tests/test_hanjuku_merchant_reserve.py
      - name: Commit only the tested repair on the isolated branch
        env:
          REPAIR_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 4105044561d78abba403c907d6c0aea4e67bcbaa
          git diff --check
          git config user.name 'docich CI repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/docich/hanjuku/flows/shop.py tests/test_hanjuku_chart_bot.py tests/test_hanjuku_merchant_bargains.py tests/test_hanjuku_merchant_bargain_payment.py
          git commit -m 'fix(hanjuku): repair merchant cash-header parsing and regression contracts'
          auth="$(printf 'x-access-token:%s' "$REPAIR_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/hanjuku-2289-ci-repair-20261015
          unset auth
          printf 'Tested repair commit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
