name: Comment regressions

on:
  pull_request:
    paths:
      - '.github/workflows/comment-regressions.yml'
      - 'src/docich/comment/**'
      - 'src/docich/onair_text.py'
      - 'scripts/**'
      - 'games/soviet_now'
      - 'tests/test_comment*.py'
      - 'tests/test_viewer_chat_ack_identity.py'
      - 'requirements-test.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/comment-regressions.yml'
      - 'src/docich/comment/**'
      - 'src/docich/onair_text.py'
      - 'scripts/**'
      - 'games/soviet_now'
      - 'tests/test_comment*.py'
      - 'tests/test_viewer_chat_ack_identity.py'
      - 'requirements-test.txt'

permissions:
  contents: read

concurrency:
  group: comment-regressions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  comment-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Native comment prompt / output guard / state parity and legacy drift guard (#829 PR-3a/3b/3c)
        run: python3 -m pytest -q tests/test_comment_prompt.py tests/test_comment_guard.py tests/test_comment_state.py tests/test_comment_viewer_memory.py tests/test_comment_viewer_memory_bridge.py tests/test_viewer_chat_ack_identity.py
