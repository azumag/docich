name: Comment regressions

on:
  pull_request:
    paths:
      - '.github/workflows/comment-regressions.yml'
      - 'src/docich/comment/**'
      - 'src/docich/onair_text.py'
      - 'scripts/**'
      - 'games/soviet_now'
      - '.github/scripts/soren_gitlink_gate.py'
      - 'tests/test_comment*.py'
      - 'tests/test_viewer_chat_ack_identity.py'
      - 'requirements-test.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/comment-regressions.yml'
      - 'src/docich/comment/**'
      - 'src/docich/onair_text.py'
      - 'scripts/**'
      - 'games/soviet_now'
      - '.github/scripts/soren_gitlink_gate.py'
      - 'tests/test_comment*.py'
      - 'tests/test_viewer_chat_ack_identity.py'
      - 'requirements-test.txt'

permissions:
  contents: read

concurrency:
  group: comment-regressions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  soren-gitlink-gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - name: Decide whether this integration is affected
        id: decide
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run="$(python3 .github/scripts/soren_gitlink_gate.py \
            --before "$BEFORE_SHA" \
            --after "$AFTER_SHA" \
            --root-path '.github/workflows/comment-regressions.yml' \
            --root-path 'src/docich/comment/**' \
            --root-path 'src/docich/onair_text.py' \
            --root-path 'scripts/**' \
            --root-path 'tests/test_comment*.py' \
            --root-path 'tests/test_viewer_chat_ack_identity.py' \
            --root-path 'requirements-test.txt' \
            --root-path '.github/scripts/soren_gitlink_gate.py' \
            --soren-path 'twitch_chat.sh' \
            --soren-path 'youtube_chat.sh' \
            --soren-path 'kick_chat.sh' \
            --soren-path 'lib/comment_viewer_memory.py' \
            --soren-path 'broadcast/comment.sh' \
            --soren-path 'broadcast/comment_lib.sh')"
          [[ "$run" == true || "$run" == false ]]
          echo "run=$run" >> "$GITHUB_OUTPUT"

  comment-regressions:
    needs: soren-gitlink-gate
    if: needs.soren-gitlink-gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Native comment prompt / output guard / state parity and legacy drift guard (#829 PR-3a/3b/3c)
        run: python3 -m pytest -q tests/test_comment_prompt.py tests/test_comment_guard.py tests/test_comment_state.py tests/test_comment_viewer_memory.py tests/test_comment_viewer_memory_bridge.py tests/test_viewer_chat_ack_identity.py
