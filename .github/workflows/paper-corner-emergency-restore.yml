name: PAPER emergency restore

on:
  workflow_call:
    inputs:
      nonce:
        description: Owner-authenticated durable restore request nonce
        required: true
        type: string

permissions:
  contents: read
  issues: write

# This is the only workflow that mutates production for the emergency request.
# It deliberately shares the normal VM lane; the request marker is durable
# outside this lane, so a pending run can be replaced without losing work.
concurrency:
  group: vm-operations-${{ github.repository }}
  cancel-in-progress: false

jobs:
  restore:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      github.repository == 'azumag/docich' &&
      inputs.nonce != '' &&
      ((github.workflow_ref == 'azumag/docich/.github/workflows/paper-corner-emergency-request.yml@refs/heads/main' &&
        github.event_name == 'issues' &&
        github.actor_id == 9018513 &&
        github.triggering_actor == 'azumag') ||
       (github.workflow_ref == 'azumag/docich/.github/workflows/paper-corner-emergency-replay.yml@refs/heads/main' &&
        github.event_name == 'schedule'))
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted restore code from current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          path: control
          persist-credentials: false
          submodules: false

      - name: Validate durable request and completion state
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NONCE: ${{ inputs.nonce }}
        run: |
          set -euo pipefail
          issue_file="$RUNNER_TEMP/paper-restore-issue.json"
          comments_file="$RUNNER_TEMP/paper-restore-comments.jsonl"
          gh api "repos/$GITHUB_REPOSITORY/issues/569" > "$issue_file"
          gh api --paginate --jq '.[]' "repos/$GITHUB_REPOSITORY/issues/569/comments?per_page=100" > "$comments_file"
          issue_state="$(python3 - "$issue_file" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if data.get('number') != 569:
              raise SystemExit('unexpected restore issue')
          user = data.get('user') or {}
          if user.get('login') != 'azumag' or user.get('id') != 9018513:
              raise SystemExit('unexpected restore issue owner')
          print('open' if data.get('state') == 'open' else 'closed')
          PY
          )"
          if [[ "$issue_state" != open ]]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          state="$(python3 control/ops/vm_actions/paper_restore_queue.py state "$comments_file" "$NONCE")"
          # The request recorder accepts only operation=restore-scheduled;
          # this reusable workflow receives its already-validated nonce.
          case "$state" in
            state=pending)
              echo 'needed=true' >> "$GITHUB_OUTPUT"
              echo "nonce=$NONCE" >> "$GITHUB_OUTPUT"
              ;;
            state=complete|state=new)
              echo 'needed=false' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unexpected restore request state: $state" >&2
              exit 1
              ;;
          esac

      - name: Authorize exact restore request
        if: steps.request.outputs.needed == 'true'
        shell: bash
        env:
          NONCE: ${{ steps.request.outputs.nonce }}
        run: |
          set -euo pipefail
          [[ "$NONCE" =~ ^[A-Za-z0-9._:-]{1,64}$ ]]

      - name: Resolve immutable current-main SHA
        id: candidate
        if: steps.request.outputs.needed == 'true'
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="$(git -C control rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$sha" == "$EVENT_SHA" ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH client
        if: steps.request.outputs.needed == 'true'
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -m 700 -d "$RUNNER_TEMP/vm-ssh"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm-ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/vm-ssh/key" "$RUNNER_TEMP/vm-ssh/known_hosts"
          printf 'port=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Require production to equal current protected main
        if: steps.request.outputs.needed == 'true'
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA")"
          python3 - "$status_json" "$SHA" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get('status') != 'configured' or data.get('sha') != sys.argv[2]:
              raise SystemExit('production is not exactly current protected main')
          PY

      - name: Restore stuck scheduled PAPER corner
        if: steps.request.outputs.needed == 'true'
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          response="$(printf 'cd /home/ubuntu/docich && exec bash /home/ubuntu/docich/bin/docich-paper-corner-restore --config /home/ubuntu/docich/config/docich.soren-live.toml\n' |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA")"
          python3 - "$response" "$SHA" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get('status') != 'executed' or data.get('sha') != sys.argv[2] or data.get('exit_code') != 0:
              raise SystemExit('scheduled PAPER restore failed')
          PY

      - name: Record durable successful restore receipt
        if: steps.request.outputs.needed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NONCE: ${{ steps.request.outputs.nonce }}
        run: |
          set -euo pipefail
          body="$(printf '<!-- docich:paper-restore-complete nonce=%s -->\n\nPAPER emergency restore completed.' "$NONCE")"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/569/comments" -f "body=$body" > /dev/null
