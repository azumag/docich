name: Soren gitlink gate contracts

on:
  pull_request:
    paths:
      - '.github/scripts/soren_gitlink_gate.py'
      - 'tests/test_soren_gitlink_gate.py'
      - '.github/workflows/soren-gitlink-gate-ci.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/soren_gitlink_gate.py'
      - 'tests/test_soren_gitlink_gate.py'
      - '.github/workflows/soren-gitlink-gate-ci.yml'

permissions:
  contents: read

concurrency:
  group: soren-gitlink-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Run gitlink gate contracts
        run: python3 -m pytest -q tests/test_soren_gitlink_gate.py
