name: Comment screen context
on:
  pull_request:
    paths:
      - 'src/docich/comment/screen_*.py'
      - 'src/docich/llm/**'
      - 'bin/docich-comment-screen'
      - 'tests/test_comment_screen_*.py'
      - 'requirements-screen.txt'
      - '.github/workflows/comment-screen-context.yml'
permissions:
  contents: read
jobs:
  screen-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-test.txt -r requirements-screen.txt
      - run: python3 -m pytest -q tests/test_comment_screen_context.py tests/test_comment_screen_provider.py
      - run: python3 -m compileall -q src/docich/comment src/docich/llm
      - run: bash -n bin/docich-comment-screen
