name: Semantic decision contracts

on:
  pull_request:
    paths:
      - 'src/docich/semantic_decision/**'
      - 'src/docich/__init__.py'
      - 'tests/test_semantic*.py'
      - 'tests/fixtures/semantic_choice_direct.json'
      - 'tests/fixtures/jev_direct_golden.json'
      - 'games/soviet_now'
      - 'requirements-test.txt'
      - '.github/workflows/semantic-decision.yml'
  push:
    branches: [main]
    paths:
      - 'src/docich/semantic_decision/**'
      - 'src/docich/__init__.py'
      - 'tests/test_semantic*.py'
      - 'tests/fixtures/semantic_choice_direct.json'
      - 'tests/fixtures/jev_direct_golden.json'
      - 'games/soviet_now'
      - 'requirements-test.txt'
      - '.github/workflows/semantic-decision.yml'

permissions:
  contents: read

jobs:
  semantic-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Core without any game checkout
        run: python3 -m pytest -q tests/test_semantic_decision.py
      - name: Require the pinned legacy source for compatibility tests
        run: |
          git submodule update --init games/soviet_now
          test -f games/soviet_now/lib/comment_classifier_jev.py
      - name: Category-only compatibility and unchanged direct baseline
        run: python3 -m pytest -q tests/test_semantic_comment_compat.py tests/test_jev_direct_golden.py
      - name: Compile the extraction
        run: python3 -m compileall -q src/docich/semantic_decision tests/test_semantic_decision.py tests/test_semantic_comment_compat.py
