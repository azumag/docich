name: Temporary Soren91 env cleanup

on:
  push:
    branches:
      - cleanup/remove-soren91-external-improve-env
    paths:
      - .github/soren91-env-cleanup.trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-soren91-external-improve-env
          fetch-depth: 0
      - name: Remove retired external improve env
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/docich/adapters/soren91.py')
          s = p.read_text(encoding='utf-8')
          old = '''            # Improvement is externalised (2026-09-15): the daily job outside\n            # the VM reads the mirrored game logs and opens an improvement PR.\n            # The bot must NOT run its own (legacy gemini/claude CLI) improve.\n            "SOREN91_EXTERNAL_IMPROVE": "1",\n'''
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'exact replacement count mismatch: {n}')
          s = s.replace(old, '')
          if 'SOREN91_EXTERNAL_IMPROVE' in s:
              raise SystemExit('retired env remains')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate bounded diff and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "src/docich/adapters/soren91.py"
          git diff -- src/docich/adapters/soren91.py
          rm -f .github/soren91-env-cleanup.trigger .github/workflows/temporary-soren91-env-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/docich/adapters/soren91.py .github/soren91-env-cleanup.trigger .github/workflows/temporary-soren91-env-cleanup.yml
          git commit -m 'chore(soren91): remove retired external improve env'
          git push origin HEAD:cleanup/remove-soren91-external-improve-env
