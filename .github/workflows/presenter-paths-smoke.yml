name: Presenter path smoke (isolated)

# Isolated, real-binary presenter-path smokes for azumag/docich#1236 acceptance
# item 4. These scripts previously had no CI wiring, so the only record of the
# CLI / RetroArch presenter paths was manual runs on a machine that also hosts
# production.
#
# Scope and limits:
#   - Nothing here touches production. No secrets, no VM gateway, no network
#     egress to docich services. Each script writes its own temp config, uses
#     display :96 and a throwaway state dir, and drives the real binaries.
#   - scripts/smoke_cli.sh: NetHack through docich's `cli` adapter
#     (Xvfb + tmux + xterm + ffmpeg + xdotool), up -> obs -> send -> snap ->
#     file stream -> switch -> down.
#   - scripts/smoke_brain.sh: hanjuku-hero observation + fake brain fixture,
#     then a ROM-less RetroArch menu with real key injection when the
#     `retroarch` binary and `dbus-run-session` are present.
#   - This does NOT prove TwiCa foreground compositing over those presenters in
#     the final stream frame; that remains the real-pixel contracts job plus a
#     production observation window. Do not read a green run here as card
#     visibility.

on:
  pull_request:
    paths:
      - '.github/workflows/presenter-paths-smoke.yml'
      - 'scripts/smoke_cli.sh'
      - 'scripts/smoke_brain.sh'
      - 'bin/docich'
      - 'brains/hanjuku/**'
      - 'config/games/**'
      - 'tests/fixtures/hanjuku_fake_brain.jsonl'
      - 'src/docich/adapters/**'
      - 'src/docich/cli.py'
      - 'src/docich/config.py'
      - 'src/docich/game_switch.py'
      - 'src/docich/presentation.py'
      - 'src/docich/procs.py'
      - 'src/docich/tmux.py'
      - 'src/docich/watchdog.py'
      - 'src/docich/xkit.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/presenter-paths-smoke.yml'
      - 'scripts/smoke_cli.sh'
      - 'scripts/smoke_brain.sh'
      - 'bin/docich'
      - 'brains/hanjuku/**'
      - 'config/games/**'
      - 'tests/fixtures/hanjuku_fake_brain.jsonl'
      - 'src/docich/adapters/**'
      - 'src/docich/cli.py'
      - 'src/docich/config.py'
      - 'src/docich/game_switch.py'
      - 'src/docich/presentation.py'
      - 'src/docich/procs.py'
      - 'src/docich/tmux.py'
      - 'src/docich/watchdog.py'
      - 'src/docich/xkit.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presenter-paths-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli-nethack-presenter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install isolated X11 and CLI presenter dependencies
        run: |
          sudo apt-get update
          # x11-utils provides xdpyinfo, which `docich up` uses to wait for the display.
          sudo apt-get install -y ffmpeg tmux xterm xdotool xvfb x11-utils nethack-console
          # smoke_cli.sh resolves nethack from PATH or /usr/games.
          command -v nethack || test -x /usr/games/nethack
          command -v xdpyinfo
      - name: Run the NetHack CLI presenter smoke
        run: bash scripts/smoke_cli.sh

  retroarch-presenter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install isolated X11 and RetroArch presenter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tmux xdotool xvfb x11-utils dbus-x11 retroarch
      - name: Require the RetroArch presenter to be exercisable
        run: |
          # Fail loudly instead of silently skipping step 4 of smoke_brain.sh.
          command -v retroarch
          command -v dbus-run-session
          retroarch --version || true
      - name: Run the hanjuku brain and RetroArch input smoke
        shell: bash
        run: |
          set -o pipefail
          bash scripts/smoke_brain.sh 2>&1 | tee /tmp/smoke_brain.log
          grep -q 'retroarch 入力到達 OK' /tmp/smoke_brain.log
