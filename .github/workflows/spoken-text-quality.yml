name: Spoken text quality

on:
  pull_request:
    paths:
      - 'src/docich/spoken_text_quality.py'
      - 'src/docich/model_output_guard.py'
      - 'tests/test_spoken_text_quality.py'
      - 'tests/test_model_output_guard.py'
      - 'requirements-test.txt'
      - '.github/workflows/spoken-text-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/docich/spoken_text_quality.py'
      - 'src/docich/model_output_guard.py'
      - 'tests/test_spoken_text_quality.py'
      - 'tests/test_model_output_guard.py'
      - 'requirements-test.txt'
      - '.github/workflows/spoken-text-quality.yml'

permissions:
  contents: read

concurrency:
  group: spoken-text-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-test.txt
      - run: python3 -m pytest -q tests/test_spoken_text_quality.py tests/test_model_output_guard.py
