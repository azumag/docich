name: Hanjuku prediction development apply
on:
  push:
    branches: [feat/hanjuku-channel-predictions-20260930]
    paths: [.github/workflows/hanjuku-predictions-development.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'azumag/docich' && github.ref == 'refs/heads/feat/hanjuku-channel-predictions-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify and apply source-only patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'.github/hanjuku-patch-{i}.txt').read_text().strip() for i in range(5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '34808bff6077b3740722a886ff5e861f61da1e46864b9eb78ff29e810390d072'
          path = Path(os.environ['RUNNER_TEMP']) / 'hanjuku.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
      - name: Install test requirements
        run: python3 -m pip install -r requirements-test.txt
      - name: Offline Hanjuku and corner regressions
        env:
          PYTHONPATH: src
        run: |
          python3 -m pytest -q tests/test_hanjuku_predictions.py tests/test_hanjuku_script.py tests/test_hanjuku_chart_bot.py tests/test_hanjuku_sortie_evidence.py tests/test_retro_corner.py tests/test_corner_rotation.py ops/vm_actions/tests/test_collect_diagnostics.py ops/vm_actions/tests/test_diagnostics_projection_review.py ops/vm_actions/tests/test_hanjuku_narration_diagnostics.py
          git diff --check
      - name: Commit source on feature branch only
        run: |
          git rm .github/hanjuku-patch-0.txt .github/hanjuku-patch-1.txt .github/hanjuku-patch-2.txt .github/hanjuku-patch-3.txt .github/hanjuku-patch-4.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(hanjuku): run durable chapter-clear channel predictions'
          git push origin HEAD:refs/heads/feat/hanjuku-channel-predictions-20260930
