name: Tsuitate public replay evidence

on:
  push:
    branches:
      - ops/tsuitate-public-replay-status
    paths:
      - .github/workflows/tsuitate-public-replay-evidence.yml

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
      - name: Fetch and verify the exact public replay
        env:
          STATUS_FILE: ${{ runner.temp }}/tsuitate-status.json
          TSUITATE_RUN_ID: hourly-2026102902
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$STATUS_FILE" <<'JSON'
          {
            "schema": 1,
            "status": "ok",
            "runId": "hourly-2026102902",
            "state": "finished",
            "gameId": "hqw-_G83FKW4",
            "completedGames": 1,
            "reservedGames": 1,
            "readyForNextRun": true,
            "brainVersion": "tsuitate-brain-v11",
            "errorCode": null,
            "gameResult": {
              "outcome": "loss",
              "reason": "checkmate",
              "endedAt": "2026-10-29T02:35:21.384Z",
              "moveNumber": 85,
              "resultConfidence": "verified"
            }
          }
          JSON
          timeout --kill-after=5s 20s python3 ops/vm_actions/tsuitate_public_replay_query.py > "$RUNNER_TEMP/replay.json"
          python3 - "$RUNNER_TEMP/replay.json" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(data["body"])
          PY
      - name: Read allowlisted public foul attempts and relevant move windows
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=5s 20s python3 - <<'PY'
          import json
          import urllib.request
          from src.docich.tsuitate_review import (
              MAX_REPLAY_BYTES, NoRedirect, REPLAY_TIMEOUT_S, USI, _entry, _table_of,
              read_kifu_detail, replay_url,
          )

          game_id = "hqw-_G83FKW4"
          terminal = {
              "outcome": "loss", "reason": "checkmate",
              "endedAt": "2026-10-29T02:35:21.384Z",
              "moveNumber": 85, "resultConfidence": "verified",
          }
          request = urllib.request.Request(replay_url(game_id), method="GET", headers={
              "Accept": "application/json", "User-Agent": "docich-tsuitate-review-evidence/1.0",
          })
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          with opener.open(request, timeout=REPLAY_TIMEOUT_S) as response:
              raw = response.read(MAX_REPLAY_BYTES + 1)
          if len(raw) > MAX_REPLAY_BYTES:
              raise SystemExit("public replay too large")
          payload = json.loads(raw)
          table, _root, game = _table_of(payload, game_id)
          refs = _entry(table, game["foulAttempts"])
          print("Foul-Attempt-Count:", len(refs))
          for i, ref in enumerate(refs, 1):
              obj = _entry(table, ref)
              if not isinstance(obj, dict) or set(obj) != {"byColor", "moveNumber", "usi"}:
                  raise SystemExit("unexpected foul attempt shape")
              by = _entry(table, obj["byColor"])
              number = _entry(table, obj["moveNumber"])
              usi = _entry(table, obj["usi"])
              if by not in {"sente", "gote"} or type(number) is not int or not 1 <= number <= 512:
                  raise SystemExit("unexpected foul attempt metadata")
              if not isinstance(usi, str) or not USI.fullmatch(usi):
                  raise SystemExit("unexpected foul attempt move")
              print(f"Foul-Attempt-{i}: {by} move={number} usi={usi}")

          detail, failure = read_kifu_detail(game_id, terminal)
          if detail is None:
              raise SystemExit(f"kifu unavailable: {failure}")
          moves = detail["kifu"]["moves"]
          wanted = set()
          for center in (29, 37, 79, 86):
              wanted.update(range(max(1, center - 3), min(len(moves), center + 3) + 1))
          for n in sorted(wanted):
              move = moves[n - 1]
              print(f"Move-{n}: {move['side']} {move['usi']} {move['notation']} {move['ms']}ms")
          PY
