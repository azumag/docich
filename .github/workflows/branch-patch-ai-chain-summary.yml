name: Branch patch AI chain diagnostics

on:
  push:
    branches:
      - codex/ai-chain-summary-diagnostics

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/ai-chain-summary-diagnostics
      - name: Apply scoped observability patch
        run: python3 ops/vm_actions/dev_patch_chain_summary.py
      - name: Run focused and full VM operation regressions
        run: |
          python3 -m unittest ops.vm_actions.tests.test_ai_chain_summary_diagnostics -v
          python3 -m unittest discover -s ops/vm_actions/tests -v
          python3 -m py_compile ops/vm_actions/collect_diagnostics.py ops/vm_actions/summarize_runtime_queue_attribution.py
      - name: Commit tested patch to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/vm_actions/collect_diagnostics.py ops/vm_actions/summarize_runtime_queue_attribution.py ops/vm_actions/tests/test_ai_chain_summary_diagnostics.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git commit -m 'feat(vmops): expose fixed AI chain summary counters'
          git push origin HEAD:codex/ai-chain-summary-diagnostics
