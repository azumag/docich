name: Hanjuku recovery query

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  recover:
    permissions:
      contents: read
      issues: write
    if: >-
      github.actor_id == 9018513 &&
      github.triggering_actor == 'azumag' &&
      github.event.issue.number == 1657 &&
      github.event.comment.user.id == 9018513 &&
      github.event.comment.body == '/hanjuku-recover production'
    concurrency:
      group: retro-corner-operator-${{ github.repository }}
      cancel-in-progress: false
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted recovery code from event main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          submodules: false

      - name: Authorize fixed owner recovery
        id: auth
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_SHA: ${{ github.sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_AUTHOR_ID: ${{ github.event.comment.user.id }}
        run: python3 control/ops/vm_actions/authorize_hanjuku_recover_query.py

      - name: Require the event to remain current main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C control rev-parse HEAD)" == "$GITHUB_SHA" ]]
          current="$(git -C control ls-remote --exit-code origin refs/heads/main | cut -f1)"
          [[ "$current" == "$GITHUB_SHA" ]]
          umask 077
          install -m 700 -d "$RUNNER_TEMP/hanjuku-recover/ssh"

      - name: Configure pinned SSH transport
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          work="$RUNNER_TEMP/hanjuku-recover"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$work/ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$work/ssh/known_hosts"
          chmod 600 "$work/ssh/"*
          printf 'HANJUKU_SSH_PORT=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Require production to equal event SHA
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hanjuku-recover"
          ssh_args=(-F /dev/null -T -p "$HANJUKU_SSH_PORT" -i "$work/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o ConnectTimeout=20)
          current="$(git -C control ls-remote --exit-code origin refs/heads/main | cut -f1)"
          [[ "$current" == "$SHA" ]]
          status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA")"
          python3 - "$status_json" "$SHA" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("status") != "configured" or data.get("sha") != sys.argv[2]:
              raise SystemExit("production is not exactly the event SHA")
          PY

      - name: Recover only the failed Hanjuku reservation
        id: recover
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hanjuku-recover"
          ssh_args=(-F /dev/null -T -p "$HANJUKU_SSH_PORT" -i "$work/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o ConnectTimeout=20)
          set +e
          (ulimit -f 16; timeout --kill-after=5s 120s \
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" \
              "exec docich production $SHA") \
            < control/ops/vm_actions/recover_corner_rotation.sh \
            > "$work/recover.stdout" 2> "$work/recover.stderr"
          rc=$?
          set -e
          if (( rc != 0 )); then
            reason="$(python3 - "$work/recover.stdout" "$SHA" <<'PY'
          import json, pathlib, sys
          path, expected_sha = pathlib.Path(sys.argv[1]), sys.argv[2]
          fixed = {
              23: "ambiguous_unit", 24: "missing_unit", 25: "missing_runtime",
              64: "invalid_request", 70: "recovery_pending",
              71: "recovery_rejected", 72: "invalid_result",
          }
          reason = "transport_failure"
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
              code = data.get("exit_code")
              if (data.get("status") == "executed"
                      and data.get("sha") == expected_sha
                      and data.get("output") == "withheld"
                      and type(code) is int):
                  reason = fixed.get(code, "recovery_rejected")
          except (OSError, ValueError, TypeError):
              pass
          print(reason)
          PY
            )"
            printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
            echo "::error::Hanjuku recovery request rejected: $reason"
            exit 1
          fi
          printf '%s\n' 'reason=recovered' >> "$GITHUB_OUTPUT"
          rm -f "$work/recover.stdout" "$work/recover.stderr"

      - name: Return fixed result metadata to the control Issue
        if: ${{ always() && steps.auth.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RECOVER_OUTCOME: ${{ steps.recover.outcome }}
          RECOVER_REASON: ${{ steps.recover.outputs.reason }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/hanjuku-recover"
          install -m 700 -d "$work"
          python3 - "$SOURCE_COMMENT_ID" "$RUN_ID" "$RUN_ATTEMPT" "$RUN_SHA" "$RECOVER_OUTCOME" "$RECOVER_REASON" > "$work/reply.json" <<'PY'
          import json, re, sys
          comment_id, run_id, attempt, sha, outcome, reason = sys.argv[1:]
          if not (comment_id.isdigit() and run_id.isdigit() and attempt.isdigit()
                  and re.fullmatch(r"[0-9a-f]{40}", sha)
                  and outcome in {"success", "failure", "cancelled", "skipped"}):
              raise SystemExit("invalid fixed reply metadata")
          allowed = {
              "recovered", "ambiguous_unit", "missing_unit", "missing_runtime",
              "invalid_request", "recovery_pending", "recovery_rejected",
              "invalid_result", "transport_failure", "not_run",
          }
          if not reason:
              reason = "not_run"
          if reason not in allowed:
              raise SystemExit("invalid fixed reply reason")
          body = "\n".join((
              f"Request: https://github.com/azumag/docich/issues/1657#issuecomment-{comment_id}",
              f"Run: https://github.com/azumag/docich/actions/runs/{run_id}",
              f"Attempt: {attempt}",
              f"SHA: {sha}",
              f"Result: {outcome}",
              f"Reason: {reason}",
          ))
          json.dump({"body": body}, sys.stdout, separators=(",", ":"))
          PY
          gh api --method POST repos/azumag/docich/issues/1657/comments \
            --input "$work/reply.json" > /dev/null

      - name: Clear runner staging
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/hanjuku-recover"
