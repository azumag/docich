name: Weather relay CI

on:
  pull_request:
    paths:
      - 'config/docich.soren-live.toml'
      - 'src/docich/weather.py'
      - 'src/docich/weather_view.py'
      - 'src/docich/weather_corner.py'
      - 'src/docich/weather_audio.py'
      - 'src/docich/soren_weather_audio.py'
      - 'games/soviet_now'
      - '.github/scripts/soren_gitlink_gate.py'
      - 'src/docich/corner_catalog.py'
      - 'src/docich/corner_adapters.py'
      - 'src/docich/corner_boundary.py'
      - 'src/docich/game_switch.py'
      - 'src/docich/adapters/__init__.py'
      - 'src/docich/adapters/weather_program.py'
      - 'tests/test_weather.py'
      - 'tests/fixtures/weather_view/**'
      - 'tests/test_weather_program.py'
      - 'tests/test_weather_corner.py'
      - 'tests/test_weather_audio_contract.py'
      - 'tests/test_soren_weather_audio.py'
      - 'tests/test_corner_rotation.py'
      - 'tests/test_corner_rotation_execution.py'
      - 'tests/test_game_switch.py'
      - 'tests/test_round_boundary.py'
      - 'bin/docich-weather'
      - '.github/workflows/weather-regressions.yml'
      - 'requirements-test.txt'
  push:
    branches: [main]
    paths:
      - 'config/docich.soren-live.toml'
      - 'src/docich/weather.py'
      - 'src/docich/weather_view.py'
      - 'src/docich/weather_corner.py'
      - 'src/docich/weather_audio.py'
      - 'src/docich/soren_weather_audio.py'
      - 'games/soviet_now'
      - '.github/scripts/soren_gitlink_gate.py'
      - 'src/docich/corner_catalog.py'
      - 'src/docich/corner_adapters.py'
      - 'src/docich/corner_boundary.py'
      - 'src/docich/game_switch.py'
      - 'src/docich/adapters/__init__.py'
      - 'src/docich/adapters/weather_program.py'
      - 'tests/test_weather.py'
      - 'tests/fixtures/weather_view/**'
      - 'tests/test_weather_program.py'
      - 'tests/test_weather_corner.py'
      - 'tests/test_weather_audio_contract.py'
      - 'tests/test_soren_weather_audio.py'
      - 'tests/test_corner_rotation.py'
      - 'tests/test_corner_rotation_execution.py'
      - 'tests/test_game_switch.py'
      - 'tests/test_round_boundary.py'
      - 'bin/docich-weather'
      - '.github/workflows/weather-regressions.yml'
      - 'requirements-test.txt'

permissions:
  contents: read

concurrency:
  group: weather-relay-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  soren-gitlink-gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - name: Decide whether this integration is affected
        id: decide
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run="$(python3 .github/scripts/soren_gitlink_gate.py \
            --before "$BEFORE_SHA" \
            --after "$AFTER_SHA" \
            --root-path 'src/docich/weather.py' \
            --root-path 'src/docich/weather_view.py' \
            --root-path 'src/docich/weather_corner.py' \
            --root-path 'src/docich/weather_audio.py' \
            --root-path 'src/docich/soren_weather_audio.py' \
            --root-path 'src/docich/corner_catalog.py' \
            --root-path 'src/docich/corner_adapters.py' \
            --root-path 'src/docich/corner_boundary.py' \
            --root-path 'src/docich/game_switch.py' \
            --root-path 'src/docich/adapters/__init__.py' \
            --root-path 'src/docich/adapters/weather_program.py' \
            --root-path 'tests/test_weather.py' \
            --root-path 'tests/fixtures/weather_view/**' \
            --root-path 'tests/test_weather_program.py' \
            --root-path 'tests/test_weather_corner.py' \
            --root-path 'tests/test_weather_audio_contract.py' \
            --root-path 'tests/test_soren_weather_audio.py' \
            --root-path 'tests/test_corner_rotation.py' \
            --root-path 'tests/test_corner_rotation_execution.py' \
            --root-path 'tests/test_game_switch.py' \
            --root-path 'tests/test_round_boundary.py' \
            --root-path 'bin/docich-weather' \
            --root-path '.github/workflows/weather-regressions.yml' \
            --root-path 'requirements-test.txt' \
            --root-path '.github/scripts/soren_gitlink_gate.py' \
            --soren-path 'lib/weather_audio_consumer.py' \
            --soren-path 'eloop_lib.sh')"
          [[ "$run" == true || "$run" == false ]]
          echo "run=$run" >> "$GITHUB_OUTPUT"

  weather-relay:
    needs: soren-gitlink-gate
    if: needs.soren-gitlink-gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: true
          persist-credentials: false
      - name: Install existing test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Require Node for DOM-free UI regression tests
        run: node --version
      - name: Forecast, lifecycle, and GameSwitch contracts
        env:
          PYTHONPATH: src
          SOVIET_NOW_ROOT: ${{ github.workspace }}/games/soviet_now
          WEATHER_TEST_REQUIRE_PROCESS_GROUP_STOP: "1"
        run: python3 -m pytest -q tests/test_weather.py tests/test_weather_program.py tests/test_weather_corner.py tests/test_weather_audio_contract.py tests/test_soren_weather_audio.py tests/test_corner_rotation.py tests/test_corner_rotation_execution.py tests/test_game_switch.py tests/test_round_boundary.py
      - name: Compile and check entrypoint
        run: |
          python3 -m py_compile src/docich/weather.py src/docich/weather_view.py src/docich/weather_corner.py src/docich/weather_audio.py src/docich/soren_weather_audio.py src/docich/corner_catalog.py src/docich/corner_adapters.py src/docich/game_switch.py src/docich/adapters/weather_program.py tests/test_weather.py tests/test_weather_program.py tests/test_weather_corner.py tests/test_weather_audio_contract.py tests/test_soren_weather_audio.py
          bash -n bin/docich-weather
