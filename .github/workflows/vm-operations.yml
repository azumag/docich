name: VM operations

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: status
        type: choice
        options: [status, deploy, exec, configure_jev, disable_jev, configure_jev_route_direct, configure_jev_route_vercel, disable_jev_route, bootstrap, diagnostics, reclaim, rebaseline, market_paper, restart_webui, recover_soren_game]
      target:
        description: VM target
        required: true
        default: preview
        type: choice
        options: [preview, production]
      ref:
        description: Branch or full commit SHA (production deploy is main only)
        required: false
        default: main
        type: string
      command:
        description: Command sent on stdin for exec (production output is kept on the VM)
        required: false
        default: ''
        type: string
      apply:
        description: Apply storage reclaim changes (false = dry-run/plan only)
        required: false
        default: false
        type: boolean
      voicevox_archive:
        description: Also reclaim the redundant VOICEVOX installer archive (/opt/voicevox/voicevox.7z.001, ~1.69GiB)
        required: false
        default: false
        type: boolean
      aivis_engine:
        description: Also reclaim the unused AivisSpeech-Engine second TTS (~1.11GiB; audited unreferenced 2026-09-23, guarded on VOICEVOX engine intact)
        required: false
        default: false
        type: boolean
      market_paper_action:
        description: market_paper systemd action (opt-in stocks/FX paper-trading corners; never touches config/market-paper.toml; seed-test-quote is fx-only, writes one fixed-shape deterministic test quote to the approved file-feed path)
        required: false
        default: install
        type: choice
        options: [install, enable, disable, restart, seed-test-quote]
      market_paper_market:
        description: market_paper target market
        required: false
        default: fx
        type: choice
        options: [stocks, fx]
      confirm:
        description: Type production for production exec/configure/disable/bootstrap
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: vm-operations-${{ github.repository }}
  cancel-in-progress: false

jobs:
  operate:
    if: ${{ github.actor_id == 9018513 && github.triggering_actor == 'azumag' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted control plane from current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          path: control
          persist-credentials: false
          submodules: false

      - name: Authorize owner operation
        id: auth
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: python3 control/ops/vm_actions/authorize.py >/dev/null

      - name: Checkout requested code without submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.auth.outputs.ref }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Resolve immutable candidate SHA
        id: candidate
        shell: bash
        env:
          OPERATION: ${{ steps.auth.outputs.operation }}
          TARGET: ${{ steps.auth.outputs.target }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="$(git -C candidate rev-parse HEAD)"
          control_sha="$(git -C control rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" == push && "$sha" != "$EVENT_SHA" ]]; then
            echo "candidate does not match push SHA" >&2
            exit 1
          fi
          if [[ "$OPERATION" == deploy && "$TARGET" == production && "$sha" != "$control_sha" ]]; then
            echo "stale production deployment refused; current main has advanced" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Build inert deployment payload
        if: ${{ steps.auth.outputs.operation == 'deploy' || steps.auth.outputs.operation == 'bootstrap' }}
        shell: bash
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          python3 control/ops/vm_actions/ops_brief.py check-artifact --artifact candidate/ops/runtime_context/ops_brief.json
          git -C candidate bundle create "$RUNNER_TEMP/vm-payload" HEAD
          git bundle list-heads "$RUNNER_TEMP/vm-payload" | awk -v sha="$SHA" '$1 == sha && $2 == "HEAD" { ok=1 } END { exit !ok }'
          git -C candidate bundle verify "$RUNNER_TEMP/vm-payload" >/dev/null

      - name: Configure pinned SSH client
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -m 700 -d "$RUNNER_TEMP/vm-ssh"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm-ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/vm-ssh/key" "$RUNNER_TEMP/vm-ssh/known_hosts"
          printf 'port=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Require parent operations brief gateway capability
        if: ${{ (steps.auth.outputs.operation == 'deploy' || steps.auth.outputs.operation == 'bootstrap') && steps.auth.outputs.target == 'production' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); required={"parent_ops_brief_v1", "projection_no_clobber_v1"}; sys.exit(0 if required.issubset(d.get("capabilities", [])) else "Install the reviewed root-owned ops brief gateway before deployment")'

      - name: Upload candidate to VM staging
        if: ${{ steps.auth.outputs.operation == 'deploy' || steps.auth.outputs.operation == 'bootstrap' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          TARGET: ${{ steps.auth.outputs.target }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "upload docich $TARGET $SHA" < "$RUNNER_TEMP/vm-payload"

      - name: Deploy staged code
        id: deploy_initial
        continue-on-error: true
        if: ${{ steps.auth.outputs.operation == 'deploy' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          TARGET: ${{ steps.auth.outputs.target }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "deploy docich $TARGET $SHA"

      - name: Reconcile reviewed pre-synced Soren checkout
        id: reconcile_presynced
        if: ${{ github.event_name == 'push' && steps.auth.outputs.operation == 'deploy' && steps.auth.outputs.target == 'production' && steps.deploy_initial.outcome == 'failure' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)

          status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA")"
          read -r vm_status old_root pending_count < <(
            python3 - "$status_json" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          print(data.get("status", ""), data.get("sha", ""), len(data.get("pending_repairs") or []))
          PY
          )
          # "drift": root advanced but the submodule was pre-synced ahead of it.
          # "configured": deploy_git()'s own projection check refused a mismatched
          # live file and rolled back cleanly, leaving the VM unchanged at the old
          # baseline (#279). Both need the same reconcile; only recovery_required/
          # bootstrap_required (an in-flight or absent deployment_intent) stay
          # excluded, since those need owner attention rather than automation.
          [[ "$vm_status" == drift || "$vm_status" == configured ]]
          [[ "$pending_count" == 0 ]]
          [[ "$old_root" =~ ^[0-9a-f]{40}$ ]]
          git -C candidate cat-file -e "$old_root^{commit}"
          git -C candidate merge-base --is-ancestor "$old_root" "$SHA"

          old_sub="$(git -C candidate ls-tree "$old_root" -- games/soviet_now | awk '$1 == "160000" && $2 == "commit" {print $3}')"
          new_sub="$(git -C candidate ls-tree "$SHA" -- games/soviet_now | awk '$1 == "160000" && $2 == "commit" {print $3}')"
          [[ "$old_sub" =~ ^[0-9a-f]{40}$ ]]
          [[ "$new_sub" =~ ^[0-9a-f]{40}$ ]]
          # gitlink が不変の deploy reject は pre-synced reconcile の対象ではない。
          # 固定理由で fail-closed にし、normalize/retry を誤誘導しない (#377)。
          if [[ "$old_sub" == "$new_sub" ]]; then
            echo 'reconcile inapplicable: submodule_unchanged' >&2
            exit 1
          fi

          # lineage (#279): converge a changed path only when its live
          # bytes are cryptographically identical (sha256) to some actual
          # reviewed commit's blob for that exact path within old_sub..
          # new_sub -- never a guess, never applied to bytes that don't
          # match real history. Anything else stays fail-closed exactly
          # as before.
          #
          # attestation (#279): a reviewed branch commit dropped from
          # old_sub..new_sub by a squash merge can be attested in
          # reviewed_lineage_attestations.json. Only the exact reviewed
          # sha256+mode recorded for this old/new pair is passed, and the
          # VM converges only on an exact live byte+mode match.
          attest_raw="$(python3 - "$old_sub" "$new_sub" control/ops/vm_actions/reviewed_lineage_attestations.json <<'PY'
          import json, re, sys
          old_sub, new_sub, path = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              data = json.load(open(path, encoding="utf-8"))
          except FileNotFoundError:
              data = {}
          tokens = []
          for item in (data.get("attestations") or []):
              if not isinstance(item, dict) or item.get("projection") != "games/soviet_now":
                  continue
              if item.get("old_sub") != old_sub or item.get("new_sub") != new_sub:
                  continue
              rel = item.get("path")
              if not isinstance(rel, str) or not re.fullmatch(r"[A-Za-z0-9._/-]+", rel):
                  raise SystemExit("invalid attested path")
              tokens += [rel, str(item.get("sha256")), str(item.get("mode"))]
          if tokens:
              sys.stdout.write(" ".join(tokens))
          PY
          )"
          attest_args=()
          if [[ -n "$attest_raw" ]]; then read -r -a attest_args <<< "$attest_raw"; fi
          # Issue #225: reconcile は専用の狭い gateway operation へ送る。
          # stdin は厳格なトークン (old_root/old_sub/new_sub + lineage +
          # attestation triples) のみで、任意シェルは一切流さない。
          # fetch・ reviewed SHA からの helper 読込・固定 argv 実行は
          # VM 側の reconcile op が shell なしで行う。
          {
            printf '%s %s %s lineage' "$old_root" "$old_sub" "$new_sub"
            for token in "${attest_args[@]}"; do printf ' %s' "$token"; done
          } | ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "reconcile docich production $SHA"

      - name: Normalize other owned submodule checkouts
        id: normalize_other
        if: ${{ github.event_name == 'push' && steps.auth.outputs.operation == 'deploy' && steps.auth.outputs.target == 'production' && steps.deploy_initial.outcome == 'failure' && steps.reconcile_presynced.outcome == 'success' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)

          status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA")"
          read -r vm_status old_root pending_count < <(
            python3 - "$status_json" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          print(data.get("status", ""), data.get("sha", ""), len(data.get("pending_repairs") or []))
          PY
          )
          # Mirrors the reconcile step's precondition (#279): a preceding
          # deploy_git() rollback leaves the VM at "configured" (old baseline),
          # not "drift", and both cases are safe to normalize here.
          [[ "$vm_status" == drift || "$vm_status" == configured ]]
          [[ "$pending_count" == 0 ]]
          [[ "$old_root" =~ ^[0-9a-f]{40}$ ]]
          git -C candidate cat-file -e "$old_root^{commit}"
          git -C candidate merge-base --is-ancestor "$old_root" "$SHA"

          {
            printf "python3 - '%s' '%s' <<'PY'\n" \
              /home/ubuntu/docich "$old_root"
            cat control/ops/vm_actions/normalize_other_submodules.py
            printf '\nPY\n'
          } | ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Retry production deploy after exact reconcile
        id: deploy_retry
        if: ${{ steps.reconcile_presynced.outcome == 'success' && steps.normalize_other.outcome == 'success' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "deploy docich production $SHA"

      - name: Fail unresolved deployment
        if: ${{ always() && steps.auth.outputs.operation == 'deploy' && steps.deploy_initial.outcome == 'failure' && steps.deploy_retry.outcome != 'success' }}
        shell: bash
        run: exit 1

      # Canonical deploy hook for the common corner rotation timer. Stage 1
      # keeps the legacy unit names active; the reviewed rename is gated by
      # ops/vm_actions/corner_rotation_timer_migration_epoch (absent = legacy).
      # The hook never restarts the shared display/Soren/audio/stream units.
      - name: Ensure corner rotation timer
        if: ${{ steps.auth.outputs.operation == 'deploy' && steps.auth.outputs.target == 'production' && (steps.deploy_initial.outcome == 'success' || steps.deploy_retry.outcome == 'success') }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          cat control/ops/vm_actions/ensure_corner_rotation_timer.sh |
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Restart radio worker after reviewed Soren runtime update
        if: ${{ github.event_name == 'push' && steps.auth.outputs.operation == 'deploy' && steps.auth.outputs.target == 'production' && (steps.deploy_initial.outcome == 'success' || steps.deploy_retry.outcome == 'success') }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git -C candidate cat-file -e "$BEFORE_SHA^{commit}"

          restart_required=0
          if ! git -C candidate diff --quiet "$BEFORE_SHA" "$SHA" -- games/soviet_now; then
            restart_required=1
          fi
          if ! git -C candidate diff --quiet "$BEFORE_SHA" "$SHA" -- ops/vm_actions/radio_worker_restart_epoch; then
            restart_required=1
          fi
          [[ "$restart_required" -eq 1 ]] || exit 0

          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          cat control/ops/vm_actions/restart_radio_worker.sh | ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Restart docich webui systemd unit
        if: ${{ steps.auth.outputs.operation == 'restart_webui' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          # The helper is a fixed reviewed script from the trusted main checkout.
          # It runs only `systemctl --user` (no root/sudo) on the fixed unit
          # docich-webui.service and fails closed unless the unit is active
          # after the restart. Output stays in the VM-private exec log.
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          cat control/ops/vm_actions/restart_webui.sh | ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Recover a stale non-founding Soren match
        if: ${{ steps.auth.outputs.operation == 'recover_soren_game' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          cat control/ops/vm_actions/recover_soren_game.sh | ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Probe Moomoo JP quote readiness after reviewed production deploy
        id: market_provider_probe
        if: ${{ github.event_name == 'push' && steps.auth.outputs.operation == 'deploy' && steps.auth.outputs.target == 'production' && (steps.deploy_initial.outcome == 'success' || steps.deploy_retry.outcome == 'success') }}
        continue-on-error: true
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          bash -n control/ops/vm_actions/run_market_provider_probe.sh
          python3 -m py_compile candidate/src/docich/trading/markets/provider_probe.py
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          set +e
          cat control/ops/vm_actions/run_market_provider_probe.sh | \
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA" >/dev/null
          rc=$?
          set -e
          case "$rc" in
            0) status=realtime_ready ;;
            10) status=entitled_not_realtime_ready ;;
            11) status=jp_quote_unavailable ;;
            12) status=sdk_unavailable ;;
            13) status=opend_unreachable ;;
            14) status=probe_failed ;;
            15) status=invalid_probe_request ;;
            *) echo "::warning::Moomoo JP read-only provider probe transport/status unavailable (code=$rc). Stocks remain disabled."; exit 0 ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Moomoo JP read-only provider probe: $status"

      - name: Adopt reviewed production baseline
        if: ${{ steps.auth.outputs.operation == 'bootstrap' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "bootstrap docich production $SHA"

      - name: Query VM deployment state
        if: ${{ steps.auth.outputs.operation == 'status' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          TARGET: ${{ steps.auth.outputs.target }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich $TARGET $SHA"

      - name: Query read-only runtime diagnostics
        if: ${{ steps.auth.outputs.operation == 'diagnostics' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          error_file="$RUNNER_TEMP/diagnostics-gateway.err"
          if ! diagnostics_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "diagnostics docich production $SHA" 2>"$error_file")"; then
            if grep -Fq 'VM operation rejected' "$error_file"; then
              echo '::error::Installed VM gateway does not accept diagnostics. Activate the reviewed root-owned gateway through the trusted owner-only privileged install path, then rerun diagnostics.' >&2
            else
              cat "$error_file" >&2
            fi
            exit 1
          fi
          printf '%s\n' "$diagnostics_json"

      - name: Execute owner command on VM
        if: ${{ steps.auth.outputs.operation == 'exec' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          TARGET: ${{ steps.auth.outputs.target }}
          SHA: ${{ steps.candidate.outputs.sha }}
          VM_COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          [[ -n "$VM_COMMAND" ]]
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          printf '%s' "$VM_COMMAND" | ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich $TARGET $SHA"

      - name: Configure Jev comment classifier from environment secret
        if: ${{ steps.auth.outputs.operation == 'configure_jev' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$TYPESAFE_API_KEY" ]]
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          # The stdin payload is only the secret. The VM gateway loads the
          # configurator from this exact reviewed SHA; no caller shell is run.
          printf '%s' "$TYPESAFE_API_KEY" | ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "configure_jev docich production $SHA"

      - name: Disable Jev comment classifier
        if: ${{ steps.auth.outputs.operation == 'disable_jev' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          < /dev/null ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "disable_jev docich production $SHA"

      - name: Route Jev classification through the docich core (direct)
        if: ${{ steps.auth.outputs.operation == 'configure_jev_route_direct' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          # No secret on stdin: the direct route reuses #678's already-live
          # TYPESAFE_API_KEY on the running worker; it is never sent here.
          < /dev/null ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "configure_jev_route_direct docich production $SHA"

      - name: Route Jev classification through the docich core (vercel)
        if: ${{ steps.auth.outputs.operation == 'configure_jev_route_vercel' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
          DOCICH_JEV_VERCEL_API_KEY: ${{ secrets.DOCICH_JEV_VERCEL_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$DOCICH_JEV_VERCEL_API_KEY" ]]
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          # The stdin payload is only the Vercel secret. The VM gateway loads
          # the configurator from this exact reviewed SHA; no caller shell is run.
          printf '%s' "$DOCICH_JEV_VERCEL_API_KEY" | ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "configure_jev_route_vercel docich production $SHA"

      - name: Disable docich Jev route delegation
        if: ${{ steps.auth.outputs.operation == 'disable_jev_route' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          < /dev/null ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "disable_jev_route docich production $SHA"

      - name: Run reviewed storage reclaim
        if: ${{ steps.auth.outputs.operation == 'reclaim' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
          APPLY: ${{ inputs.apply }}
          VOICEVOX_ARCHIVE: ${{ inputs.voicevox_archive }}
          AIVIS_ENGINE: ${{ inputs.aivis_engine }}
        run: |
          set -euo pipefail
          # The helper is a fixed reviewed script from the trusted main checkout.
          # No network input is interpolated; only the reviewed flags are passed.
          apply_flag=0
          if [[ "${APPLY:-false}" == "true" ]]; then apply_flag=1; fi
          voicevox_flag=0
          if [[ "${VOICEVOX_ARCHIVE:-false}" == "true" ]]; then voicevox_flag=1; fi
          aivis_flag=0
          if [[ "${AIVIS_ENGINE:-false}" == "true" ]]; then aivis_flag=1; fi
          echo "storage reclaim apply=${apply_flag} voicevox_archive=${voicevox_flag} aivis_engine=${aivis_flag}"
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          { printf 'APPLY=%s\nVOICEVOX_ARCHIVE=%s\nAIVIS_ENGINE=%s\n' "$apply_flag" "$voicevox_flag" "$aivis_flag"; cat control/ops/vm_actions/storage_reclaim.sh; } | ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Manage market-paper systemd units (opt-in stocks/FX paper corners)
        if: ${{ steps.auth.outputs.operation == 'market_paper' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
          MP_ACTION: ${{ inputs.market_paper_action }}
          MP_MARKET: ${{ inputs.market_paper_market }}
        run: |
          set -euo pipefail
          # The helper is a fixed reviewed script from the trusted main checkout.
          # It never edits config/market-paper.toml, never touches broker
          # credentials or sends a real order, and only runs `systemctl --user`
          # (no root/sudo) on the fixed unit set for the chosen market. The
          # action/market pair is re-validated here (defense in depth beyond
          # the workflow_dispatch choice inputs) and again inside the script.
          case "$MP_ACTION" in install|enable|disable|restart|seed-test-quote) ;; *) echo "invalid market_paper_action" >&2; exit 1 ;; esac
          case "$MP_MARKET" in stocks|fx) ;; *) echo "invalid market_paper_market" >&2; exit 1 ;; esac
          echo "market_paper action=${MP_ACTION} market=${MP_MARKET}"
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          { printf 'MARKET_PAPER_ACTION=%s\nMARKET_PAPER_MARKET=%s\n' "$MP_ACTION" "$MP_MARKET"; cat control/ops/vm_actions/manage_market_paper_units.sh; } | ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Rebaseline production to the reviewed current HEAD
        if: ${{ steps.auth.outputs.operation == 'rebaseline' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "rebaseline docich production $SHA"
