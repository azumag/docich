name: VM operations

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: status
        type: choice
        options: [status, deploy, exec, bootstrap, diagnostics]
      target:
        description: VM target
        required: true
        default: preview
        type: choice
        options: [preview, production]
      ref:
        description: Branch or full commit SHA (production deploy is main only)
        required: false
        default: main
        type: string
      command:
        description: Command sent on stdin for exec (production output is kept on the VM)
        required: false
        default: ''
        type: string
      confirm:
        description: Type production for production exec/bootstrap
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: vm-operations-${{ github.repository }}
  cancel-in-progress: false

jobs:
  operate:
    if: ${{ github.actor_id == 9018513 && github.triggering_actor == 'azumag' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted control plane from current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          path: control
          persist-credentials: false
          submodules: false

      - name: Authorize owner operation
        id: auth
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: python3 control/ops/vm_actions/authorize.py >/dev/null

      - name: Checkout requested code without submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.auth.outputs.ref }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Resolve immutable candidate SHA
        id: candidate
        shell: bash
        env:
          OPERATION: ${{ steps.auth.outputs.operation }}
          TARGET: ${{ steps.auth.outputs.target }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="$(git -C candidate rev-parse HEAD)"
          control_sha="$(git -C control rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" == push && "$sha" != "$EVENT_SHA" ]]; then
            echo "candidate does not match push SHA" >&2
            exit 1
          fi
          if [[ "$OPERATION" == deploy && "$TARGET" == production && "$sha" != "$control_sha" ]]; then
            echo "stale production deployment refused; current main has advanced" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Build inert deployment payload
        if: ${{ steps.auth.outputs.operation == 'deploy' || steps.auth.outputs.operation == 'bootstrap' }}
        shell: bash
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          git -C candidate bundle create "$RUNNER_TEMP/vm-payload" HEAD
          git bundle list-heads "$RUNNER_TEMP/vm-payload" | awk -v sha="$SHA" '$1 == sha && $2 == "HEAD" { ok=1 } END { exit !ok }'
          git -C candidate bundle verify "$RUNNER_TEMP/vm-payload" >/dev/null

      - name: Configure pinned SSH client
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -m 700 -d "$RUNNER_TEMP/vm-ssh"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm-ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/vm-ssh/key" "$RUNNER_TEMP/vm-ssh/known_hosts"
          printf 'port=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Upload candidate to VM staging
        if: ${{ steps.auth.outputs.operation == 'deploy' || steps.auth.outputs.operation == 'bootstrap' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          TARGET: ${{ steps.auth.outputs.target }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "upload docich $TARGET $SHA" < "$RUNNER_TEMP/vm-payload"

      - name: Deploy staged code
        id: deploy_initial
        continue-on-error: true
        if: ${{ steps.auth.outputs.operation == 'deploy' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          TARGET: ${{ steps.auth.outputs.target }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "deploy docich $TARGET $SHA"

      - name: Reconcile reviewed pre-synced Soren checkout
        id: reconcile_presynced
        if: ${{ github.event_name == 'push' && steps.auth.outputs.operation == 'deploy' && steps.auth.outputs.target == 'production' && steps.deploy_initial.outcome == 'failure' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)

          status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA")"
          read -r vm_status old_root pending_count < <(
            python3 - "$status_json" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          print(data.get("status", ""), data.get("sha", ""), len(data.get("pending_repairs") or []))
          PY
          )
          # "drift": root advanced but the submodule was pre-synced ahead of it.
          # "configured": deploy_git()'s own projection check refused a mismatched
          # live file and rolled back cleanly, leaving the VM unchanged at the old
          # baseline (#279). Both need the same reconcile; only recovery_required/
          # bootstrap_required (an in-flight or absent deployment_intent) stay
          # excluded, since those need owner attention rather than automation.
          [[ "$vm_status" == drift || "$vm_status" == configured ]]
          [[ "$pending_count" == 0 ]]
          [[ "$old_root" =~ ^[0-9a-f]{40}$ ]]
          git -C candidate cat-file -e "$old_root^{commit}"
          git -C candidate merge-base --is-ancestor "$old_root" "$SHA"

          old_sub="$(git -C candidate ls-tree "$old_root" -- games/soviet_now | awk '$1 == "160000" && $2 == "commit" {print $3}')"
          new_sub="$(git -C candidate ls-tree "$SHA" -- games/soviet_now | awk '$1 == "160000" && $2 == "commit" {print $3}')"
          [[ "$old_sub" =~ ^[0-9a-f]{40}$ ]]
          [[ "$new_sub" =~ ^[0-9a-f]{40}$ ]]
          [[ "$old_sub" != "$new_sub" ]]

          {
            # lineage (#279): converge a changed path only when its live
            # bytes are cryptographically identical (sha256) to some actual
            # reviewed commit's blob for that exact path within old_sub..
            # new_sub -- never a guess, never applied to bytes that don't
            # match real history. Anything else stays fail-closed exactly
            # as before.
            #
            # attestation (#279): a reviewed commit dropped from
            # old_sub..new_sub by a squash merge can be attested in
            # reviewed_lineage_attestations.json. Only the exact reviewed
            # sha256+mode recorded for this old/new pair is passed, and the
            # VM converges only on an exact live byte+mode match.
            attest_raw="$(python3 - "$old_sub" "$new_sub" control/ops/vm_actions/reviewed_lineage_attestations.json <<'PY'
          import json, re, sys
          old_sub, new_sub, path = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              data = json.load(open(path, encoding="utf-8"))
          except FileNotFoundError:
              data = {}
          tokens = []
          for item in (data.get("attestations") or []):
              if not isinstance(item, dict) or item.get("projection") != "games/soviet_now":
                  continue
              if item.get("old_sub") != old_sub or item.get("new_sub") != new_sub:
                  continue
              rel = item.get("path")
              if not isinstance(rel, str) or not re.fullmatch(r"[A-Za-z0-9._/-]+", rel):
                  raise SystemExit("invalid attested path")
              tokens += [rel, str(item.get("sha256")), str(item.get("mode"))]
          if tokens:
              sys.stdout.write(" ".join(tokens))
          PY
          )"
            attest_args=()
            if [[ -n "$attest_raw" ]]; then read -r -a attest_args <<< "$attest_raw"; fi
            printf "python3 - '%s' '%s' '%s' '%s' '%s' '%s'" \
              /home/ubuntu/docich "$old_root" "$old_sub" "$new_sub" games/soviet_now lineage
            for token in "${attest_args[@]}"; do printf " '%s'" "$token"; done
            printf " <<'PY'\n"
            cat control/ops/vm_actions/reconcile_presynced_submodule.py
            printf '\nPY\n'
          } | ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Normalize other owned submodule checkouts
        id: normalize_other
        if: ${{ github.event_name == 'push' && steps.auth.outputs.operation == 'deploy' && steps.auth.outputs.target == 'production' && steps.deploy_initial.outcome == 'failure' && steps.reconcile_presynced.outcome == 'success' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)

          status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA")"
          read -r vm_status old_root pending_count < <(
            python3 - "$status_json" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          print(data.get("status", ""), data.get("sha", ""), len(data.get("pending_repairs") or []))
          PY
          )
          # Mirrors the reconcile step's precondition (#279): a preceding
          # deploy_git() rollback leaves the VM at "configured" (old baseline),
          # not "drift", and both cases are safe to normalize here.
          [[ "$vm_status" == drift || "$vm_status" == configured ]]
          [[ "$pending_count" == 0 ]]
          [[ "$old_root" =~ ^[0-9a-f]{40}$ ]]
          git -C candidate cat-file -e "$old_root^{commit}"
          git -C candidate merge-base --is-ancestor "$old_root" "$SHA"

          {
            printf "python3 - '%s' '%s' <<'PY'\n" \
              /home/ubuntu/docich "$old_root"
            cat control/ops/vm_actions/normalize_other_submodules.py
            printf '\nPY\n'
          } | ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA"

      - name: Retry production deploy after exact reconcile
        id: deploy_retry
        if: ${{ steps.reconcile_presynced.outcome == 'success' && steps.normalize_other.outcome == 'success' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "deploy docich production $SHA"

      - name: Fail unresolved deployment
        if: ${{ always() && steps.auth.outputs.operation == 'deploy' && steps.deploy_initial.outcome == 'failure' && steps.deploy_retry.outcome != 'success' }}
        shell: bash
        run: exit 1

      - name: Adopt reviewed production baseline
        if: ${{ steps.auth.outputs.operation == 'bootstrap' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "bootstrap docich production $SHA"

      - name: Query VM deployment state
        if: ${{ steps.auth.outputs.operation == 'status' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          TARGET: ${{ steps.auth.outputs.target }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich $TARGET $SHA"

      - name: Query read-only runtime diagnostics
        if: ${{ steps.auth.outputs.operation == 'diagnostics' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          error_file="$RUNNER_TEMP/diagnostics-gateway.err"
          if ! diagnostics_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "diagnostics docich production $SHA" 2>"$error_file")"; then
            if grep -Fq 'VM operation rejected' "$error_file"; then
              echo '::error::Installed VM gateway does not accept diagnostics. Activate the reviewed root-owned gateway through the trusted owner-only privileged install path, then rerun diagnostics.' >&2
            else
              cat "$error_file" >&2
            fi
            exit 1
          fi
          printf '%s\n' "$diagnostics_json"

      - name: Execute owner command on VM
        if: ${{ steps.auth.outputs.operation == 'exec' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          TARGET: ${{ steps.auth.outputs.target }}
          SHA: ${{ steps.candidate.outputs.sha }}
          VM_COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          [[ -n "$VM_COMMAND" ]]
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          printf '%s' "$VM_COMMAND" | ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich $TARGET $SHA"
