name: Weather start query

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  start:
    permissions:
      contents: read
      issues: write
    if: >-
      github.actor_id == 9018513 &&
      github.triggering_actor == 'azumag' &&
      github.event.issue.number == 1766 &&
      github.event.comment.user.id == 9018513 &&
      github.event.comment.body == '/weather-start production'
    concurrency:
      group: retro-corner-operator-${{ github.repository }}
      cancel-in-progress: false
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout trusted start code from event main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          submodules: false

      - name: Authorize fixed owner command
        id: auth
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_SHA: ${{ github.sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_AUTHOR_ID: ${{ github.event.comment.user.id }}
        run: python3 control/ops/vm_actions/authorize_weather_start_query.py

      - name: Require the event to remain current main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C control rev-parse HEAD)" == "$GITHUB_SHA" ]]
          current="$(git -C control ls-remote --exit-code origin refs/heads/main | cut -f1)"
          [[ "$current" == "$GITHUB_SHA" ]]
          umask 077
          install -m 700 -d "$RUNNER_TEMP/weather-start/ssh"

      - name: Configure pinned SSH transport
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          work="$RUNNER_TEMP/weather-start"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$work/ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$work/ssh/known_hosts"
          chmod 600 "$work/ssh/"*
          printf 'WEATHER_SSH_PORT=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Require production to equal event SHA
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/weather-start"
          ssh_args=(-F /dev/null -T -p "$WEATHER_SSH_PORT" -i "$work/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o ConnectTimeout=20)
          current="$(git -C control ls-remote --exit-code origin refs/heads/main | cut -f1)"
          [[ "$current" == "$SHA" ]]
          status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA")"
          python3 - "$status_json" "$SHA" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("status") != "configured" or data.get("sha") != sys.argv[2]:
              raise SystemExit("production is not exactly the event SHA")
          PY

      - name: Queue only Weather through the common coordinator
        id: start
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/weather-start"
          ssh_args=(-F /dev/null -T -p "$WEATHER_SSH_PORT" -i "$work/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o ConnectTimeout=20)
          set +e
          (ulimit -f 16; timeout --kill-after=5s 120s \
            ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" \
              "exec docich production $SHA") \
            < control/ops/vm_actions/start_weather_corner.sh \
            > "$work/start.stdout" 2> "$work/start.stderr"
          rc=$?
          set -e
          if (( rc != 0 )); then
            reason="$(python3 - "$work/start.stdout" "$SHA" <<'PY'
          import json, pathlib, sys
          path, expected_sha = pathlib.Path(sys.argv[1]), sys.argv[2]
          fixed = {
              70: "rotation_disabled",
              71: "recovery_required",
              72: "clock_regressed",
              73: "weather_not_eligible",
              74: "manual_queue_conflict",
              75: "state_unavailable",
              76: "config_invalid",
              77: "queue_rejected",
              78: "rotation_adapter_state",
              79: "rotation_adapter_timestamp",
              80: "rotation_catalog_mismatch",
              81: "rotation_execution_error",
              82: "rotation_execution_unverified",
              83: "rotation_invalid_state",
              84: "rotation_unexpected",
              85: "invalid_value",
              86: "missing_key",
              87: "type_mismatch",
              88: "dependency_unavailable",
              89: "adapter_failure",
          }
          reason = "transport_failure"
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
              code = data.get("exit_code")
              if (data.get("status") == "executed"
                      and data.get("sha") == expected_sha
                      and data.get("output") == "withheld"
                      and type(code) is int):
                  reason = fixed.get(code, "queue_rejected")
          except (OSError, ValueError, TypeError):
              pass
          print(reason)
          PY
            )"
            printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
            echo "::error::Weather start request rejected: $reason"
            exit 1
          fi
          printf '%s\n' 'reason=queued' >> "$GITHUB_OUTPUT"
          rm -f "$work/start.stdout" "$work/start.stderr"

      - name: Observe Weather execution and audio progress
        id: observe
        if: ${{ steps.start.outcome == 'success' }}
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/weather-start"
          ssh_args=(-F /dev/null -T -p "$WEATHER_SSH_PORT" -i "$work/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o ConnectTimeout=20)
          seen_active=false
          max_index=-1
          terminal=not_observed
          end_reason=none
          restored=unknown
          audio_status=unknown
          active_game=unknown
          soren_loop=unknown
          soren_state=unknown
          soren_age=-1
          soren_resumed=unknown
          for _ in $(seq 1 216); do
            current="$(git -C control ls-remote --exit-code origin refs/heads/main 2>/dev/null | cut -f1 || true)"
            if [[ "$current" =~ ^[0-9a-f]{40}$ ]] &&
               status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $current" 2>/dev/null)" &&
               python3 - "$status_json" "$current" <<'PY'
          import json, sys
          try:
              data = json.loads(sys.argv[1])
          except (TypeError, ValueError):
              raise SystemExit(1)
          raise SystemExit(0 if data.get("status") == "configured" and data.get("sha") == sys.argv[2] else 1)
          PY
            then
              if diagnostics_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "diagnostics docich production $current" 2>/dev/null)"; then
                projection="$(python3 - "$diagnostics_json" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          corners = data.get("corners") if isinstance(data, dict) else {}
          corners = corners if isinstance(corners, dict) else {}
          weather = corners.get("weather_corner")
          weather = weather if isinstance(weather, dict) else {}
          switch = corners.get("game_switch")
          switch = switch if isinstance(switch, dict) else {}
          workers = data.get("workers") if isinstance(data, dict) else {}
          workers = workers if isinstance(workers, dict) else {}
          details = workers.get("details")
          details = details if isinstance(details, dict) else {}
          loop = details.get("soren_loop")
          loop = loop if isinstance(loop, dict) else {}
          soren = corners.get("soren_game")
          soren = soren if isinstance(soren, dict) else {}
          status = weather.get("status") if weather.get("status") in {
              "idle", "starting", "active", "restoring", "completed", "interrupted", "failed",
          } else "unknown"
          selection = weather.get("selection_kind") if weather.get("selection_kind") in {
              "manual", "automatic", "unknown",
          } else "unknown"
          audio = weather.get("audio_delivery_status") if weather.get("audio_delivery_status") in {
              "running", "stopping", "completed", "stopped", "failed", "unknown",
          } else "unknown"
          index = weather.get("audio_next_index")
          if type(index) is not int or not 0 <= index <= 13:
              index = -1
          end = weather.get("end_reason") or "none"
          restored = weather.get("restored_runtime_matches_current")
          restored = "true" if restored is True else "false" if restored is False else "unknown"
          game = switch.get("active_game")
          game = game if isinstance(game, str) and game else "none"
          if loop.get("paused") is True:
              loop_status = "paused"
          elif loop.get("alive") is True:
              loop_status = "alive"
          elif loop.get("alive") is False:
              loop_status = "down"
          else:
              loop_status = "unknown"
          soren_state = soren.get("state")
          if soren_state not in {"MOVE", "DROP", "WAITING", "STOP", "GAMEOVER"}:
              soren_state = "unknown"
          soren_age = soren.get("age_sec")
          if type(soren_age) is not int or not 0 <= soren_age <= 86400:
              soren_age = -1
          runner_alive = soren.get("runner_alive")
          soren_ready = (
              game == "sorengame"
              and switch.get("phase") == "ready"
              and loop_status == "alive"
              and runner_alive is True
              and soren_state in {"MOVE", "DROP", "WAITING"}
              and 0 <= soren_age <= 30
          )
          if game != "sorengame":
              soren_resumed = "not_applicable"
          else:
              soren_resumed = "true" if soren_ready else "false"
          print("|".join((
              status, selection, audio, str(index), end, restored, game,
              loop_status, soren_state, str(soren_age), soren_resumed,
          )))
          PY
                )"
                IFS='|' read -r status selection audio index end restored_now game loop_now soren_state_now soren_age_now soren_resumed_now <<<"$projection"
                audio_status="$audio"
                active_game="$game"
                soren_loop="$loop_now"
                soren_state="$soren_state_now"
                soren_age="$soren_age_now"
                soren_resumed="$soren_resumed_now"
                if (( index > max_index )); then max_index="$index"; fi
                if [[ "$selection" == manual && ( "$status" == starting || "$status" == active || "$status" == restoring ) ]]; then
                  seen_active=true
                fi
                if [[ "$seen_active" == true && ( "$status" == completed || "$status" == interrupted || "$status" == failed ) ]]; then
                  terminal="$status"
                  end_reason="$end"
                  restored="$restored_now"
                fi
                # A restored Soren frame is not enough: keep observing until
                # the required loop/runner are alive and game_state is fresh.
                if [[ "$terminal" != not_observed && "$restored" == true ]]; then
                  if [[ "$active_game" != sorengame || "$soren_resumed" == true ]]; then
                    break
                  fi
                fi
              fi
            fi
            sleep 5
          done
          {
            echo "seen_active=$seen_active"
            echo "max_index=$max_index"
            echo "terminal=$terminal"
            echo "end_reason=$end_reason"
            echo "restored=$restored"
            echo "audio_status=$audio_status"
            echo "active_game=$active_game"
            echo "soren_loop=$soren_loop"
            echo "soren_state=$soren_state"
            echo "soren_age=$soren_age"
            echo "soren_resumed=$soren_resumed"
          } >> "$GITHUB_OUTPUT"

      - name: Return fixed result metadata to the control Issue
        if: ${{ always() && steps.auth.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          START_OUTCOME: ${{ steps.start.outcome }}
          START_REASON: ${{ steps.start.outputs.reason }}
          SEEN_ACTIVE: ${{ steps.observe.outputs.seen_active }}
          MAX_INDEX: ${{ steps.observe.outputs.max_index }}
          TERMINAL: ${{ steps.observe.outputs.terminal }}
          END_REASON: ${{ steps.observe.outputs.end_reason }}
          RESTORED: ${{ steps.observe.outputs.restored }}
          AUDIO_STATUS: ${{ steps.observe.outputs.audio_status }}
          ACTIVE_GAME: ${{ steps.observe.outputs.active_game }}
          SOREN_LOOP: ${{ steps.observe.outputs.soren_loop }}
          SOREN_STATE: ${{ steps.observe.outputs.soren_state }}
          SOREN_AGE: ${{ steps.observe.outputs.soren_age }}
          SOREN_RESUMED: ${{ steps.observe.outputs.soren_resumed }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/weather-start"
          install -m 700 -d "$work"
          python3 - "$SOURCE_COMMENT_ID" "$RUN_ID" "$RUN_ATTEMPT" "$RUN_SHA" "$START_OUTCOME" "$START_REASON" "$SEEN_ACTIVE" "$MAX_INDEX" "$TERMINAL" "$END_REASON" "$RESTORED" "$AUDIO_STATUS" "$ACTIVE_GAME" "$SOREN_LOOP" "$SOREN_STATE" "$SOREN_AGE" "$SOREN_RESUMED" > "$work/reply.json" <<'PY'
          import json, re, sys
          (comment_id, run_id, attempt, sha, outcome, reason, seen_active, max_index,
           terminal, end_reason, restored, audio_status, active_game, soren_loop,
           soren_state, soren_age, soren_resumed) = sys.argv[1:]
          if not (comment_id.isdigit() and run_id.isdigit() and attempt.isdigit()
                  and re.fullmatch(r"[0-9a-f]{40}", sha)
                  and outcome in {"success", "failure", "cancelled", "skipped"}):
              raise SystemExit("invalid fixed reply metadata")
          allowed_reasons = {
              "queued", "rotation_disabled", "recovery_required", "clock_regressed",
              "weather_not_eligible", "manual_queue_conflict", "state_unavailable",
              "config_invalid", "queue_rejected", "rotation_adapter_state",
              "rotation_adapter_timestamp", "rotation_catalog_mismatch",
              "rotation_execution_error", "rotation_execution_unverified",
              "rotation_invalid_state", "rotation_unexpected", "invalid_value",
              "missing_key", "type_mismatch", "dependency_unavailable",
              "adapter_failure", "transport_failure", "not_run",
          }
          if not reason:
              reason = "not_run"
          if reason not in allowed_reasons:
              raise SystemExit("invalid fixed reply reason")
          safe_token = re.compile(r"[A-Za-z0-9_.:-]{1,64}\Z")
          fields = [seen_active or "unknown", max_index or "-1", terminal or "not_observed",
                    end_reason or "none", restored or "unknown", audio_status or "unknown",
                    active_game or "unknown", soren_loop or "unknown",
                    soren_state or "unknown", soren_age or "-1", soren_resumed or "unknown"]
          if not all(safe_token.fullmatch(value) for value in fields):
              raise SystemExit("invalid observation metadata")
          body = "\n".join((
              f"Request: https://github.com/azumag/docich/issues/1766#issuecomment-{comment_id}",
              f"Run: https://github.com/azumag/docich/actions/runs/{run_id}",
              f"Attempt: {attempt}",
              f"SHA: {sha}",
              f"Result: {outcome}",
              f"Reason: {reason}",
              f"Weather active observed: {seen_active or 'unknown'}",
              f"Audio max next_index: {max_index or '-1'}",
              f"Terminal: {terminal or 'not_observed'}",
              f"End reason: {end_reason or 'none'}",
              f"Audio status: {audio_status or 'unknown'}",
              f"Restored: {restored or 'unknown'}",
              f"Active game after observation: {active_game or 'unknown'}",
              f"Soren loop after restore: {soren_loop or 'unknown'}",
              f"Soren game state: {soren_state or 'unknown'}",
              f"Soren game state age sec: {soren_age or '-1'}",
              f"Soren resumed: {soren_resumed or 'unknown'}",
          ))
          json.dump({"body": body}, sys.stdout, separators=(",", ":"))
          PY
          gh api --method POST repos/azumag/docich/issues/1766/comments \
            --input "$work/reply.json" > /dev/null

      - name: Clear runner staging
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/weather-start"
