name: Hanjuku recovered egg contracts
on:
  pull_request:
    paths:
      - 'src/docich/hanjuku*.py'
      - 'tests/test_hanjuku*.py'
      - 'requirements*.txt'
      - '.github/workflows/hanjuku-egg-stock-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/docich/hanjuku*.py'
      - 'tests/test_hanjuku*.py'
      - 'requirements*.txt'
      - '.github/workflows/hanjuku-egg-stock-ci.yml'
permissions:
  contents: read
concurrency:
  group: hanjuku-recovered-egg-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  recovered-egg-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
      - name: Install existing test dependencies
        run: python3 -m pip install -q -r requirements-test.txt
      - name: Validate stock observations and emergency defense integration
        run: python3 -m pytest -q tests/test_hanjuku_egg_stock.py tests/test_hanjuku_recovered_egg_battle.py tests/test_hanjuku_retreat_egg_status.py tests/test_hanjuku_empty_eggs.py tests/test_hanjuku_egg_timing.py
