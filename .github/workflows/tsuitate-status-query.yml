name: Tsuitate status query

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: tsuitate-status-query-${{ github.repository }}
  cancel-in-progress: false

jobs:
  query:
    permissions:
      contents: read
      issues: write
    if: >-
      github.actor_id == 9018513 &&
      github.triggering_actor == 'azumag' &&
      github.event.issue.number == 2938 &&
      github.event.comment.user.id == 9018513 &&
      startsWith(github.event.comment.body, '/tsuitate-status production hourly-')
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted query code from event main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          submodules: false

      - name: Authorize fixed owner query
        id: auth
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_SHA: ${{ github.sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_AUTHOR_ID: ${{ github.event.comment.user.id }}
        run: python3 control/ops/vm_actions/authorize_tsuitate_status_query.py >/dev/null

      - name: Require the event to remain current main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C control rev-parse HEAD)" == "$GITHUB_SHA" ]]
          current="$(git -C control ls-remote --exit-code origin refs/heads/main | cut -f1)"
          [[ "$current" == "$GITHUB_SHA" ]]
          umask 077
          install -m 700 -d "$RUNNER_TEMP/tsuitate-status/output" "$RUNNER_TEMP/tsuitate-status/ssh"

      - name: Configure pinned SSH transport
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          work="$RUNNER_TEMP/tsuitate-status"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$work/ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$work/ssh/known_hosts"
          chmod 600 "$work/ssh/"*
          printf 'TSUITATE_STATUS_SSH_PORT=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Require production to equal event SHA
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tsuitate-status"
          ssh_args=(-F /dev/null -T -p "$TSUITATE_STATUS_SSH_PORT" -i "$work/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o ConnectTimeout=20)
          current="$(git -C control ls-remote --exit-code origin refs/heads/main | cut -f1)"
          [[ "$current" == "$SHA" ]]
          status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA")"
          python3 - "$status_json" "$SHA" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("status") != "configured" or data.get("sha") != sys.argv[2]:
              raise SystemExit("production is not exactly the event SHA")
          PY

      - name: Query one Tsuitate run receipt
        id: status
        continue-on-error: true
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ github.sha }}
          TSUITATE_RUN_ID: ${{ steps.auth.outputs.run_id }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$TSUITATE_RUN_ID" =~ ^hourly-[0-9]{10}$ ]]
          work="$RUNNER_TEMP/tsuitate-status"
          ssh_args=(-F /dev/null -T -p "$TSUITATE_STATUS_SSH_PORT" -i "$work/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o ConnectTimeout=20)
          if ! (ulimit -f 32; timeout --kill-after=5s 30s ssh "${ssh_args[@]}" \
              "$VM_SSH_USER@$VM_SSH_HOST" \
              "tsuitate_status_query docich production $SHA $TSUITATE_RUN_ID" \
              > "$work/output/status.json" 2> "$work/transport.stderr"); then
            rm -f "$work/output/status.json"
            echo '::error::Tsuitate status query rejected or unavailable'
            exit 1
          fi
          python3 - "$work/output/status.json" "$TSUITATE_RUN_ID" <<'PY'
          import pathlib, sys
          sys.path.insert(0, "control/ops/vm_actions")
          from tsuitate_status_query_reply import load_status
          load_status(pathlib.Path(sys.argv[1]), sys.argv[2])
          PY
          rm -f "$work/transport.stderr"

      - name: Recheck current protected main before publishing
        if: steps.status.outcome == 'success'
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current="$(git -C control ls-remote --exit-code origin refs/heads/main | cut -f1)"
          [[ "$current" == "$SHA" ]]

      - name: Return bounded status metadata to the control Issue
        if: ${{ always() && steps.auth.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
          ACTIONS_RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          TSUITATE_RUN_ID: ${{ steps.auth.outputs.run_id }}
          QUERY_OUTCOME: ${{ steps.status.outcome }}
          STATUS_FILE: ${{ runner.temp }}/tsuitate-status/output/status.json
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/tsuitate-status"
          python3 control/ops/vm_actions/tsuitate_status_query_reply.py > "$work/reply.json"
          gh api --method POST repos/azumag/docich/issues/2938/comments \
            --input "$work/reply.json" > /dev/null

      - name: Fail when query did not succeed
        if: steps.status.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Clear runner staging
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/tsuitate-status"
