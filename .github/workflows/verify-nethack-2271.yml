name: Verify NetHack 2271 (isolated source only)

on:
  push:
    branches: ['verify/nethack-2271-20261015']

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'azumag/docich' && github.actor == 'azumag' && github.ref == 'refs/heads/verify/nethack-2271-20261015'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install repository test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Reproduce the regressions on the exact original sources
        run: python3 ops/local/verify_nethack_2271.py red
      - name: Apply the reviewed fixed-source changes
        run: python3 ops/local/verify_nethack_2271.py patch
      - name: NetHack and broadcast regressions
        run: python3 -m pytest -q tests/test_nethack*.py tests/test_broadcast_view_standard.py --junitxml=/tmp/nethack-2271-green.xml
      - name: Syntax and whitespace
        run: |
          python3 -m compileall -q src tests
          git diff --check
      - name: Store tested public source blobs (no ref or production writes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/local/verify_nethack_2271.py publish
