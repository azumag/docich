name: VM storage monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vm-storage-monitor-${{ github.repository }}
  cancel-in-progress: false

jobs:
  monitor:
    if: >-
      ${{ github.ref == 'refs/heads/main' && github.ref_protected == true &&
          (github.event_name == 'schedule' ||
           (github.actor_id == 9018513 && github.triggering_actor == 'azumag')) }}
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WARN_PERCENT: '80'
      CRITICAL_PERCENT: '90'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
          submodules: false

      - name: Configure pinned SSH client
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -m 700 -d "$RUNNER_TEMP/vm-ssh"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm-ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/vm-ssh/key" "$RUNNER_TEMP/vm-ssh/known_hosts"
          printf 'port=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Read production storage status
        id: storage
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $sha")"
          printf '%s\n' "$status_json" > "$RUNNER_TEMP/storage-status.json"
          python3 - "$RUNNER_TEMP/storage-status.json" "$WARN_PERCENT" "$CRITICAL_PERCENT" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          storage=data.get('storage') or {}
          used=int(storage['used_percent']); available=int(storage['available_bytes']); total=int(storage['total_bytes'])
          warn=int(sys.argv[2]); critical=int(sys.argv[3])
          severity='critical' if used >= critical else 'warn' if used >= warn else 'ok'
          print(f'used_percent={used}')
          print(f'available_bytes={available}')
          print(f'total_bytes={total}')
          print(f'severity={severity}')
          PY

      - name: Read sanitized runtime diagnostics
        id: runtime
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          error_file="$RUNNER_TEMP/runtime-diagnostics.err"
          if ! diagnostics_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "diagnostics docich production $sha" 2>"$error_file")"; then
            echo 'severity=warn' >> "$GITHUB_OUTPUT"
            echo 'summary=diagnostics_unavailable=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$diagnostics_json" > "$RUNNER_TEMP/runtime-diagnostics.json"
          python3 - "$RUNNER_TEMP/runtime-diagnostics.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          wrapper=json.load(open(sys.argv[1],encoding='utf-8'))
          if wrapper.get('status') != 'diagnosed' or not isinstance(wrapper.get('diagnostics'), dict):
              raise SystemExit('invalid diagnostics envelope')
          data=wrapper['diagnostics']
          severity=data.get('status')
          if severity not in {'ok','warn','critical'}:
              raise SystemExit('invalid diagnostics severity')
          workers=data.get('workers') or {}
          queues=data.get('queues') or {}
          ai=data.get('ai') or {}
          improvement=data.get('improvement') or {}
          def nlist(name):
              value=workers.get(name)
              return len(value) if isinstance(value,list) else 0
          def integer(mapping,name):
              value=mapping.get(name,0)
              return value if isinstance(value,int) and not isinstance(value,bool) and value >= 0 else 0
          parts=[
              f"required_down={nlist('required_down')}",
              f"required_stale={nlist('required_stale')}",
              f"paused={nlist('paused')}",
              f"duplicates={nlist('duplicates')}",
              f"zombies={nlist('zombies')}",
              f"stale_pid_files={nlist('stale_pid_files')}",
              f"unregistered={nlist('unregistered')}",
              f"stale_locks={integer(queues,'stale_locks')}",
              f"queue_giveups_15m={integer(queues,'queue_giveups_15m')}",
              f"ai_failures_15m={integer(ai,'failures_15m')}",
              f"ai_rate_limits_15m={integer(ai,'rate_limits_15m')}",
              f"ai_fallbacks_15m={integer(ai,'fallbacks_15m')}",
              f"ai_all_failed_15m={integer(ai,'all_failed_15m')}",
              f"improvement_stale={int(improvement.get('stale') is True)}",
              f"retry_pending={int(improvement.get('retry_pending') is True)}",
          ]
          print(f'severity={severity}')
          print('summary='+','.join(parts))
          PY

      - name: Update deduplicated GitHub alert
        env:
          SEVERITY: ${{ steps.storage.outputs.severity }}
          USED_PERCENT: ${{ steps.storage.outputs.used_percent }}
          AVAILABLE_BYTES: ${{ steps.storage.outputs.available_bytes }}
          TOTAL_BYTES: ${{ steps.storage.outputs.total_bytes }}
        run: |
          set -euo pipefail
          prefix='[VM storage]'
          mapfile -t alerts < <(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == "[VM storage] WARN disk usage alert" or .title == "[VM storage] CRITICAL disk usage alert") | "\(.number)\t\(.title)"')
          if [[ "$SEVERITY" == ok ]]; then
            for entry in "${alerts[@]}"; do
              number="${entry%%$'\t'*}"
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Disk usage recovered below ${WARN_PERCENT}% (current: ${USED_PERCENT}%)."
            done
            echo "Disk usage ${USED_PERCENT}%: no alert."
            exit 0
          fi
          upper="$(printf '%s' "$SEVERITY" | tr '[:lower:]' '[:upper:]')"
          title="${prefix} ${upper} disk usage alert"
          for entry in "${alerts[@]}"; do
            number="${entry%%$'\t'*}"; existing="${entry#*$'\t'}"
            [[ "$existing" == "$title" ]] && { echo "Existing alert #${number} remains open; suppressing duplicate."; exit 0; }
          done
          for entry in "${alerts[@]}"; do
            number="${entry%%$'\t'*}"
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Storage severity changed to ${upper} at ${USED_PERCENT}% usage."
          done
          available="$(numfmt --to=iec-i --suffix=B "$AVAILABLE_BYTES")"
          total="$(numfmt --to=iec-i --suffix=B "$TOTAL_BYTES")"
          body="$(cat <<EOF
          VM storage pressure detected by the owner-only docich monitor.

          - Severity: ${upper}
          - Used: ${USED_PERCENT}%
          - Available: ${available}
          - Total: ${total}
          - Warning threshold: ${WARN_PERCENT}%
          - Critical threshold: ${CRITICAL_PERCENT}%
          - Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          The monitor reports capacity only; it does not include VM logs, paths, credentials, or command output.
          EOF
          )"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          if [[ "$SEVERITY" == critical ]]; then
            echo "::error::VM storage pressure is critical (${USED_PERCENT}%)."
          else
            echo "::warning::VM storage pressure is high (${USED_PERCENT}%)."
          fi

      - name: Update deduplicated runtime health alert
        env:
          SEVERITY: ${{ steps.runtime.outputs.severity }}
          SUMMARY: ${{ steps.runtime.outputs.summary }}
        run: |
          set -euo pipefail
          prefix='[VM runtime]'
          mapfile -t alerts < <(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == "[VM runtime] WARN runtime health alert" or .title == "[VM runtime] CRITICAL runtime health alert") | "\(.number)\t\(.title)"')
          if [[ "$SEVERITY" == ok ]]; then
            for entry in "${alerts[@]}"; do
              number="${entry%%$'\t'*}"
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Runtime diagnostics recovered to OK."
            done
            echo "Runtime diagnostics OK: ${SUMMARY}"
            exit 0
          fi
          upper="$(printf '%s' "$SEVERITY" | tr '[:lower:]' '[:upper:]')"
          title="${prefix} ${upper} runtime health alert"
          body="$(cat <<EOF
          Runtime health degradation detected by the owner-only read-only diagnostics path.

          - Severity: ${upper}
          - Summary: ${SUMMARY}
          - Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          The public alert contains counts and booleans only. It never publishes raw diagnostics, worker names, paths, logs, model names, prompts, credentials, or command output.
          EOF
          )"
          for entry in "${alerts[@]}"; do
            number="${entry%%$'\t'*}"; existing="${entry#*$'\t'}"
            if [[ "$existing" == "$title" ]]; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
              echo "Existing runtime alert #${number} refreshed with the latest sanitized snapshot."
              exit 0
            fi
          done
          for entry in "${alerts[@]}"; do
            number="${entry%%$'\t'*}"
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Runtime severity changed to ${upper}."
          done
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          if [[ "$SEVERITY" == critical ]]; then
            echo "::error::VM runtime health is critical (${SUMMARY})."
          else
            echo "::warning::VM runtime health is degraded (${SUMMARY})."
          fi