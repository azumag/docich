name: Soren merge-top A/B probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/soren-merge-top-ab-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soren-merge-top-ab-probe-${{ github.repository }}
  cancel-in-progress: false

jobs:
  start-probe:
    if: ${{ github.repository_owner == 'azumag' && github.repository_owner_id == '9018513' && github.actor == 'azumag' && github.actor_id == 9018513 && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout current protected main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
          submodules: false

      - name: Require event SHA to equal current main
        id: current
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$sha" == "$EVENT_SHA" ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH client
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -m 700 -d "$RUNNER_TEMP/vm-ssh"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm-ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/vm-ssh/key" "$RUNNER_TEMP/vm-ssh/known_hosts"
          printf 'port=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Wait for production to equal current main
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.current.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          for _ in $(seq 1 48); do
            status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA" || true)"
            if python3 - "$status_json" "$SHA" <<'PY'
          import json, sys
          try:
              data = json.loads(sys.argv[1])
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if data.get('status') == 'configured' and data.get('sha') == sys.argv[2] else 1)
          PY
            then
              exit 0
            fi
            sleep 5
          done
          echo 'production did not converge to current protected main' >&2
          exit 1

      - name: Replace current A/B with adopting post-merge-risk A/B
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.current.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          cat <<'SH' | ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA" >/dev/null
          set -euo pipefail
          cd /home/ubuntu/soren

          # env-only winner promotion landed in soviet_now #377. Refuse to start
          # an adopting A/B until the VM checkout contains that exact fix.
          expected_soviet_sha='3f67cbf159dc59da35ad2cdff3d2f483dade7a3b'
          git fetch -q origin main
          git merge-base --is-ancestor "$expected_soviet_sha" origin/main || exit 68
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            git diff --quiet && git diff --cached --quiet || exit 69
            git merge --ff-only origin/main >/dev/null || exit 70
          fi
          git merge-base --is-ancestor "$expected_soviet_sha" HEAD || exit 71

          source ./eloop_lib.sh >/dev/null 2>&1
          declare -F _ab_finish_without_envonly_promotion >/dev/null 2>&1 || exit 72

          state="${AB_STATE_FILE:-tmp/state/ab_state.json}"
          active_branch="${ACTIVE_BRANCH_FILE:-tmp/state/active_branch.json}"

          # Supersede the old observe-only experiment by keeping A/current root.
          if [[ -f "$state" ]]; then
            ./tools/ab_ctl.sh finish A superseded_by_adopting_merge_top_probe >/dev/null
          fi

          [[ ! -f "$state" ]] || exit 73
          [[ ! -f "$active_branch" ]] || exit 74
          root="$(_ab_hash "${STRATEGY_FILE:-strategy.py}")"
          [[ -n "$root" ]] || exit 75

          # Explicitly pin the baseline. If A wins this remains 2; if B wins the
          # #377 finish wrapper promotes B's mode=1 into this persistent setting.
          ./set_toggle.sh ANALYZE_BOARD_MERGE_TOP_MODEL=2 >/dev/null
          ./set_toggle.sh AB_GATE_ENABLED=1 >/dev/null
          ./set_toggle.sh AB_GATE_DRY_RUN=0 >/dev/null
          export AB_A_ENV='ANALYZE_BOARD_MERGE_TOP_MODEL=2'
          export AB_B_ENV='ANALYZE_BOARD_MERGE_TOP_MODEL=1'

          # tools/ab_ctl.sh deliberately disables nounset before invoking the
          # shared strategy validator; preserve that contract on this direct path.
          set +u

          # This is an env-only A/B: B is byte-for-byte the already-running A.
          # Permit the start only when the candidate hash exactly equals root.
          validate_strategy_with_helpers() {
            local target="$1" target_hash
            target_hash="$(_ab_hash "$target")"
            [[ -n "$target_hash" && "$target_hash" == "$root" ]]
          }

          bundle="$(mktemp -d "${TMP_STATE_DIR:-tmp/state}/merge_top_ab.XXXXXX")"
          trap 'rm -rf "$bundle"' EXIT
          cp -p "${STRATEGY_FILE:-strategy.py}" "$bundle/strategy.py"
          started=0
          for _ in $(seq 1 30); do
            rc=0
            _ab_start_from_bundle "$bundle" ABBA || rc=$?
            if [[ "$rc" -eq 0 ]]; then
              started=1
              break
            fi
            if [[ "$rc" -ne 75 ]]; then
              echo "merge-top A/B start failed rc=$rc" >&2
              exit 76
            fi
            sleep 10
          done
          [[ "$started" -eq 1 ]] || exit 77

          a="$(_ab_state_get a_hash)"
          b="$(_ab_state_get b_hash)"
          a_env="$(_ab_state_get a_env)"
          b_env="$(_ab_state_get b_env)"
          [[ "$a" == "$root" && "$b" == "$root" ]] || exit 78
          [[ "$a_env" == 'ANALYZE_BOARD_MERGE_TOP_MODEL=2' ]] || exit 79
          [[ "$b_env" == 'ANALYZE_BOARD_MERGE_TOP_MODEL=1' ]] || exit 80
          [[ "$(_ab_env_value ANALYZE_BOARD_MERGE_TOP_MODEL)" == '2' ]] || exit 81
          [[ "$(_ab_env_value AB_GATE_DRY_RUN)" == '0' ]] || exit 82
          reload_runtime_toggles_force >/dev/null 2>&1
          _ab_active >/dev/null 2>&1 || exit 83
          SH

          echo 'adopting merge-top A/B probe is active'
