name: Patch Soren91 evidence JSON newline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'azumag/docich' &&
      github.actor_id == 9018513 &&
      github.event.pull_request.head.repo.full_name == 'azumag/docich' &&
      github.event.pull_request.head.ref == 'fix/soren91-evidence-json-newline-702' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact owner branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/soren91-evidence-json-newline-702
          persist-credentials: true
          submodules: false
          fetch-depth: 0

      - name: Apply exact one-line fix and remove patch workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('ops/vm_actions/collect_diagnostics.py')
          text = source.read_text(encoding='utf-8')
          old = 'sys.stdout.write(text + "\\\\n")'
          new = 'sys.stdout.write(text + "\\n")'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one escaped-newline collector write')
          source.write_text(text.replace(old, new), encoding='utf-8')

          workflow = Path('.github/workflows/patch-soren91-evidence-newline.yml')
          workflow.unlink()
          PY
          git diff --check
          python3 -m unittest ops.vm_actions.tests.test_soren91_evidence_diagnostics_budget

      - name: Commit only reviewed fix and regression test
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test "$(git status --short | wc -l)" -eq 2
          git status --short | grep -F ' D .github/workflows/patch-soren91-evidence-newline.yml'
          git status --short | grep -F ' M ops/vm_actions/collect_diagnostics.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/patch-soren91-evidence-newline.yml ops/vm_actions/collect_diagnostics.py
          git commit -m 'fix: emit valid manual evidence JSON newline'
          git push origin HEAD:fix/soren91-evidence-json-newline-702
