name: Temporary budget detail patch
on:
  push:
    branches: [ops/radio-budget-detail-773]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'azumag/docich' && github.ref == 'refs/heads/ops/radio-budget-detail-773'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python3 ops/vm_actions/_temporary_apply_budget_detail_773.py
      - name: Validate regression tests
        run: |
          python3 -m py_compile ops/vm_actions/collect_diagnostics.py ops/vm_actions/summarize_runtime_queue_attribution.py
          python3 -m unittest discover -s ops/vm_actions/tests -p 'test_ai_budget_exhausted*.py'
      - name: Commit source patch
        run: |
          git config user.name 'docich automation'
          git config user.email 'docich@example.invalid'
          git add ops/vm_actions/collect_diagnostics.py ops/vm_actions/summarize_runtime_queue_attribution.py
          git diff --cached --check
          git commit -m 'ops: expose radio budget dispatch detail'
          git push origin HEAD:ops/radio-budget-detail-773
