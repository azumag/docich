name: Hanjuku current force focused verification
on:
  push:
    branches: ['fix/hanjuku-current-force-egg-hold-20261009']
    paths: ['.github/workflows/hanjuku-current-force-retry-temp.yml']
permissions:
  contents: write
jobs:
  verify-and-publish:
    if: github.repository == 'azumag/docich' && github.ref == 'refs/heads/fix/hanjuku-current-force-egg-hold-20261009'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
      - name: Install existing test dependencies
        run: python3 -m pip install -q -r requirements-test.txt
      - name: Apply reviewed instruction check and exact patch
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          import textwrap
          from pathlib import Path
          data = Path('.github/workflows/hanjuku-current-force-verify-temp.yml').read_bytes()
          digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert digest == 'e61a54d05a17aa215ca0029ee55fb8725169f6c8'
          blocks = re.findall(r"          python3 - <<'PY'\n(.*?)\n          PY\n", data.decode(), re.S)
          assert len(blocks) == 3
          # Baseline XML block was already run at the same runtime/test blobs.
          for index in (0, 2):
              exec(compile(textwrap.dedent(blocks[index]), '<reviewed-block>', 'exec'), {})
          PY
      - name: Verify new regressions
        run: python3 -m pytest -q --tb=short tests/test_hanjuku_egg_hold_current_force.py
      - name: Verify adjacent contracts without inventing a test filename
        run: |
          python3 -m pytest -q --tb=short tests/test_hanjuku_egg_hold.py tests/test_hanjuku_survival.py tests/test_hanjuku_card_damage_gate.py tests/test_hanjuku_chart_bot.py tests/test_hanjuku_gameover_feedback.py tests/test_hanjuku_egg_stock.py tests/test_hanjuku_recovered_egg_battle.py tests/test_hanjuku_empty_eggs.py
          python3 -m py_compile src/docich/hanjuku_policy.py tests/test_hanjuku_egg_hold_current_force.py
          git diff --check
      - name: Publish runtime and docs only through the branch lease
        run: |
          branch='fix/hanjuku-current-force-egg-hold-20261009'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          # The connector will register CI coverage separately; do not request
          # workflow-writing permission for the temporary test runner.
          git restore -- .github/workflows/hanjuku-predictions-ci.yml
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == {'src/docich/hanjuku_policy.py', 'docs/hanjuku_egg_safe_melee.md'}
          PY
          git add src/docich/hanjuku_policy.py docs/hanjuku_egg_safe_melee.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(hanjuku): require current valid armies before conserving eggs'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
