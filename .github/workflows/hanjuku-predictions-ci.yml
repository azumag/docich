name: Hanjuku prediction contracts
on:
  pull_request:
    paths:
      - 'src/docich/hanjuku*.py'
      - 'src/docich/config.py'
      - 'src/docich/game_switch.py'
      - 'src/docich/retroarch_boundary.py'
      - 'src/docich/retro_corner.py'
      - 'src/docich/corner_*.py'
      - 'src/docich/naming.py'
      - 'src/docich/adapters/**'
      - 'src/docich/pulse_volume.py'
      - 'src/docich/**'
      - '!src/docich/discord_chat.py'
      - '!src/docich/discord_memory.py'
      - '!src/docich/reply_routing.py'
      - '!src/docich/reply_research.py'
      - '!src/docich/reply_research_bridge.py'
      - '!src/docich/reply_research_egress.py'
      - '!src/docich/earthquake_parser.py'
      - '!src/docich/weather.py'
      - '!src/docich/weather_view.py'
      - '!src/docich/weather_audio.py'
      - '!src/docich/weather_corner.py'
      - '!src/docich/soren_weather_audio.py'
      - '!src/docich/adapters/weather_program.py'
      - 'brains/hanjuku/**'
      - 'config/games/hanjuku-hero.toml'
      - 'tests/test_hanjuku*.py'
      - 'tests/test_retro_corner.py'
      - 'tests/test_corner_rotation.py'
      - 'ops/vm_actions/collect_diagnostics.py'
      - 'ops/vm_actions/gateway.py'
      - 'ops/vm_actions/runtime_registry.py'
      - 'ops/vm_actions/tests/test_collect_diagnostics.py'
      - 'ops/vm_actions/tests/test_diagnostics_projection_review.py'
      - 'ops/vm_actions/tests/test_hanjuku_narration_diagnostics.py'
      - 'ops/vm_actions/tests/test_hanjuku_scene_diagnostics.py'
      - 'requirements-test.txt'
      - '.github/workflows/hanjuku-predictions-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/docich/hanjuku*.py'
      - 'src/docich/config.py'
      - 'src/docich/game_switch.py'
      - 'src/docich/retroarch_boundary.py'
      - 'src/docich/retro_corner.py'
      - 'src/docich/corner_*.py'
      - 'src/docich/naming.py'
      - 'src/docich/adapters/**'
      - 'src/docich/pulse_volume.py'
      - 'src/docich/**'
      - '!src/docich/discord_chat.py'
      - '!src/docich/discord_memory.py'
      - '!src/docich/reply_routing.py'
      - '!src/docich/reply_research.py'
      - '!src/docich/reply_research_bridge.py'
      - '!src/docich/reply_research_egress.py'
      - '!src/docich/earthquake_parser.py'
      - '!src/docich/weather.py'
      - '!src/docich/weather_view.py'
      - '!src/docich/weather_audio.py'
      - '!src/docich/weather_corner.py'
      - '!src/docich/soren_weather_audio.py'
      - '!src/docich/adapters/weather_program.py'
      - 'brains/hanjuku/**'
      - 'config/games/hanjuku-hero.toml'
      - 'tests/test_hanjuku*.py'
      - 'tests/test_retro_corner.py'
      - 'tests/test_corner_rotation.py'
      - 'ops/vm_actions/collect_diagnostics.py'
      - 'ops/vm_actions/gateway.py'
      - 'ops/vm_actions/runtime_registry.py'
      - 'ops/vm_actions/tests/test_collect_diagnostics.py'
      - 'ops/vm_actions/tests/test_diagnostics_projection_review.py'
      - 'ops/vm_actions/tests/test_hanjuku_narration_diagnostics.py'
      - 'ops/vm_actions/tests/test_hanjuku_scene_diagnostics.py'
      - 'requirements-test.txt'
      - '.github/workflows/hanjuku-predictions-ci.yml'
permissions:
  contents: read

concurrency:
  group: hanjuku-predictions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prediction-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install test requirements
        run: python3 -m pip install -r requirements-test.txt
      - name: Offline prediction and corner regressions
        env:
          PYTHONPATH: src
        run: |
          python3 -m pytest -q tests/test_hanjuku_predictions.py tests/test_hanjuku_script.py tests/test_hanjuku_chart_bot.py tests/test_hanjuku_sortie_evidence.py tests/test_hanjuku_card_damage.py tests/test_hanjuku_card_damage_gate.py tests/test_hanjuku_defender_succession.py tests/test_hanjuku_diagnostics.py tests/test_hanjuku_fixed_narration_disabled.py tests/test_retro_corner.py tests/test_corner_rotation.py ops/vm_actions/tests/test_collect_diagnostics.py ops/vm_actions/tests/test_diagnostics_projection_review.py ops/vm_actions/tests/test_hanjuku_narration_diagnostics.py
          python3 -m pytest -q ops/vm_actions/tests/test_hanjuku_scene_diagnostics.py
