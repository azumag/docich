permissions:
  contents: read

concurrency:
  group: hanjuku-predictions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prediction-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install test requirements
        run: python3 -m pip install -r requirements-test.txt
      - name: Offline prediction and corner regressions
        env:
          PYTHONPATH: src
        run: |
          python3 -m pytest -q tests/test_hanjuku_predictions.py tests/test_hanjuku_script.py tests/test_hanjuku_chart_bot.py tests/test_hanjuku_empty_eggs.py tests/test_hanjuku_egg_stock.py tests/test_hanjuku_egg_hold_current_force.py tests/test_hanjuku_finisher_conservation.py tests/test_hanjuku_recovery_before_recruit.py tests/test_hanjuku_survey_cache.py tests/test_hanjuku_egg_timing.py tests/test_hanjuku_card_inventory_deadline.py tests/test_hanjuku_trade_refusal.py tests/test_hanjuku_goninja_cash_floor.py tests/test_hanjuku_camp_observation.py tests/test_hanjuku_critical_partial_state.py tests/test_hanjuku_retreat_recheck.py tests/test_hanjuku_retreat_egg_status.py tests/test_hanjuku_camp_proof_binding.py tests/test_hanjuku_defense_read_model.py tests/test_hanjuku_sortie_evidence.py tests/test_hanjuku_card_damage.py tests/test_hanjuku_card_damage_gate.py tests/test_hanjuku_defender_succession.py tests/test_hanjuku_diagnostics.py tests/test_hanjuku_fixed_narration_disabled.py tests/test_retro_corner.py tests/test_corner_rotation.py ops/vm_actions/tests/test_collect_diagnostics.py ops/vm_actions/tests/test_diagnostics_projection_review.py ops/vm_actions/tests/test_hanjuku_narration_diagnostics.py
          python3 -m pytest -q ops/vm_actions/tests/test_hanjuku_scene_diagnostics.py tests/test_hanjuku_gameover_feedback.py tests/test_hanjuku_history.py
      - name: Adjusted source-defense and chart regressions
        env:
          PYTHONPATH: src
        run: |
          python3 -m pytest -q tests/test_hanjuku_adjusted_source_defense.py tests/test_hanjuku_retake_guard.py tests/test_hanjuku_chart_adjust.py
