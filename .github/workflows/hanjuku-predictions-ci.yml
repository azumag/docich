name: Hanjuku regressions
on:
  pull_request:
    paths:
      - 'src/docich/hanjuku*.py'
      - 'src/docich/retro_corner.py'
      - 'src/docich/retro_corner_manual.py'
      - 'src/docich/corner_rotation.py'
      - 'src/docich/corner_boundary.py'
      - 'src/docich/corner_improve.py'
      - 'src/docich/adapters/retroarch.py'
      - 'src/docich/game_switch.py'
      - 'src/docich/presentation.py'
      - 'brains/hanjuku/**'
      - 'config/games/hanjuku-hero.toml'
      - 'tests/test_hanjuku*.py'
      - 'tests/test_retro_corner.py'
      - 'tests/test_corner_rotation.py'
      - 'ops/vm_actions/collect_diagnostics.py'
      - 'ops/vm_actions/tests/test_collect_diagnostics.py'
      - 'ops/vm_actions/tests/test_diagnostics_projection_review.py'
      - 'ops/vm_actions/tests/test_hanjuku_narration_diagnostics.py'
      - 'requirements-test.txt'
      - '.github/workflows/hanjuku-predictions-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/docich/hanjuku*.py'
      - 'src/docich/retro_corner.py'
      - 'src/docich/retro_corner_manual.py'
      - 'src/docich/corner_rotation.py'
      - 'src/docich/corner_boundary.py'
      - 'src/docich/corner_improve.py'
      - 'src/docich/adapters/retroarch.py'
      - 'src/docich/game_switch.py'
      - 'src/docich/presentation.py'
      - 'brains/hanjuku/**'
      - 'config/games/hanjuku-hero.toml'
      - 'tests/test_hanjuku*.py'
      - 'tests/test_retro_corner.py'
      - 'tests/test_corner_rotation.py'
      - 'ops/vm_actions/collect_diagnostics.py'
      - 'ops/vm_actions/tests/test_collect_diagnostics.py'
      - 'ops/vm_actions/tests/test_diagnostics_projection_review.py'
      - 'ops/vm_actions/tests/test_hanjuku_narration_diagnostics.py'
      - 'requirements-test.txt'
      - '.github/workflows/hanjuku-predictions-ci.yml'
permissions:
  contents: read

concurrency:
  group: hanjuku-regressions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hanjuku-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install test requirements
        run: python3 -m pip install -r requirements-test.txt
      - name: Hanjuku offline regressions
        env:
          PYTHONPATH: src
        run: |
          python3 -m pytest -q tests/test_hanjuku*.py tests/test_retro_corner.py tests/test_corner_rotation.py ops/vm_actions/tests/test_collect_diagnostics.py ops/vm_actions/tests/test_diagnostics_projection_review.py ops/vm_actions/tests/test_hanjuku_narration_diagnostics.py
