name: Overlay queue interoperability

on:
  pull_request:
    paths:
      - '.github/workflows/overlay-queue-interoperability.yml'
      - 'src/docich/overlay*.py'
      - 'src/docich/webui.py'
      - 'src/docich/config.py'
      - 'src/docich/runtime_backend.py'
      - 'src/docich/trading/**'
      - 'src/docich/hanjuku_narration.py'
      - 'games/soviet_now'
      - '.github/scripts/soren_gitlink_gate.py'
      - 'tests/test_overlay_interop.py'
      - 'tests/test_overlay_queue.py'
      - 'tests/test_audio_delivery.py'
      - 'tests/test_trading_soren_output.py'
      - 'requirements-test.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/overlay-queue-interoperability.yml'
      - 'src/docich/overlay*.py'
      - 'src/docich/webui.py'
      - 'src/docich/config.py'
      - 'src/docich/runtime_backend.py'
      - 'src/docich/trading/**'
      - 'src/docich/hanjuku_narration.py'
      - 'games/soviet_now'
      - '.github/scripts/soren_gitlink_gate.py'
      - 'tests/test_overlay_interop.py'
      - 'tests/test_overlay_queue.py'
      - 'tests/test_audio_delivery.py'
      - 'tests/test_trading_soren_output.py'
      - 'requirements-test.txt'

permissions:
  contents: read

concurrency:
  group: overlay-queue-interoperability-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  soren-gitlink-gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - name: Decide whether this integration is affected
        id: decide
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run="$(python3 .github/scripts/soren_gitlink_gate.py \
            --before "$BEFORE_SHA" \
            --after "$AFTER_SHA" \
            --root-path '.github/workflows/overlay-queue-interoperability.yml' \
            --root-path 'src/docich/overlay*.py' \
            --root-path 'src/docich/webui.py' \
            --root-path 'src/docich/config.py' \
            --root-path 'src/docich/runtime_backend.py' \
            --root-path 'src/docich/trading/**' \
            --root-path 'src/docich/hanjuku_narration.py' \
            --root-path 'tests/test_overlay_interop.py' \
            --root-path 'tests/test_overlay_queue.py' \
            --root-path 'tests/test_audio_delivery.py' \
            --root-path 'tests/test_trading_soren_output.py' \
            --root-path 'requirements-test.txt' \
            --root-path '.github/scripts/soren_gitlink_gate.py' \
            --soren-path 'overlay_notify.sh' \
            --soren-path 'generate_event_overlay.py' \
            --soren-path 'core/config.sh' \
            --soren-path 'broadcast/comment.sh' \
            --soren-path 'broadcast/comment_lib.sh')"
          [[ "$run" == true || "$run" == false ]]
          echo "run=$run" >> "$GITHUB_OUTPUT"

  overlay-queue-interoperability:
    needs: soren-gitlink-gate
    if: needs.soren-gitlink-gate.outputs.run == 'true'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install test dependencies in an isolated environment
        run: python3 -m venv .ci-overlay-venv && .ci-overlay-venv/bin/python -m pip install -r requirements-test.txt
      - name: Native and docich queue interoperability on macOS
        run: .ci-overlay-venv/bin/python -m pytest -q tests/test_overlay_interop.py tests/test_overlay_queue.py tests/test_audio_delivery.py tests/test_trading_soren_output.py
