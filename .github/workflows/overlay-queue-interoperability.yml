name: Overlay queue interoperability

on:
  pull_request:
    paths:
      - '.github/workflows/overlay-queue-interoperability.yml'
      - 'src/docich/overlay*.py'
      - 'src/docich/webui.py'
      - 'src/docich/config.py'
      - 'src/docich/runtime_backend.py'
      - 'src/docich/trading/**'
      - 'src/docich/hanjuku_narration.py'
      - 'games/soviet_now'
      - 'tests/test_overlay_interop.py'
      - 'tests/test_overlay_queue.py'
      - 'tests/test_audio_delivery.py'
      - 'tests/test_trading_soren_output.py'
      - 'requirements-test.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/overlay-queue-interoperability.yml'
      - 'src/docich/overlay*.py'
      - 'src/docich/webui.py'
      - 'src/docich/config.py'
      - 'src/docich/runtime_backend.py'
      - 'src/docich/trading/**'
      - 'src/docich/hanjuku_narration.py'
      - 'games/soviet_now'
      - 'tests/test_overlay_interop.py'
      - 'tests/test_overlay_queue.py'
      - 'tests/test_audio_delivery.py'
      - 'tests/test_trading_soren_output.py'
      - 'requirements-test.txt'

permissions:
  contents: read

concurrency:
  group: overlay-queue-interoperability-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  overlay-queue-interoperability:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install test dependencies in an isolated environment
        run: python3 -m venv .ci-overlay-venv && .ci-overlay-venv/bin/python -m pip install -r requirements-test.txt
      - name: Native and docich queue interoperability on macOS
        run: .ci-overlay-venv/bin/python -m pytest -q tests/test_overlay_interop.py tests/test_overlay_queue.py tests/test_audio_delivery.py tests/test_trading_soren_output.py
