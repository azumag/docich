name: NetHack lifecycle isolated verification

on:
  push:
    branches: [fix/nethack-terminal-lifecycle-1969]
    paths:
      - '.github/workflows/nethack-lifecycle-isolated.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'azumag/docich' && github.ref == 'refs/heads/fix/nethack-terminal-lifecycle-1969' && github.actor == 'azumag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/nethack-terminal-lifecycle-1969
          fetch-depth: 0
          submodules: false
      - name: Verify exact locally tested patch bytes
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          data = Path('ops/patches/nethack-lifecycle-1969.patch.b64').read_text().strip()
          # Restore a transport omission before accepting the SHA-256 pinned patch.
          missing = ''
          if 'BNfvLK1echMTOL' in data:
              data = data.replace('BNfvLK1echMTOL', missing, 1)
          patch = gzip.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '31a9007a175d977541375285d69c3244fa9369b1dfc00dddf9626bf1d8ee689e'
          Path('/tmp/nethack-1969.patch').write_bytes(patch)
          PY
      - name: Incorporate current main and apply reviewed repair
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git apply --check /tmp/nethack-1969.patch
          git apply --index /tmp/nethack-1969.patch
          git diff --cached --check
      - name: Isolated regression verification
        run: |
          python3 -m pip install 'pytest==9.1.1'
          PYTHONPATH=src python3 -m pytest -q tests/test_nethack_terminal_lifecycle.py tests/test_coordinator.py tests/test_game_switch.py tests/test_soren_adapter.py tests/test_nethack_adapter.py tests/test_nethack_run.py tests/test_nethack_corner.py tests/test_round_boundary.py tests/test_nethack_live_turns.py
      - name: Commit only to the isolated repair branch
        run: |
          git commit -m 'fix(nethack): fence terminal rollback and reconcile failed return history (#1969)'
          git push origin HEAD:refs/heads/fix/nethack-terminal-lifecycle-1969
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/docich-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nethack-lifecycle-verified
          path: |
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/docich-source.tar.gz
          retention-days: 1
          if-no-files-found: error
