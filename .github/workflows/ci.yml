name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  feature-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Crypto trading contracts
        run: >-
          python3 -m pytest -q
          tests/test_trading_risk.py tests/test_trading_paper.py
          tests/test_trading_bitbank.py tests/test_trading_cli.py
      - name: Retro corner contract
        run: python3 -m pytest -q tests/test_retro_corner.py tests/test_retro_corner_manual.py tests/test_config.py tests/test_robots_config.py
      - name: Transactional switch contract
        run: >-
          python3 -m pytest -q
          tests/test_game_switch.py tests/test_coordinator.py
          tests/test_coordinator_adapter.py tests/test_cli_coordinator.py
      - name: Round-boundary contract
        run: python3 -m pytest -q tests/test_round_boundary.py
      - name: Robots resolver contract
        run: python3 -m pytest -q tests/test_resolver.py
      - name: Founding policy hotfix contract
        run: python3 -m unittest discover -s tests -p test_founding_policy_hotfix.py
      - name: Soren NEWS spam wait hotfix contract
        run: python3 -m pytest -q tests/test_soren_news_spam_improve_wait_hotfix.py
      - name: Soren NEWS spam queue-wait hotfix contract
        run: python3 -m pytest -q tests/test_soren_news_spam_queue_wait_hotfix.py
      - name: Improvement command deployment contract
        run: python3 -m unittest discover -s tests -p test_improve_command_deploy.py
      - name: Analysis contract deployment scope
        run: python3 -m unittest discover -s tests -p test_analysis_contract_deploy.py
      - name: Shadow single-cycle contract
        run: python3 -m unittest tests.test_shadow_once
      - name: Compile Python
        run: python3 -m compileall -q src tests

  spawn-lease-interoperability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check out reviewed Soren spawn protocol
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: azumag/soviet_now
          ref: c025faae892168454512e7dc16b72ba6f22ea431
          path: .ci-spawn-source
          persist-credentials: false
      - name: Real installer/runtime interoperability
        env:
          SOREN_SPAWN_SOURCE: ${{ github.workspace }}/.ci-spawn-source
        run: python3 -m unittest discover -s tests -p 'test_founding_policy*.py'
      - name: Real runtime regressions
        working-directory: .ci-spawn-source
        run: python3 -m unittest tests.test_spawn_guard_lease
