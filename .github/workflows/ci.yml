name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  feature-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Spoken text quality contracts
        run: python3 -m pytest -q tests/test_spoken_text_quality.py tests/test_model_output_guard.py
      - name: Crypto trading contracts
        run: >-
          python3 -m pytest -q
          tests/test_trading_risk.py tests/test_trading_paper.py
          tests/test_trading_bitbank.py tests/test_trading_cli.py
          tests/test_trading_market_data.py tests/test_trading_strategies.py
          tests/test_trading_strategy_cli.py tests/test_trading_relative_value.py
          tests/test_trading_arbitrage.py tests/test_trading_depth.py
          tests/test_trading_depth_cli.py tests/test_trading_fee_model.py
          tests/test_trading_multileg_settlement.py
          tests/test_trading_settlement_ledger.py tests/test_trading_settlement_history_cli.py
          tests/test_trading_events.py tests/test_trading_worker.py tests/test_trading_worker_lifecycle.py
          tests/test_trading_presentation.py tests/test_trading_notifications.py
          tests/test_trading_dashboard_snapshot.py tests/test_trading_dashboard_server.py
          tests/test_trading_dashboard_activity_failover.py tests/test_trading_timeframe_chart.py
          tests/test_program_view.py tests/test_program_view_browser_path.py
          tests/test_trading_strategy_store.py tests/test_trading_strategy_lab.py tests/test_trading_strategy_metrics.py tests/test_trading_corner_script.py
          tests/test_trading_corner_research.py tests/test_trading_paper_improve.py tests/test_paper_improve_retry.py
          tests/test_paper_improve_lifecycle.py
          tests/test_trading_free_strategy_accounting.py tests/test_trading_free_strategy_post_fill_drawdown.py
          tests/test_trading_free_strategy_cli.py tests/test_trading_free_strategy_worker.py
          tests/test_trading_free_strategy_dashboard.py tests/test_trading_free_strategy_terminal.py
          tests/test_trading_free_strategy_state.py tests/test_trading_free_strategy_paused.py
          tests/test_trading_free_strategy_entrypoint.py tests/test_trading_free_strategy_capacity.py
          tests/test_trading_free_strategy_systemd.py
          tests/test_trading_soren_output.py tests/test_overlay_queue.py tests/test_audio_delivery.py tests/test_overlay_interop.py
      - name: Container host provisioning contract
        run: python3 -m pytest -q tests/test_container_host_provisioning.py
      - name: Retro corner contract
        run: >-
          python3 -m pytest -q
          tests/test_retro_corner.py tests/test_retro_corner_manual.py
          tests/test_corner_rotation.py tests/test_corner_rotation_execution.py
          tests/test_failed_improvement_terminal_recovery_required.py
          tests/test_hanjuku_retro_registration.py tests/test_hanjuku_brain.py
          tests/test_hanjuku_script.py tests/test_hanjuku_chart_bot.py tests/test_hanjuku_map_events.py
          tests/test_hanjuku_boss_events.py tests/test_hanjuku_sortie_evidence.py
          tests/test_agent_loop.py tests/test_agent_fence.py tests/test_agent_action_lock.py
          tests/test_nethack_corner.py tests/test_nethack_corner_p5.py tests/test_nethack_corner_force_recover.py
          tests/test_nethack_run.py tests/test_nethack_run_recovery.py
          tests/test_nethack_spectator.py tests/test_nethack_spectator_live.py
          tests/test_nethack_observation.py tests/test_nethack_policy.py tests/test_nethack_exploration.py
          tests/test_nethack_progress.py
          tests/test_nethack_narration.py
          tests/test_nethack_inventory.py tests/test_nethack_strategy.py tests/test_nethack_strategist.py
          tests/test_nethack_advisory.py tests/test_nethack_shadow.py tests/test_nethack_shadow_source.py
          tests/test_nethack_shadow_eval.py tests/test_nethack_retrospective.py tests/test_nethack_regression.py
          tests/test_nethack_candidate_eval.py tests/test_nethack_candidate_shadow.py
          tests/test_nethack_candidate_shadow_eval.py tests/test_nethack_canary.py
          tests/test_nethack_canary_executor.py tests/test_nethack_canary_container.py
          tests/test_nethack_canary_worker.py tests/test_nethack_canary_candidate_broker.py
          tests/test_nethack_canary_image.py tests/test_nethack_canary_tactics.py
          tests/test_ninvaders_wrapper.py tests/test_ninvaders_wrapper_policy.py
          tests/test_ninvaders_arena.py tests/test_ninvaders_frame.py tests/test_ninvaders_improve.py
          tests/test_ninvaders_nudge.py tests/test_ninvaders_player.py tests/test_ninvaders_policy.py
          tests/test_ninvaders_sandbox.py tests/test_ninvaders_store.py
          tests/test_corner_boundary.py tests/test_paper_corner.py
          tests/test_retro_daily_schedule.py tests/test_corner_improve.py
          tests/test_corner_improve_dispatch.py tests/test_retro_command_brains.py
          tests/test_retro_wrapper_limits.py tests/test_retro_wrapper_real_panes.py
          tests/test_bastet_brain.py tests/test_moon_buggy_brain.py
          tests/test_pacman4console_brain.py tests/test_ninvaders_brain.py
          tests/test_nsnake_brain.py tests/test_nsnake_agent_config.py tests/test_bot_eval.py
          tests/test_retro_lottery.py
          tests/test_paper_corner_manual.py tests/test_paper_corner_chatter_schedule.py
          tests/test_config.py tests/test_robots_config.py tests/test_stream_category.py
          tests/test_procs.py
      - name: PAPER improve sidebar contract
        run: node --test games/soviet_now/tests/test_paper_improve_sidebar.mjs
      - name: Transactional switch contract
        run: >-
          python3 -m pytest -q
          tests/test_game_switch.py tests/test_coordinator.py tests/test_coordinator_source_fence.py
          tests/test_coordinator_adapter.py tests/test_cli_coordinator.py
          tests/test_cli_adapter.py
          tests/test_nethack_adapter.py tests/test_nethack_save_confirmation.py
          tests/test_nethack_boundary_diag.py
          tests/test_soren91_graceful_stop.py
      - name: Round-boundary contract
        run: python3 -m pytest -q tests/test_round_boundary.py
      - name: WebUI mutation guard and authz audit contract
        run: python3 -m pytest -q tests/test_webui.py
      - name: RetroArch saved-boundary and native presentation contracts
        run: >-
          python3 -m pytest -q
          tests/test_retroarch_safe_boundary.py tests/test_retroarch_adapter.py
          tests/test_coordinator_adapter_retroarch.py tests/test_retroarch_readiness_contract.py
          tests/test_presentation.py tests/test_presentation_viewer_wait.py tests/test_presentation_script_volume.py
      - name: Robots resolver contract
        run: python3 -m pytest -q tests/test_resolver.py
      - name: Founding policy hotfix contract
        run: python3 -m unittest discover -s tests -p test_founding_policy_hotfix.py
      - name: Soren NEWS spam wait hotfix contract
        run: python3 -m pytest -q tests/test_soren_news_spam_improve_wait_hotfix.py
      - name: Soren NEWS spam queue-wait hotfix contract
        run: python3 -m pytest -q tests/test_soren_news_spam_queue_wait_hotfix.py
      - name: Broadcast and comment-classifier ownership contracts
        run: |
          python3 -m pytest -q tests/test_broadcast_baseline.py
          python3 games/soviet_now/tests/test_comment_classifier_docich.py
      - name: Native comment prompt / output guard / state parity and legacy drift guard (#829 PR-3a/3b/3c)
        run: python3 -m pytest -q tests/test_comment_prompt.py tests/test_comment_guard.py tests/test_comment_state.py tests/test_comment_viewer_memory.py tests/test_comment_viewer_memory_bridge.py
      - name: Improvement command deployment contract
        run: python3 -m unittest discover -s tests -p test_improve_command_deploy.py
      - name: Analysis contract deployment scope
        run: python3 -m unittest discover -s tests -p test_analysis_contract_deploy.py
      - name: Shadow single-cycle contract
        run: python3 -m unittest tests.test_shadow_once
      - name: Compile Python
        run: python3 -m compileall -q src tests

  spawn-lease-interoperability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check out reviewed Soren spawn protocol
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: azumag/soviet_now
          ref: c025faae892168454512e7dc16b72ba6f22ea431
          path: .ci-spawn-source
          persist-credentials: false
      - name: Real installer/runtime interoperability
        env:
          SOREN_SPAWN_SOURCE: ${{ github.workspace }}/.ci-spawn-source
        run: python3 -m unittest discover -s tests -p 'test_founding_policy*.py'
      - name: Real runtime regressions
        working-directory: .ci-spawn-source
        run: python3 -m unittest tests.test_spawn_guard_lease

  overlay-queue-interoperability:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install test dependencies in an isolated environment
        run: python3 -m venv .ci-overlay-venv && .ci-overlay-venv/bin/python -m pip install -r requirements-test.txt
      - name: Native and docich queue interoperability on macOS
        run: .ci-overlay-venv/bin/python -m pytest -q tests/test_overlay_interop.py tests/test_overlay_queue.py tests/test_audio_delivery.py tests/test_trading_soren_output.py
