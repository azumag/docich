name: CI

on:
  pull_request:
    paths:
      - '.node-version'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'conftest.py'
      - 'requirements*.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  materialize-webui-hanjuku-resume:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/webui-hanjuku-resume-latest'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: false
          persist-credentials: true
      - name: Apply reviewed Hanjuku WebUI resume patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          def replace_in_method(text, method_sig, old, new, label):
              start = text.find(method_sig)
              if start < 0:
                  raise SystemExit(f"{label}: method not found")
              end = text.find('\n    def ', start + len(method_sig))
              if end < 0:
                  end = len(text)
              chunk = text[start:end]
              chunk = replace_once(chunk, old, new, label)
              return text[:start] + chunk + text[end:]

          webui_path = Path('src/docich/webui.py')
          text = webui_path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '        if action not in ("start", "stop", "recover", "schedule", "cancel-schedule"):\n',
              '        if action not in ("start", "resume-latest", "stop", "recover", "schedule", "cancel-schedule"):\n',
              'webui action allowlist',
          )
          text = replace_once(
              text,
              '                "action must be start, stop, recover, schedule or cancel-schedule",\n',
              '                "action must be start, resume-latest, stop, recover, schedule or cancel-schedule",\n',
              'webui action error',
          )
          text = replace_once(
              text,
              '        if action in ("schedule", "cancel-schedule"):\n            return self._handle_scheduled_corner_action(row, action, data)\n        if row.adapter in _CORNER_QUEUED_MANUAL_ADAPTERS:\n',
              '        if action in ("schedule", "cancel-schedule"):\n            return self._handle_scheduled_corner_action(row, action, data)\n        if action == "resume-latest":\n            if row.game not in _CORNER_QUEUED_MANUAL_GAMES:\n                self._send_error_json(400, "resume_latest_unsupported",\n                                      "最新セーブからの再開は半熟英雄だけに対応しています")\n                return 400\n            return self._handle_hanjuku_corner_start(row, resume_latest=True)\n        if row.adapter in _CORNER_QUEUED_MANUAL_ADAPTERS:\n',
              'webui resume route',
          )
          old_sig = '    def _handle_hanjuku_corner_start(self, row) -> int:\n'
          new_sig = '    def _handle_hanjuku_corner_start(self, row, *, resume_latest: bool = False) -> int:\n'
          text = replace_once(text, old_sig, new_sig, 'hanjuku handler signature')
          text = replace_in_method(
              text, new_sig,
              '            outcome = CornerRotationManager(self.g).queue_manual(row.game)\n',
              '            manager = CornerRotationManager(self.g)\n            outcome = (manager.queue_manual(row.game, resume_latest=True)\n                       if resume_latest else manager.queue_manual(row.game))\n',
              'hanjuku queue call',
          )
          text = replace_in_method(
              text, new_sig,
              '            "action": "start",\n            "status": status,\n',
              '            "action": "resume-latest" if resume_latest else "start",\n            "status": status,\n',
              'hanjuku response action',
          )
          webui_path.write_text(text, encoding='utf-8')

          index_path = Path('src/docich/webui_resources/index.html')
          html = index_path.read_text(encoding='utf-8')
          html = replace_once(
              html,
              '<button class="btn primary" id="corners-start">手動開始</button>\n<button class="btn" id="corners-schedule">時刻指定</button>',
              '<button class="btn primary" id="corners-start">手動開始</button>\n<button class="btn" id="corners-resume-latest" style="display:none">最新セーブから再開</button>\n<button class="btn" id="corners-schedule">時刻指定</button>',
              'resume button',
          )
          html = replace_once(
              html,
              '  const startBtn=document.getElementById("corners-start");\n  const scheduleBtn=document.getElementById("corners-schedule");',
              '  const startBtn=document.getElementById("corners-start");\n  const resumeBtn=document.getElementById("corners-resume-latest");\n  const scheduleBtn=document.getElementById("corners-schedule");',
              'resume render handle',
          )
          html = replace_once(
              html,
              '  if(startBtn){ startBtn.disabled=!canStart; startBtn.textContent=queuedMode?"開始予約":"手動開始"; }\n  if(scheduleBtn) scheduleBtn.disabled=!canSchedule;',
              '  if(startBtn){ startBtn.disabled=!canStart; startBtn.textContent=queuedMode?"開始予約":"手動開始"; }\n  if(resumeBtn){ const isHanjuku=!!c&&c.game==="hanjuku-hero"; resumeBtn.style.display=isHanjuku?"":"none"; resumeBtn.disabled=!isHanjuku||!canStart; }\n  if(scheduleBtn) scheduleBtn.disabled=!canSchedule;',
              'resume render state',
          )
          html = replace_once(
              html,
              '  const cSchedule=document.getElementById("corners-schedule");\n',
              '  const cResume=document.getElementById("corners-resume-latest");\n  if(cResume) cResume.onclick=()=>{\n    const sel=document.getElementById("corners-select");\n    const corner=sel?sel.value:"";\n    const row=((CORNERS_DATA&&CORNERS_DATA.catalog)||[]).find(x=>x.id===corner);\n    if(!row||row.game!=="hanjuku-hero"){ toast("最新セーブからの再開は半熟英雄だけに対応しています"); return; }\n    cornerAction({action:"resume-latest",corner},\n      "半熟英雄を最新のクイックセーブから再開しますか？（通常の開始予約は新規開始のままです）");\n  };\n  const cSchedule=document.getElementById("corners-schedule");\n',
              'resume click handler',
          )
          index_path.write_text(html, encoding='utf-8')

          manifest_path = Path('src/docich/webui_resources/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for name in ('index.html', 'defaults.json'):
              manifest['files'][name] = hashlib.sha256((manifest_path.parent / name).read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          python3 -m compileall -q src
      - name: Restore CI workflow and push implementation commit
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/docich/webui.py src/docich/webui_resources/index.html src/docich/webui_resources/manifest.json .github/workflows/ci.yml
          git commit -m 'feat(webui): add Hanjuku latest-save resume'
          git push origin HEAD:${{ github.head_ref }}

  python-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Compile Python
        run: python3 -m compileall -q src tests

  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Install system dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
      - name: Full hermetic test suite (canonical pytest runner)
        run: python3 -m pytest -q tests/ --durations=50 --durations-min=0.1 -n 4 --dist loadfile --ignore=tests/test_hanjuku_scene_process.py
      - name: Single-threaded scene-process contracts (serial)
        run: python3 -m pytest -q tests/test_hanjuku_scene_process.py
