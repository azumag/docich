name: CI

on:
  pull_request:
    paths:
      - '.node-version'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'conftest.py'
      - 'requirements*.txt'
      - '.github/workflows/ci.yml'
  # A push to main does not re-run this suite. The PR run already covered the
  # same tree, and the per-area workflows in this directory still run for the
  # areas a push actually touched. Use this entry point when a full-suite run
  # on main is genuinely needed, e.g. after a manual merge commit.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  materialize-hanjuku-resume-refusal-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/webui-hanjuku-resume-refusal'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: false
          persist-credentials: true
      - name: Apply reviewed Hanjuku resume refusal patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          webui_path = Path('src/docich/webui.py')
          text = webui_path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '        from .corner_rotation import CornerRotationManager, RotationError\n\n        try:\n',
              '        from .corner_rotation import CornerRotationManager, RotationError\n        from .adapters.base import AdapterError\n\n        try:\n',
              'adapter error import',
          )
          text = replace_once(
              text,
              '        except (OSError, ValueError):\n            self._send_error_json(409, "hanjuku_manual_unavailable",\n                                  "半熟英雄の開始要求を保存できませんでした")\n            return 409\n        except Exception:\n',
              '        except (OSError, ValueError):\n            self._send_error_json(409, "hanjuku_manual_unavailable",\n                                  "半熟英雄の開始要求を保存できませんでした")\n            return 409\n        except AdapterError:\n            if resume_latest:\n                self._send_error_json(409, "hanjuku_resume_unavailable",\n                                      "最新セーブから再開できる検証済み状態を確認できませんでした")\n            else:\n                self._send_error_json(409, "hanjuku_manual_unavailable",\n                                      "半熟英雄の開始条件を確認できませんでした")\n            return 409\n        except Exception:\n',
              'adapter error handling',
          )
          webui_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_webui_hanjuku_resume.py')
          test = test_path.read_text(encoding='utf-8')
          test = replace_once(
              test,
              'from docich import corner_rotation, webui\n',
              'from docich import corner_rotation, webui\nfrom docich.adapters.base import AdapterError\n',
              'test import',
          )
          test += '''\n\ndef test_hanjuku_resume_adapter_refusal_is_a_safe_conflict(tmp_path, monkeypatch):\n    class RefusingManager:\n        def __init__(self, config):\n            self.config = config\n\n        def queue_manual(self, game, **kwargs):\n            assert game == "hanjuku-hero"\n            assert kwargs == {"resume_latest": True}\n            raise AdapterError("private checkpoint detail must not escape")\n\n    monkeypatch.setattr(corner_rotation, "CornerRotationManager", RefusingManager)\n    handler, _ = _handler(tmp_path)\n    error = {}\n    handler._send_error_json = lambda status, code, message: error.update(\n        status=status, code=code, message=message\n    )\n    row = SimpleNamespace(id="hanjuku-hero", game="hanjuku-hero", adapter="game")\n\n    assert handler._handle_hanjuku_corner_start(row, resume_latest=True) == 409\n    assert error == {\n        "status": 409,\n        "code": "hanjuku_resume_unavailable",\n        "message": "最新セーブから再開できる検証済み状態を確認できませんでした",\n    }\n    assert "private checkpoint" not in error["message"]\n'''
          test_path.write_text(test, encoding='utf-8')
          PY
          python3 -m compileall -q src tests
      - name: Restore CI workflow and push fix commit
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/docich/webui.py tests/test_webui_hanjuku_resume.py .github/workflows/ci.yml
          git commit -m 'fix(webui): classify Hanjuku resume refusal'
          git push origin HEAD:${{ github.head_ref }}

  python-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Compile Python
        run: python3 -m compileall -q src tests

  full-suite:
    # Hermetic full-suite contract (issue #79): every tests/test_*.py runs
    # green through the canonical pytest runner on the supported Python,
    # with no submodules, no network, and no ambient PYTHONPATH.
    # tests/ relies on the root conftest.py for sys.path (src) and
    # tempfile isolation; tests needing live external state (real tmux
    # server, submodules, browsers, /proc identity) must inject fakes or
    # declare an explicit opt-in/skip gate, never fail the suite.
    # The suite is spread over 4 pytest-xdist workers to match the runner's
    # 4 vCPUs. Collection must stay deterministic: a test whose node ids
    # depend on uuid4()/time at import time makes the workers disagree and
    # pytest-xdist aborts the entire run.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Install system dependencies
        # Hosted images usually already provide both binaries. Avoid a network
        # package-index refresh in that case, but keep fresh images supported.
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
      - name: Full hermetic test suite (canonical pytest runner)
        run: python3 -m pytest -q tests/ --durations=50 --durations-min=0.1 -n 4 --dist loadfile --ignore=tests/test_hanjuku_scene_process.py
      - name: Single-threaded scene-process contracts (serial)
        # tests/test_hanjuku_scene_process.py proves the scene owner only runs
        # in a process with exactly one thread (/proc/self/task). Every
        # pytest-xdist worker carries an execnet receiver thread, so this file
        # cannot run in a worker and stays on the serial runner.
        run: python3 -m pytest -q tests/test_hanjuku_scene_process.py
