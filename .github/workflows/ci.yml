name: CI

on:
  # No paths filter: main requires the ci-required check below, and a required
  # check that never starts blocks a pull request forever. test-scope decides
  # what each change needs, which is nothing for a documentation change.
  pull_request:
  # A push to main does not re-run this suite: the per-area workflows in this
  # directory still run for the areas a push actually touched. Hanjuku-only
  # pull requests run a smaller suite (see test-scope below), so this nightly
  # run is what covers the rest of the suite for them.
  schedule:
    - cron: '23 18 * * *'
  # Use this entry point when a full-suite run on main is needed sooner, e.g.
  # after a manual merge commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-syntax:
    needs: test-scope
    if: needs.test-scope.outputs.suite != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Compile Python
        run: python3 -m compileall -q src tests

  test-scope:
    # Most pull requests change only Hanjuku. .github/scripts/ci_test_scope.py
    # gives those the Hanjuku suite and everything else the full suite.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suite: ${{ steps.decide.outputs.suite }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - name: Decide which tests this change needs
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/ci_test_scope.py decide --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  full-suite:
    name: ${{ needs.test-scope.outputs.suite == 'hanjuku' && 'hanjuku-suite' || 'full-suite' }} (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: test-scope
    if: needs.test-scope.outputs.suite != 'none'
    # Hermetic full-suite contract (issue #79): every tests/test_*.py runs
    # green through the canonical pytest runner on the supported Python,
    # with no submodules, no network, and no ambient PYTHONPATH.
    # tests/ relies on the root conftest.py for sys.path (src) and
    # tempfile isolation; tests needing live external state (real tmux
    # server, submodules, browsers, /proc identity) must inject fakes or
    # declare an explicit opt-in/skip gate, never fail the suite.
    # The suite is cut into two file-level shards that run on separate runners
    # (.github/scripts/ci_shard.py), each spread over 4 pytest-xdist workers to
    # match the runner's 4 vCPUs (2 cores with hyper-threading, and the CPU model
    # varies by run, which alone moves one runner between about 6 and 12 minutes).
    # The repository is public, so a second runner costs no minutes; it halves the
    # time to a result. Collection must stay deterministic: a test whose node ids
    # depend on uuid4()/time at import time makes the workers disagree and
    # pytest-xdist aborts the entire run.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      TEST_SUITE: ${{ needs.test-scope.outputs.suite }}
      CI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
      - name: Report the runner CPU
        run: lscpu | grep 'Model name'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Install system dependencies
        # Hosted images usually already provide both binaries. Avoid a network
        # package-index refresh in that case, but keep fresh images supported.
        # The Hanjuku suite never starts ffmpeg, and installing it can take 100 s.
        if: needs.test-scope.outputs.suite != 'hanjuku'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            # Hosted Ubuntu runners sometimes use a slow Azure apt mirror.
            # Only alter the mirror in real Actions; hermetic setup tests keep
            # the existing two apt commands and no runner-specific dependency.
            if [ "${GITHUB_ACTIONS:-}" = "true" ] && [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
      - name: Full hermetic test suite (canonical pytest runner)
        env:
          PYTHONPATH: .github/scripts
        run: python3 -m pytest -q -p ci_shard $(python3 .github/scripts/ci_test_scope.py targets "$TEST_SUITE") --durations=50 --durations-min=0.1 -n 4 --dist loadfile --ignore=tests/test_hanjuku_scene_process.py
      - name: Single-threaded scene-process contracts (serial)
        # Runs on shard 1 only; the file is not part of the sharded collection.
        if: matrix.shard == 1
        # tests/test_hanjuku_scene_process.py proves the scene owner only runs
        # in a process with exactly one thread (/proc/self/task). Every
        # pytest-xdist worker carries an execnet receiver thread, so this file
        # cannot run in a worker and stays on the serial runner.
        run: python3 -m pytest -q tests/test_hanjuku_scene_process.py

  ci-required:
    # The one check main's ruleset requires. The test job has two names and may
    # be skipped, so branch protection cannot name it directly.
    if: ${{ always() }}
    needs: [test-scope, python-syntax, full-suite]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job that had to run to have passed
        env:
          SUITE: ${{ needs.test-scope.outputs.suite }}
          SCOPE_RESULT: ${{ needs.test-scope.result }}
          SYNTAX_RESULT: ${{ needs.python-syntax.result }}
          TESTS_RESULT: ${{ needs.full-suite.result }}
        run: |
          expected=success
          if [ "$SUITE" = none ]; then expected=skipped; fi
          [ "$SCOPE_RESULT" = success ] && [ "$SYNTAX_RESULT" = "$expected" ] && [ "$TESTS_RESULT" = "$expected" ]
