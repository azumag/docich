name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Retro corner contract
        run: python3 -m unittest tests.test_retro_corner -v
      - name: Full unit suite
        shell: bash
        run: |
          set -o pipefail
          if python3 -m unittest discover -s tests -v 2>&1 | tee full-tests.log; then
            exit 0
          fi
          {
            echo '### Full unit suite failure tail'
            echo '```text'
            tail -n 160 full-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Compile Python
        run: python3 -m compileall -q src tests
