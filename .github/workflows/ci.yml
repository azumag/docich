name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  feature-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Retro corner and switch regressions
        run: |
          python3 -m pytest -q \
            tests/test_retro_corner.py \
            tests/test_config.py \
            tests/test_game_switch.py \
            tests/test_coordinator.py \
            tests/test_round_boundary.py \
            tests/test_cli_coordinator.py \
            tests/test_cli_adapter.py \
            tests/test_resolver.py \
            tests/test_robots_config.py
      - name: Compile Python
        run: python3 -m compileall -q src tests
