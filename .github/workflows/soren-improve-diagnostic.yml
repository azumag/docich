name: Soren improve diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/soren-improve-diagnostic.yml'
      - 'games/soviet_now'

permissions:
  contents: read

concurrency:
  group: soren-improve-diagnostic-${{ github.repository }}
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ github.repository_owner == 'azumag' && github.repository_owner_id == '9018513' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout current protected main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
          submodules: false

      - name: Require event SHA to equal current main
        id: current
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$sha" == "$EVENT_SHA" ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH client
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -m 700 -d "$RUNNER_TEMP/vm-ssh"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm-ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/vm-ssh/key" "$RUNNER_TEMP/vm-ssh/known_hosts"
          printf 'port=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Wait for production to equal current main
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.current.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          for _ in $(seq 1 36); do
            status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA" || true)"
            if python3 - "$status_json" "$SHA" <<'PY'
          import json, sys
          try:
              data = json.loads(sys.argv[1])
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if data.get('status') == 'configured' and data.get('sha') == sys.argv[2] else 1)
          PY
            then
              exit 0
            fi
            sleep 5
          done
          echo 'production did not converge to current protected main' >&2
          exit 1

      - name: Classify fixed Soren improvement status
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.current.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          set +e
          cat <<'PY' | ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA" >/dev/null
          cd /home/ubuntu/soren
          exec python3 - <<'INNER'
          import json, os, re
          try:
              state = json.load(open('tmp/state/improve_state.json', encoding='utf-8'))
          except Exception:
              raise SystemExit(60)
          phase = str(state.get('phase') or '')
          detail = str(state.get('detail') or '')
          match = re.fullmatch(r'failed_no_apply:([a-z0-9_]+)', detail.strip())
          if phase != 'failed_no_apply' and not match:
              raise SystemExit(60)
          code = match.group(1) if match else ''
          failure_index = {
              'validation_failed': 1,
              'model_no_response': 2,
              'deadline_exhausted': 3,
              'isolated_runner_unavailable': 4,
              'analysis_evidence_invalid': 5,
              'wall_timeout': 6,
          }.get(code, 7)
          retry = os.path.isfile('tmp/state/improve_retry_batch.json') and os.path.getsize('tmp/state/improve_retry_batch.json') > 0
          backoff = os.path.isfile('tmp/state/rate_limit_backoff')
          flags = (8 if retry else 0) | (16 if backoff else 0)
          raise SystemExit(64 + failure_index + flags)
          INNER
          PY
          rc=$?
          set -e
          if [[ "$rc" -eq 60 ]]; then
            echo 'Soren improve: terminal_state=not_failed_no_apply'
            exit 0
          fi
          if (( rc < 65 || rc > 95 )); then
            echo "unexpected diagnostic transport code: $rc" >&2
            exit 1
          fi
          bits=$((rc - 64))
          failure_index=$((bits & 7))
          retry_pending=$(((bits & 8) != 0 ? 1 : 0))
          backing_off=$(((bits & 16) != 0 ? 1 : 0))
          case "$failure_index" in
            1) failure_code=validation_failed ;;
            2) failure_code=model_no_response ;;
            3) failure_code=deadline_exhausted ;;
            4) failure_code=isolated_runner_unavailable ;;
            5) failure_code=analysis_evidence_invalid ;;
            6) failure_code=wall_timeout ;;
            7) failure_code=other ;;
            *) echo 'invalid failure index' >&2; exit 1 ;;
          esac
          echo "Soren improve: failure_code=${failure_code} retry_pending=${retry_pending} backing_off=${backing_off}"
