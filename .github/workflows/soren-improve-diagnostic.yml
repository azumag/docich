name: Soren improve diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/soren-improve-diagnostic.yml'
      - 'games/soviet_now'

permissions:
  contents: read

concurrency:
  group: soren-improve-diagnostic-${{ github.repository }}
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ github.repository_owner == 'azumag' && github.repository_owner_id == '9018513' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout current protected main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
          submodules: false

      - name: Require event SHA to equal current main
        id: current
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$sha" == "$EVENT_SHA" ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH client
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -m 700 -d "$RUNNER_TEMP/vm-ssh"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm-ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/vm-ssh/key" "$RUNNER_TEMP/vm-ssh/known_hosts"
          printf 'port=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Wait for production to equal current main
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.current.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          for _ in $(seq 1 36); do
            status_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "status docich production $SHA" || true)"
            if python3 - "$status_json" "$SHA" <<'PY'
          import json, sys
          try:
              data = json.loads(sys.argv[1])
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if data.get('status') == 'configured' and data.get('sha') == sys.argv[2] else 1)
          PY
            then
              exit 0
            fi
            sleep 5
          done
          echo 'production did not converge to current protected main' >&2
          exit 1

      - name: Classify latest Soren improvement failure
        shell: bash
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          SHA: ${{ steps.current.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          set +e
          cat <<'PY' | ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "exec docich production $SHA" >/dev/null
          cd /home/ubuntu/soren
          exec python3 - <<'INNER'
          import json, os, re

          CODES = {
              'apply_bundle_failed': 1,
              'validation_failed': 2,
              'model_no_response': 3,
              'deadline_exhausted': 4,
              'isolated_runner_unavailable': 5,
              'analysis_evidence_invalid': 6,
              'wall_timeout': 7,
              'other': 8,
          }

          # Prefer the live state when it still preserves the terminal result.
          try:
              state = json.load(open('tmp/state/improve_state.json', encoding='utf-8'))
          except Exception:
              state = {}
          detail = str(state.get('detail') or '')
          match = re.fullmatch(r'failed_no_apply:([a-z0-9_]+)', detail.strip())
          if str(state.get('phase') or '') == 'failed_no_apply' or match:
              code = match.group(1) if match else 'other'
              code = code if code in CODES else 'other'
              raise SystemExit(64 + CODES[code])

          # The current state is ephemeral and can be overwritten by a later run.
          # Recover only a fixed classification from a bounded tail; never print or
          # transport raw log text. The last failed_no_apply marker identifies the
          # most recent terminal failure and the preceding attached marker bounds
          # the run used for classification.
          path = 'tmp/debug/improve_ai.log'
          try:
              size = os.path.getsize(path)
              with open(path, 'rb') as f:
                  f.seek(max(0, size - 524288))
                  text = f.read(524288).decode('utf-8', 'replace')
          except Exception:
              raise SystemExit(60)
          terminal = text.rfind('[IMPROVE] failed_no_apply:')
          if terminal < 0:
              raise SystemExit(60)
          attached = text.rfind('[IMPROVE] attached pid=', 0, terminal)
          segment = text[attached if attached >= 0 else max(0, terminal - 131072):terminal + 512]

          if 'strategy/helper bundle の原子的反映に失敗' in segment:
              code = 'apply_bundle_failed'
          elif 'consecutive model failures' in segment or 'model_no_response' in segment:
              code = 'model_no_response'
          elif 'deadline_exhausted' in segment:
              code = 'deadline_exhausted'
          elif 'isolated_runner_unavailable' in segment or 'isolated runner' in segment.lower():
              code = 'isolated_runner_unavailable'
          elif 'analysis_evidence_invalid' in segment:
              code = 'analysis_evidence_invalid'
          elif 'wall timeout' in segment.lower() or 'wall_timeout' in segment:
              code = 'wall_timeout'
          elif 'validation' in segment.lower() or 'VALIDATE' in segment:
              code = 'validation_failed'
          else:
              code = 'other'
          raise SystemExit(80 + CODES[code])
          INNER
          PY
          rc=$?
          set -e

          if [[ "$rc" -eq 60 ]]; then
            echo 'Soren improve: last_failure=unavailable'
            exit 0
          fi
          source=current_state
          if (( rc >= 81 && rc <= 88 )); then
            source=bounded_log_tail
            index=$((rc - 80))
          elif (( rc >= 65 && rc <= 72 )); then
            index=$((rc - 64))
          else
            echo "unexpected diagnostic transport code: $rc" >&2
            exit 1
          fi
          case "$index" in
            1) failure_code=apply_bundle_failed ;;
            2) failure_code=validation_failed ;;
            3) failure_code=model_no_response ;;
            4) failure_code=deadline_exhausted ;;
            5) failure_code=isolated_runner_unavailable ;;
            6) failure_code=analysis_evidence_invalid ;;
            7) failure_code=wall_timeout ;;
            8) failure_code=other ;;
            *) echo 'invalid failure index' >&2; exit 1 ;;
          esac
          echo "Soren improve: failure_code=${failure_code} source=${source}"
