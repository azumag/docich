name: VM diagnostics headroom monitor

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vm-diagnostics-headroom-${{ github.repository }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      ${{ github.ref == 'refs/heads/main' && github.ref_protected == true &&
          (github.event_name == 'schedule' ||
           (github.actor_id == 9018513 && github.triggering_actor == 'azumag')) }}
    environment: vm-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      WARN_PERCENT: '80'
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
          submodules: false

      - name: Configure pinned SSH client
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VM_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$VM_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${VM_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -m 700 -d "$RUNNER_TEMP/vm-ssh"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm-ssh/key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/vm-ssh/key" "$RUNNER_TEMP/vm-ssh/known_hosts"
          printf 'port=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Probe diagnostics and measure envelope
        id: diagnostics
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          ssh_args=(-F /dev/null -T -p "$port" -i "$RUNNER_TEMP/vm-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vm-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=20)
          err="$RUNNER_TEMP/diagnostics-headroom.err"
          if ! diagnostics_json="$(ssh "${ssh_args[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "diagnostics docich production $sha" 2>"$err")"; then
            {
              echo 'available=0'
              echo 'envelope_bytes=0'
              echo 'cap_bytes=0'
              echo 'usage_percent=0'
              echo 'alert=1'
            } >> "$GITHUB_OUTPUT"
            echo '::warning::Production diagnostics probe is unavailable.'
            exit 0
          fi
          printf '%s' "$diagnostics_json" > "$RUNNER_TEMP/diagnostics-headroom.json"
          python3 - "$RUNNER_TEMP/diagnostics-headroom.json" "$WARN_PERCENT" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          from pathlib import Path
          from ops.vm_actions import gateway

          raw = Path(sys.argv[1]).read_bytes()
          warn = int(sys.argv[2])
          cap = int(gateway.DIAGNOSTICS_JSON_MAX)
          used = len(raw)
          percent = (used * 100) // cap if cap > 0 else 100
          print('available=1')
          print(f'envelope_bytes={used}')
          print(f'cap_bytes={cap}')
          print(f'usage_percent={percent}')
          print(f'alert={int(percent >= warn)}')
          PY
          # #3341 Phase 0 follow-up: the collector now reports per-section byte
          # accounting under diagnostics.meta.section_bytes (top-N key names +
          # others + total; bytes and key names only). Reparse the envelope the
          # probe already downloaded so the aggregate survives in the run
          # summary instead of being discarded with RUNNER_TEMP. A missing map
          # means the deployed collector predates #3342 or dropped the
          # accounting at the hard ceiling; record it, never fail the probe.
          # Section names are collector-internal keys but are still filtered to
          # a fixed character class so envelope content can never inject markup
          # or workflow commands into the summary or the annotation.
          if [[ -f "$RUNNER_TEMP/diagnostics-headroom.json" ]]; then
            python3 - "$RUNNER_TEMP/diagnostics-headroom.json" >> "$GITHUB_STEP_SUMMARY" <<'PY' || echo '- section_bytes: extraction failed'
          import json
          import re
          import sys
          from pathlib import Path

          doc = json.loads(Path(sys.argv[1]).read_text())
          diagnostics = doc.get('diagnostics')
          meta = diagnostics.get('meta') if isinstance(diagnostics, dict) else None
          section_bytes = meta.get('section_bytes') if isinstance(meta, dict) else None
          top = section_bytes.get('top') if isinstance(section_bytes, dict) else None
          if not isinstance(top, dict) or not top:
              print('- section_bytes: absent (collector predates #3342 or accounting dropped at hard ceiling)')
              print('::notice::diagnostics section_bytes=absent', file=sys.stderr)
              raise SystemExit(0)
          total = section_bytes.get('total')
          total = total if isinstance(total, int) else 0
          others = section_bytes.get('others')
          others = others if isinstance(others, int) else 0
          print('- section_bytes:')
          ranked = sorted(top.items(), key=lambda item: -item[1])
          for name, size in ranked:
              safe = name if re.fullmatch(r'[A-Za-z0-9_]+', name) else '?'
              size = size if isinstance(size, int) else 0
              percent = (size * 100) // total if total > 0 else 0
              print(f'  - {safe}: {size} B ({percent}%)')
          print(f'  - others: {others} B')
          print(f'  - total: {total} B')
          lead = ranked[0]
          lead_name = lead[0] if re.fullmatch(r'[A-Za-z0-9_]+', lead[0]) else '?'
          lead_size = lead[1] if isinstance(lead[1], int) else 0
          print(f'::notice::diagnostics section_bytes top={lead_name}:{lead_size}B total={total}B', file=sys.stderr)
          PY
          fi

      - name: Record diagnostics headroom trend
        env:
          AVAILABLE: ${{ steps.diagnostics.outputs.available }}
          ENVELOPE_BYTES: ${{ steps.diagnostics.outputs.envelope_bytes }}
          CAP_BYTES: ${{ steps.diagnostics.outputs.cap_bytes }}
          USAGE_PERCENT: ${{ steps.diagnostics.outputs.usage_percent }}
        run: |
          set -euo pipefail
          if [[ "$AVAILABLE" == '1' ]]; then
            echo "::notice::diagnostics envelope=${ENVELOPE_BYTES}B cap=${CAP_BYTES}B usage=${USAGE_PERCENT}%"
            printf '### VM diagnostics headroom\n\n- available: yes\n- envelope: %s B\n- cap: %s B\n- usage: %s%%\n' "$ENVELOPE_BYTES" "$CAP_BYTES" "$USAGE_PERCENT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::diagnostics availability=0'
            printf '### VM diagnostics headroom\n\n- available: no\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update deduplicated diagnostics alert
        env:
          AVAILABLE: ${{ steps.diagnostics.outputs.available }}
          ALERT: ${{ steps.diagnostics.outputs.alert }}
          ENVELOPE_BYTES: ${{ steps.diagnostics.outputs.envelope_bytes }}
          CAP_BYTES: ${{ steps.diagnostics.outputs.cap_bytes }}
          USAGE_PERCENT: ${{ steps.diagnostics.outputs.usage_percent }}
        run: |
          set -euo pipefail
          title='[VM diagnostics] availability/headroom alert'
          mapfile -t alerts < <(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == "[VM diagnostics] availability/headroom alert") | .number')
          if [[ "$ALERT" != '1' ]]; then
            for number in "${alerts[@]}"; do
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Diagnostics recovered with usage below ${WARN_PERCENT}% (current: ${USAGE_PERCENT}%)."
            done
            exit 0
          fi
          if [[ "$AVAILABLE" == '1' ]]; then
            state="headroom_low"
            detail="- envelope_bytes: ${ENVELOPE_BYTES}\n- cap_bytes: ${CAP_BYTES}\n- usage_percent: ${USAGE_PERCENT}"
          else
            state="unavailable"
            detail="- envelope_bytes: unavailable\n- cap_bytes: unavailable\n- usage_percent: unavailable"
          fi
          body="$(printf 'Production diagnostics health needs attention.\n\n- state: %s\n%b\n- warning threshold: %s%%\n- Workflow: %s/%s/actions/runs/%s\n\nOnly fixed status and numeric headroom fields are published. Raw diagnostics, stderr, paths, credentials, and command output are never published. This monitor is read-only.\n' "$state" "$detail" "$WARN_PERCENT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          for number in "${alerts[@]}"; do
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            exit 0
          done
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
