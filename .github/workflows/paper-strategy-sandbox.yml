name: PAPER strategy sandbox

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gvisor-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Host contracts and bounded transport
        run: python3 -m pytest -q tests/test_trading_free_strategy_sandbox.py
      - name: Install pinned gVisor on the ephemeral runner
        run: bash tests/helpers/install_gvisor_ci.sh
      - name: Record non-secret cgroup capabilities
        shell: bash
        run: docker info --format 'cgroup={{.CgroupVersion}} driver={{.CgroupDriver}} memory={{.MemoryLimit}} pids={{.PidsLimit}} cpu_quota={{.CPUCfsQuota}}'
      - name: Build the fixed guest image
        shell: bash
        run: |
          docker build --file containers/paper-strategy/Dockerfile --iidfile "$RUNNER_TEMP/docich-paper-sandbox-image" .
          sandbox_image="$(<"$RUNNER_TEMP/docich-paper-sandbox-image")"
          test -n "$sandbox_image"
          printf 'DOCICH_TEST_SANDBOX_IMAGE=%s\n' "$sandbox_image" >> "$GITHUB_ENV"
      - name: Run real gVisor isolation and resource tests
        shell: bash
        run: |
          test -n "$DOCICH_TEST_SANDBOX_IMAGE"
          python3 -m pytest -q tests/test_trading_free_strategy_gvisor.py
      - name: Remove only the ephemeral test containers
        if: always()
        shell: bash
        run: docker container ls --all --quiet --filter label=org.docich.paper-sandbox=1 | xargs --no-run-if-empty docker rm --force
