name: TwiCa common overlay contracts

on:
  pull_request:
    paths:
      - '.github/workflows/twica-common-overlay.yml'
      - '.github/workflows/twica-common-operation.yml'
      - 'requirements-twica-overlay.txt'
      - 'src/docich/twica_*.py'
      - 'tests/test_twica_*.py'
      - 'games/soviet_now'
      - 'ops/vm_actions/twica_common*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/twica-common-overlay.yml'
      - '.github/workflows/twica-common-operation.yml'
      - 'requirements-twica-overlay.txt'
      - 'src/docich/twica_*.py'
      - 'tests/test_twica_*.py'
      - 'games/soviet_now'
      - 'ops/vm_actions/twica_common*'

permissions:
  contents: read

concurrency:
  group: twica-common-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
      - name: Resolve paired Soren implementation
        id: soren
        run: echo "sha=$(git ls-tree HEAD games/soviet_now | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: azumag/soviet_now
          ref: ${{ steps.soren.outputs.sha }}
          path: games/soviet_now
          persist-credentials: false
          submodules: false
      - name: Install isolated test dependencies
        run: |
          python3 -m venv .ci-twica-venv
          .ci-twica-venv/bin/python -m pip install -r requirements-test.txt -r requirements-twica-overlay.txt
          .ci-twica-venv/bin/python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb pulseaudio pulseaudio-utils x11-utils
      - name: Unit, real Chromium alpha, and final FFmpeg pixel contracts
        env:
          PYTHONPATH: src
          DOCICH_TWICA_BROWSER_TESTS: '1'
          DOCICH_TWICA_NETWORK_BROWSER_TESTS: '1'
          DOCICH_TWICA_X11_TESTS: '1'
          DOCICH_TWICA_SOREN_CHECKOUT: games/soviet_now
        run: >-
          .ci-twica-venv/bin/python -m pytest -q
          tests/test_twica_*.py
      - name: Native ownership and existing overlay regressions
        working-directory: games/soviet_now
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/test_shared_overlay.mjs tests/test_direct_overlay.mjs tests/test_twica_overlay_layout.mjs tests/test_twica_overlay_proxy.mjs tests/test_twica_ownership.mjs
          bash tests/test_shared_overlay_service.sh
