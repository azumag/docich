name: Discord chat contracts

on:
  pull_request:
    paths:
      - 'src/docich/discord_chat.py'
      - 'src/docich/discord_memory.py'
      - 'src/docich/reply_routing.py'
      - 'src/docich/reply_research.py'
      - 'src/docich/reply_research_bridge.py'
      - 'src/docich/reply_research_egress.py'
      - 'src/docich/reply_research_web.py'
      - 'src/docich/semantic_decision/**'
      - 'tests/test_reply_routing.py'
      - 'tests/test_reply_research.py'
      - 'tests/test_reply_research_web.py'
      - 'tests/test_reply_research_codex_sandbox.py'
      - 'tests/test_comment_queue_e2e.py'
      - 'tests/fixtures/reply_routing_canary.json'
      - 'src/docich/comment/prompts/comment_persona_main.md'
      - 'tests/test_discord_chat.py'
      - 'tests/test_discord_memory.py'
      - 'requirements-discord.txt'
      - '.github/workflows/discord-chat.yml'
      - 'containers/discord-chat/**'
      - 'compose.discord-chat*.yml'
      - 'tests/test_discord_container.py'
      - 'tests/discord_container_probe.py'
      - 'requirements-test.txt'
  push:
    branches: [main]
    paths:
      - 'src/docich/discord_chat.py'
      - 'src/docich/discord_memory.py'
      - 'src/docich/reply_routing.py'
      - 'src/docich/reply_research.py'
      - 'src/docich/reply_research_bridge.py'
      - 'src/docich/reply_research_egress.py'
      - 'src/docich/reply_research_web.py'
      - 'src/docich/semantic_decision/**'
      - 'tests/test_reply_routing.py'
      - 'tests/test_reply_research.py'
      - 'tests/test_reply_research_web.py'
      - 'tests/test_reply_research_codex_sandbox.py'
      - 'tests/test_comment_queue_e2e.py'
      - 'tests/fixtures/reply_routing_canary.json'
      - 'src/docich/comment/prompts/comment_persona_main.md'
      - 'tests/test_discord_chat.py'
      - 'tests/test_discord_memory.py'
      - 'requirements-discord.txt'
      - '.github/workflows/discord-chat.yml'
      - 'containers/discord-chat/**'
      - 'compose.discord-chat*.yml'
      - 'tests/test_discord_container.py'
      - 'tests/discord_container_probe.py'
      - 'requirements-test.txt'

permissions:
  contents: read

concurrency:
  group: discord-chat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install test and optional Discord SDK dependencies
        run: python3 -m pip install -r requirements-test.txt -r requirements-discord.txt
      - name: Install bubblewrap for the negative isolation canary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile"
          sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - name: Install hash-pinned Codex for credential-free nested sandbox reproduction
        run: |
          archive="$RUNNER_TEMP/codex-0.157.1.tar.gz"
          curl --fail --location --retry 2 --max-time 90 \
            https://github.com/openai/codex/releases/download/rust-v0.157.1/codex-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          echo "e98c1e8e028e8137fa2d2415c82ec58e7b3701a627e3554aace5b3ca31454af2  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" codex-x86_64-unknown-linux-musl
          sudo install -m 0755 "$RUNNER_TEMP/codex-x86_64-unknown-linux-musl" /usr/local/bin/docich-codex-probe
      - name: Reproduce actual inner Codex sandbox blockers without model or API calls
        env:
          DOCICH_TEST_CODEX_BINARY: /usr/local/bin/docich-codex-probe
          DOCICH_REQUIRE_CODEX_SANDBOX_PROBE: "1"
        run: PYTHONPATH=src python3 -m pytest -q -s tests/test_reply_research_codex_sandbox.py
      - name: Offline persistence, conversation and real SDK construction contracts
        env:
          DOCICH_REQUIRE_BWRAP_PROBE: "1"
        run: PYTHONPATH=src python3 -m pytest -q tests/test_discord_chat.py tests/test_discord_memory.py tests/test_reply_routing.py tests/test_reply_research.py tests/test_reply_research_web.py

  comment-queue-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: azumag/soviet_now
          ref: 2f7258dd9c42946c4db8fd86222d4c4d176486b5
          path: _test_soren
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gettext-base jq
          python3 -m pip install -r requirements-test.txt
      - name: Repeated fixture fetch, combined JEV chunks, queue and ack (no APIs)
        env:
          DOCICH_REQUIRE_QUEUE_E2E: "1"
          DOCICH_SOREN_TEST_ROOT: ${{ github.workspace }}/_test_soren
        run: PYTHONPATH=src python3 -m pytest -q tests/test_comment_queue_e2e.py

  docker-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build and verify isolated Docker contracts without external APIs
        run: python3 containers/discord-chat/verify.py
