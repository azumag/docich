name: Discord chat contracts

on:
  pull_request:
    paths:
      - 'src/docich/discord_chat.py'
      - 'src/docich/discord_memory.py'
      - 'src/docich/reply_routing.py'
      - 'src/docich/reply_research.py'
      - 'src/docich/semantic_decision/**'
      - 'tests/test_reply_routing.py'
      - 'tests/test_reply_research.py'
      - 'src/docich/comment/prompts/comment_persona_main.md'
      - 'tests/test_discord_chat.py'
      - 'tests/test_discord_memory.py'
      - 'requirements-discord.txt'
      - '.github/workflows/discord-chat.yml'
      - 'containers/discord-chat/**'
      - 'compose.discord-chat*.yml'
      - 'tests/test_discord_container.py'
      - 'tests/discord_container_probe.py'
      - 'requirements-test.txt'
  push:
    branches: [main]
    paths:
      - 'src/docich/discord_chat.py'
      - 'src/docich/discord_memory.py'
      - 'src/docich/reply_routing.py'
      - 'src/docich/reply_research.py'
      - 'src/docich/semantic_decision/**'
      - 'tests/test_reply_routing.py'
      - 'tests/test_reply_research.py'
      - 'src/docich/comment/prompts/comment_persona_main.md'
      - 'tests/test_discord_chat.py'
      - 'tests/test_discord_memory.py'
      - 'requirements-discord.txt'
      - '.github/workflows/discord-chat.yml'
      - 'containers/discord-chat/**'
      - 'compose.discord-chat*.yml'
      - 'tests/test_discord_container.py'
      - 'tests/discord_container_probe.py'
      - 'requirements-test.txt'

permissions:
  contents: read

concurrency:
  group: discord-chat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install test and optional Discord SDK dependencies
        run: python3 -m pip install -r requirements-test.txt -r requirements-discord.txt
      - name: Install bubblewrap for the negative isolation canary
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends bubblewrap
          fi
      - name: Offline persistence, conversation and real SDK construction contracts
        run: PYTHONPATH=src python3 -m pytest -q tests/test_discord_chat.py tests/test_discord_memory.py tests/test_reply_routing.py tests/test_reply_research.py

  docker-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build and verify isolated Docker contracts without external APIs
        run: python3 containers/discord-chat/verify.py
