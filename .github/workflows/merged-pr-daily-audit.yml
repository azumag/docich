name: merged-pr-daily-audit

# Persist enough merge/check metadata to distinguish a real dropped event from
# this repository's short Actions/check retention window. The audit writes a
# machine-readable artifact and a rolling issue comment; issue #5800 is the
# design source.

on:
  schedule:
    # 05:16 JST, the same daily audit slot that detected #5717.
    - cron: '16 20 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: merged-pr-daily-audit-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
      - name: Audit merged PR CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AUDIT_OUTPUT: merged-pr-audit-evidence.json
        run: python3 .github/scripts/merged_pr_ci_audit.py audit
      - name: Upload audit evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merged-pr-daily-audit-evidence
          path: merged-pr-audit-evidence.json
          if-no-files-found: ignore
          retention-days: 7
