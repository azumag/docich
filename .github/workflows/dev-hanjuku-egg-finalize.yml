name: Temporary Hanjuku egg fix validation

on:
  push:
    branches: [fix/hanjuku-conserve-eggs-when-ahead-20261015]
    paths: [.github/workflows/dev-hanjuku-egg-finalize.yml]

permissions:
  contents: write

concurrency:
  group: temporary-hanjuku-egg-fix
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'azumag/docich' && github.actor == 'azumag' && github.ref == 'refs/heads/fix/hanjuku-conserve-eggs-when-ahead-20261015'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          submodules: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python3 -m pip install -q -r requirements-test.txt
      - name: Apply exact scoped edits in the disposable checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old_version = 'hanjuku-chart-v223-value-aware-retreat'
          new_version = 'hanjuku-chart-v224-overwhelming-melee-egg-save'
          for name, expected in [('src/docich/hanjuku/version.py', 1), ('tests/test_hanjuku_chart_bot.py', 2)]:
              path = Path(name)
              text = path.read_text()
              assert text.count(old_version) == expected, (name, 'version precondition changed')
              path.write_text(text.replace(old_version, new_version))
          path = Path('src/docich/hanjuku/judgment/battle.py')
          text = path.read_text()
          old = "    rescue = cur.get('survival') or {}\n    return (not cur.get('egg_battle') and _survival_needed(cur)"
          new = "    rescue = cur.get('survival') or {}\n    # A real conservation menu already inspected the egg. Recheck current\n    # strength before reopening it; danger cancels this permission.\n    if (rescue.get('conserving_melee') is True\n            and _hold_melee_egg(mem, cur, set(rescue.get('conserved_labels') or ()))):\n        return False\n    return (not cur.get('egg_battle') and _survival_needed(cur)"
          assert text.count(old) == 1, 'egg-before-retreat precondition changed'
          path.write_text(text.replace(old, new))
          path = Path('tests/test_hanjuku_egg_timing.py')
          text = path.read_text()
          start = text.index('def test_preservation_requires_all_current_safe_conditions(')
          end = text.find('\n\ndef ', start)
          end = len(text) if end < 0 else end
          section = text[start:end]
          old = "assert p._hold_melee_egg(mem, mem['battle'], labels) is False"
          assert section.count(old) == 1, 'legacy expectation precondition changed'
          section = section.replace(old, "assert p._hold_melee_egg(mem, mem['battle'], labels) is (change == 'no_card')")
          path.write_text(text[:start] + section + text[end:])
          path = Path('ops/vm_actions/collect_diagnostics.py')
          text = path.read_text()
          old = '"hanjuku-script-v1", "hanjuku-chart-v2",'
          assert text.count(old) == 1, 'diagnostic allowlist precondition changed'
          path.write_text(text.replace(old, old + '\n            "' + new_version + '",'))
          path = Path('tests/test_hanjuku_overwhelming_egg_conservation.py')
          text = path.read_text()
          assert 'def test_positive_egg_does_not_reopen_after_current_conservation' not in text
          extra = '''

          def test_positive_egg_does_not_reopen_after_current_conservation():
              from test_hanjuku_card_damage_gate import panel
              mem = memory()
              cur = mem['battle']
              assert p.battle_menu_step(menu(('たまごをつかう', 'たいきゃく')), mem) == [p.pad('b')]
              opens = cur['survival']['opens']
              for _ in range(3):
                  p.battle_step(panel(mem, soldiers=(5, 0)), mem)
              assert cur['survival']['opens'] == opens
              assert not any(r.get('decision') == 'battle_egg_before_retreat' for r in mem['_records'])
              assert cur['survival']['egg_attempted'] is False
              cur['ally_hp'] = 12
              assert p._egg_before_retreat(mem, cur) is True


          def test_diagnostics_accepts_exact_new_version_without_allowing_unknown_text():
              import importlib.util
              from pathlib import Path
              from docich.hanjuku.version import BOT_VERSION
              path = Path(__file__).resolve().parents[1] / 'ops/vm_actions/collect_diagnostics.py'
              spec = importlib.util.spec_from_file_location('egg_conservation_diagnostics', str(path))
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              assert module._project_corner_state({'bot_version': BOT_VERSION})['bot_version'] == BOT_VERSION
              for value in ('not-allowlisted-token', BOT_VERSION + '-extra', None):
                  assert module._project_corner_state({'bot_version': value})['bot_version'] is None
          '''
          from textwrap import dedent
          path.write_text(text + dedent(extra))
          PY
      - name: Test affected battle, version and diagnostic contracts
        run: python3 -m pytest -q tests/test_hanjuku_overwhelming_egg_conservation.py tests/test_hanjuku_egg_timing.py tests/test_hanjuku_melee_hp_continuation.py tests/test_hanjuku_combat_strength.py tests/test_hanjuku_chart_bot.py -n 4 --dist loadfile
      - name: Test all single-threaded scene contracts serially
        run: python3 -m pytest -q tests/test_hanjuku_scene_process.py
      - name: Publish only validated source and test edits to this feature branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/docich/hanjuku/version.py src/docich/hanjuku/judgment/battle.py ops/vm_actions/collect_diagnostics.py tests/test_hanjuku_chart_bot.py tests/test_hanjuku_egg_timing.py tests/test_hanjuku_overwhelming_egg_conservation.py
          git commit -m 'fix(hanjuku): retain measured egg conservation and update validated runtime version'
          git push origin HEAD:refs/heads/fix/hanjuku-conserve-eggs-when-ahead-20261015
