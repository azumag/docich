[game]
name = "ninvaders"
title = "Space Invaders"
adapter = "cli"

# ninvaders はタイトル起動・試合終了時に自動でタイトルへ戻る (同一プロセス継続)。
# deploy 済み repo 内の wrapper (games/cli-wrappers/ninvaders_docich.sh) が
# SPACE 開始とゲーム中の左右移動・射撃を駆動し、最終スコアを scorelog へ追記する。
# docich CLI adapter には wrapper 型ゲームの丸境界フックがまだ無いため、切替は
# 従来の immediate-quiesce 経路を使う。
[lifecycle]
require_round_boundary = false

[cli]
# docich の systemd unit は repo root を WorkingDirectory にしている。
# /usr/local/bin の手動コピーを介さず、deploy された tracked wrapper を直接使う。
command = "/bin/sh games/cli-wrappers/ninvaders_docich.sh"
cols = 80
rows = 24
font = "monospace"
font_size = 18

[agent]
enabled = false  # wrapper が無人プレイする (bot は issue #15 の AI 方針で別途)

# 日次レトロコーナーでも wrapper 自身が無人プレイを完結できるため、
# per-move agent なしで選択可能。
[corner]
self_play = true
intro = "NInvadersは端末上で動くSpace Invaders系のレトロゲームです。自動プレイで侵略者を迎撃します。"

# operatorの手動retro-cornerテストからも無人ゲームとして選択可能。
[retro_corner]
unattended = true

# Twitch 配信カテゴリー・タイトル連動 (soviet_now update_stream_game.sh が読む)。
# 原作 Space Invaders (4669) を採用 (照合済み)。
[twitch]
category_id = "4669"
category_name = "Space Invaders"
title_prefix = "[NInvaders]"
