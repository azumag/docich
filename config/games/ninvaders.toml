[game]
name = "ninvaders"
title = "Space Invaders"
adapter = "cli"

# ninvaders はタイトル起動・試合終了時に自動でタイトルへ戻る (同一プロセス継続)。
# deploy 済み repo 内の wrapper (games/cli-wrappers/ninvaders_docich.sh) が試合開始・
# scorelog追記・ゲーム中のキー入力を所有する。構造的改善で検証・昇格した policy を
# 試合ごとに読み込むため、別の [agent] command brain は無効にしてキー競合を防ぐ。
# 実ゲーム (Docker/実バイナリ) の 300秒 A/B では wrapper 自走の基準プレイヤーが
# 1試合 1950-3100点だったのに対し brain は 4750-6800点 (各2走・約2倍) だった。
# docich CLI adapter には wrapper 型ゲームの丸境界フックがまだ無いため、切替は
# 従来の immediate-quiesce 経路を使う。
[lifecycle]
require_round_boundary = false

[cli]
# docich の systemd unit は repo root を WorkingDirectory にしている。
# /usr/local/bin の手動コピーを介さず、deploy された tracked wrapper を直接使う。
command = "/bin/sh games/cli-wrappers/ninvaders_docich.sh policy"
cols = 80
rows = 24
font = "monospace"
font_size = 18

[agent]
# 実プレイヤーは wrapper 内の検証済み policy runner。二重入力を避ける。
enabled = false
brain = "command"
command = ["python3", "brains/ninvaders/brain.py"]
interval_ms = 250

# レトロコーナーでは wrapper と command brain (LLM不要) が無人で完走できるため、
# per-move agent (LLM) なしで選択可能。
[corner]
self_play = true
intro = "NInvadersは端末上で動くSpace Invaders系のレトロゲームです。自動プレイで侵略者を迎撃します。"

# operatorの手動retro-cornerテストからも無人ゲームとして選択可能。
[retro_corner]
unattended = true
# rolling/lottery mode で「遊べる」= この実行ファイルが実在すること。
requires = ["/usr/games/ninvaders"]

# Twitch 配信カテゴリー・タイトル連動 (soviet_now update_stream_game.sh が読む)。
# 原作 Space Invaders (4669) を採用 (照合済み)。
[twitch]
category_id = "4669"
category_name = "Space Invaders"
title_prefix = "[NInvaders]"
