[game]
name = "hanjuku-hero"
title = "半熟英雄 (SFC)"
adapter = "retroarch"

[retroarch]
rom = "games/roms/hanjuku-hero.sfc"   # 著作権物のためGit追跡外。自己吸い出しROMはVMのこの相対位置にのみ配置
core = "auto"                          # or コア .so の絶対パス
# [retroarch.pad_map] で既定マップの上書きも可能

[lifecycle]
require_round_boundary = true
boundary_timeout_s = 300

[agent]
enabled = true                         # VMのROM・認証・費用運用を前提に自動rotationで有効化
# brain の詳細設計・知識注入 (games/hanjuku-sfc-speedrun submodule) は docs/hanjuku_brain.md 参照
brain = "command"
command = ["python3", "brains/hanjuku/brain.py"]
interval_ms = 7000                     # LLM レイテンシ (3〜6秒) を織り込んだ周期

# unified live rotationへ登録済み。ROM/core/実行ファイルが揃った環境だけ抽選候補になる。
# 実機プレイ、brainの認証・費用、表示・保存境界のE2E確認は別ゲートであり、設定有効化だけでは証明しない。
[retro_corner]
enabled = true
unattended = true
# ROM/coreは実行ファイルではないためrequiresへ混ぜない。
# claudeは既定brain backend用。存在だけでは認証・予算を保証しない。
requires = ["retroarch", "dbus-run-session", "python3", "claude"]

# Twitch 配信カテゴリー・タイトル連動 (soviet_now update_stream_game.sh が読む)。
# category は IGDB 照合済み (SFC初代の副題付き項目を採用)。
# 運用ルールは games/soviet_now/docs/twitch_game_sync.md。
[twitch]
category_id = "21236"
category_name = "Hanjuku Hero: Aa Sekai yo Hanjuku Nare...!!"
title_prefix = "[半熟英雄]"
