[game]
name = "hanjuku-hero"
title = "半熟英雄 (SFC)"
adapter = "retroarch"

[retroarch]
rom = "games/roms/hanjuku-hero.sfc"   # 著作権物のためGit追跡外。自己吸い出しROMはVMのこの相対位置にのみ配置
core = "auto"                          # or コア .so の絶対パス
audio_enabled = true
audio_sink = "soren_null"               # 既存の配信busへゲームBGM・効果音を出す
audio_latency_ms = 289                  # CPU負荷時の音切れ軽減。本番で改善確認した値
audio_volume_percent = 80               # 半熟英雄のゲーム音声streamだけを80%にする(共通bus・読み上げ・他ゲームは不変)
# [retroarch.pad_map] で既定マップの上書きも可能

[lifecycle]
require_round_boundary = true
boundary_timeout_s = 300

[agent]
enabled = true
# 決定的な画面判定・入力script。詳細は docs/hanjuku_script_bot.md。
brain = "command"
command = ["python3", "brains/hanjuku/bot.py"]
interval_ms = 1500

[hanjuku]
script_bot = true
# チャート準拠の決定的状態機械(hanjuku-chart-v14-visible-hp)。操作経路(キー送信)にLLMは入れない。
# 20分の時間制限なし。ゲームオーバー、または実ゲーム画面が300秒不変で終了。
# OpenCodeによる試合後の自動改善は別途実装。操作中のLLM呼出しは行わない。

# チャート外(#1085): 出撃可能な指示が無い時だけ、操作経路の外でLLMが独自order列を非同期生成する。
# 出力は城名・切り札名・unlock条件を実測済みチャート事実で検証してから採用し、キー送信は決定的botのみ。
# agents が非空であることを課金LLM実行の合意とみなす（DOCICH_ALLOW_REAL_AI=1 を付与）。
# interim_jev: 調整チャート待ちの間、JEV(jev-1.13.0)が決定的候補(ボス以外の未占領城の再攻撃)から
# ラベルを1つ選ぶ。hold(見送り)は無い。失敗・低確信・候補外は最初の攻撃候補で必ず出撃。JEV確認は1状況あたり最大2回。
[hanjuku.chart_adjust]
enabled = true
agents = "opencode-go:longcat-2.5-preview-free,opencode-go:space-bunny-free,opencode-go:deepseek-v4.1-flash,amd:DeepSeek-V4-Flash,opencode-go:deepseek-v4-flash,opencode-go:muse-spark-1.3-contributor"
timeout_s = 180
max_attempts = 2
interim_jev = true
interim_timeout_ms = 1500

# 固定テンプレート実況は停止。既存corner monitorが毎回設定を読むため稼働中も停止する。
# speakerは下の場面実況にも共通。生成失敗時に固定文へ戻すことはしない。
[hanjuku.narration]
enabled = false
cooldown_s = 25
max_age_s = 20
speaker = ""

# 別consumerが確認済みのHP/兵数/結果/方針変更から短文を生成する（ゲーム入力は待たない）。
# enabledは既存Soren実況roleによる生成への明示opt-in。モデル/秘密/共有queueは追加しない。
# BATCH_COMMENTARY_AGENTS → RADIO_AGENTS → AI_COMMON_AGENTS の既存実効設定を使う。
# 話す事実がない・同場面・失敗・期限切れは無音。生成時間で観測の期限を延長しない。
[hanjuku.scene_commentary]
enabled = true
cooldown_s = 25
max_age_s = 20
generation_timeout_s = 15

# unified live rotationへ登録済み。ROM/core/実行ファイルが揃った環境だけ抽選候補になる。
# 実機プレイ・表示・終了後の復帰は、設定有効化と分けて検証する。
[retro_corner]
enabled = true
unattended = true
# ROM/coreは実行ファイルではないためrequiresへ混ぜない。
# 操作にclaude/opencode等のLLM CLIは不要。
requires = ["retroarch", "dbus-run-session", "python3"]

# Twitch 配信カテゴリー・タイトル連動 (soviet_now update_stream_game.sh が読む)。
# category は IGDB 照合済み (SFC初代の副題付き項目を採用)。
# 運用ルールは games/soviet_now/docs/twitch_game_sync.md。
[twitch]
category_id = "21236"
category_name = "Hanjuku Hero: Aa Sekai yo Hanjuku Nare...!!"
title_prefix = "[半熟英雄]"

# 2026-09-30 owner-confirmed best: chapter 2 reached, chapter 1 cleared.
[hanjuku.predictions]
enabled = true
seed_best_cleared = 1
ending_window_seconds = 1800
