[game]
name = "nethack"
title = "NetHack"
adapter = "cli"

[cli]
command = "nethack"
cols = 80
rows = 24
font = "monospace"
font_size = 18

# 長期攻略コーナーでは通常の NetHack save/restore を使う。
# persistent_run=true のときだけ coordinator lifecycle をNetHack専用にする。
# -u player_name は coordinator adapter が付与し、この名前とUIDでsaveが識別される。
# xlogfile は終了結果の機械可読な正本、dump_dir は詳細な反省材料として使う。
[nethack]
persistent_run = true
player_name = "docich"
save_dir = "/var/games/nethack/save"
xlogfile = "/var/games/nethack/xlogfile"
dump_dir = "/var/games/nethack/dumps"

[agent]
enabled = false        # random brain の配線テストは CLI から明示実行
brain = "random"
interval_ms = 1500

# Twitch 配信カテゴリー・タイトル連動 (soviet_now update_stream_game.sh が読む)。
# category は IGDB 照合済み。運用ルールは games/soviet_now/docs/twitch_game_sync.md。
[twitch]
category_id = "130"
category_name = "NetHack"
title_prefix = "[NetHack]"
