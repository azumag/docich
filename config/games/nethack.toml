[game]
name = "nethack"
title = "NetHack"
adapter = "cli"

[cli]
command = "nethack"
cols = 80
rows = 24
font = "monospace"
font_size = 18

# 長期攻略コーナーでは通常の NetHack save/restore を使う。
# persistent_run=true のときだけ coordinator lifecycle をNetHack専用にする。
# -u player_name は coordinator adapter が付与し、この名前とUIDでsaveが識別される。
# xlogfile は終了結果の機械可読な正本、dump_dir は詳細な反省材料として使う。
[nethack]
persistent_run = true
player_name = "docich"
save_dir = "/var/games/nethack/save"
xlogfile = "/var/games/nethack/xlogfile"
dump_dir = "/var/games/nethack/dumps"

# P3eのstrategistは明示opt-in。enabled=falseでは外部model commandを起動しない。
# proposalはadvisory-onlyで、consume/equip/prompt/階段等のkeyには変換しない。
[nethack.strategist]
enabled = false
command = []
timeout_s = 20.0
cooldown_s = 30.0
max_calls = 24
narration_enabled = false
narration_cooldown_s = 20.0
speaker = ""

# P4a structured observation は比較専用shadow。policy/actionへは使わない。
# pathが空なら <state_dir>/nethack/shadow/latest.json を読む。
[nethack.shadow]
enabled = false
path = ""
max_age_s = 5.0
max_bytes = 131072

# P4b producer sidecar。外部commandのstdoutをstrict public schemaで検証し、
# 合格したsnapshotだけを [nethack.shadow] のpathへatomic publishする。
[nethack.shadow_source]
enabled = false
command = []
interval_s = 1.0
timeout_s = 2.0
max_response_bytes = 131072

# P5e candidate shadow はP5d offline評価済みmanifestだけを明示opt-inで使用する。
# candidate proposalはdaemon workerで評価し、本番Actionへは一切接続しない。
[nethack.candidate_shadow]
enabled = false
manifest = ""
cooldown_s = 30.0
max_calls = 24

# 起動時だけ既知のキャラ作成質問を応答。60秒/40観測/12入力でfail-closed。
[nethack.startup]
enabled = true

# P3bの判断説明。strategistとは独立し、既存audio workerのキューへ投入する。
[nethack.narration]
enabled = true
cooldown_s = 20.0
speaker = ""  # 共通audio workerの既定音声

[agent]
enabled = true
brain = "nethack"
interval_ms = 1500

# Twitch 配信カテゴリー・タイトル連動 (soviet_now update_stream_game.sh が読む)。
# category は IGDB 照合済み。運用ルールは games/soviet_now/docs/twitch_game_sync.md。
[twitch]
category_id = "130"
category_name = "NetHack"
title_prefix = "[NetHack]"
