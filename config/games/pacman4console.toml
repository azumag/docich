[game]
name = "pacman4console"
title = "Pac-Man"
adapter = "cli"

# pacman4console は最低 29x32 の pane を要求するため rows=32 を宣言する
# (他CLIゲームの 80x24 とは異なる。presentation は contain で吸収する)。
# タイトル起動・試合終了時は Game Over ダイアログを出す (同一プロセス継続)。
# wrapper (/usr/local/bin/pacman4console_docich) が開始・再開キーを駆動し、
# 最終スコアを scorelog へ追記する。docich CLI adapter には wrapper 型ゲームの
# 丸境界フックがまだ無いため、切替は従来の immediate-quiesce 経路を使う。
[lifecycle]
require_round_boundary = false

[cli]
command = "/usr/local/bin/pacman4console_docich"
cols = 80
rows = 32
font = "monospace"
font_size = 18

[agent]
enabled = false  # wrapper が無人プレイする (bot は issue #15 の AI 方針で別途)

# Twitch 配信カテゴリー・タイトル連動 (soviet_now update_stream_game.sh が読む)。
# 原作 PAC-MAN (140023) を採用 (照合済み)。
[twitch]
category_id = "140023"
category_name = "PAC-MAN"
title_prefix = "[PacMan]"
