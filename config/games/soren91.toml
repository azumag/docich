[game]
name = "soren91"
title = "Soren91 (Macリモートレンダラー)"
adapter = "soren91"

[agent]
# true にすると coordinator が soren91/main.mjs (OCI bot) を agent window で
# 起動し、コーナー終了時に停止する。切替は Mac 側 CDP プロキシの応答を待って
# commit する (応答が無い間は fail-closed でロールバック)。
# 表示切替だけを試す検証では一時的に false へ戻してよい。
enabled = true
brain = "command"
command = ""

[lifecycle]
# Soren本編との境界連携は Phase 3。それまでは即時 quiesce で切り替える。
require_round_boundary = false

[soren91]
# Mac local agent (soren91_local_agent.mjs) の base URL を持つ環境変数名。
# 値は http(s)://<mac-tailscale-ip>:<port>、host は 100.64.0.0/10 のみ許可。
agent_base_url_env = "SOREN91_MACOS_AGENT_BASE_URL"
# Bearer token を持つ環境変数名 (値そのものは書かない)。
agent_token_env = "SOREN91_LOCAL_AGENT_TOKEN"
# OCI 側 Tailscale IP を持つ環境変数名。viewer listener の bind と
# Mac agent へ渡す caller URL の host になる (100.64.0.0/10 のみ許可)。
oci_tailscale_ip_env = "SOREN91_OCI_TAILSCALE_IP"
# OCI から到達できる Mac 側 CDP プロキシの port。Mac 内の Chrome CDP
# (127.0.0.1:9322) ではなく、Tailscale 限定プロキシ (soren91_macos_cdp_host.mjs)
# の port を指定する。OCI bot は SOREN91_REMOTE_CDP_URL=http://<mac-tailscale>:<cdp_port>
# で繋ぎに行く。
cdp_port = 19093
# SRT port。agent へ渡すのは srt://<oci-ip>:<port>?mode=caller、
# viewer は同 port の ?mode=listener で bind する。passphrase 無し。
srt_port = 19192
ffplay_bin = "ffplay"
# SRT viewer (ffplay) が再生する音声の PulseAudio sink。エンコーダは
# <sink>.monitor を採取するので、ゲーム音声は放送に乗る。
audio_sink = "soren_null"
# コーナー告知を読み上げる VOICEVOX 話者（メリケンAI = 14 めいめいひまり）。
# 本番 .env の SOREN91_VOICEVOX_SPEAKER があればそれを優先し、無ければこの値。
voicevox_speaker = 14
# コーナー開始/復帰時に Twitch のカテゴリだけを切り替える
# (soren_root の update_stream_game.sh を呼ぶ。失敗してもコーナーは継続)。
twitch_game = "soren91"
restore_twitch_game = "sorengame"
soren_root = "/home/ubuntu/soren"
# update_stream_game.sh に渡す docich のゲーム定義ディレクトリ。
games_dir = "/home/ubuntu/docich/config/games"
# soviet_now 側の bot。agent.enabled=true のとき必須 (絶対パス)。
# bot の作業ディレクトリは bot_path の親ディレクトリになる。
bot_path = "/home/ubuntu/soren/soren91/main.mjs"
# Mac コールドブート (Chrome 起動＋Unity ロード＋bot 遷移、約2分) に合わせた
# 待ち予算。既定: viewer_wait_sec=240、cdp_wait_sec=180。
# 必要なら上書き可 (どちらも 10-600 の整数)。
# viewer_wait_sec = 240
# cdp_wait_sec = 180

# Twitch 配信カテゴリー・タイトル連動 (soviet_now update_stream_game.sh が読む)。
# Soren本編と同じ IGDB 項目 (Soren Game)。Phase 3 の本編連携までは
# title_prefix でコーナーを区別する。
[twitch]
category_id = "1530787860"
category_name = "Soren Game"
title_prefix = "[Soren91]"
