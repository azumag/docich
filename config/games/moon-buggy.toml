[game]
name = "moon-buggy"
title = "Moon Buggy"
adapter = "cli"

# moon-buggy はタイトル起動・試合終了時にハイスコア画面 ("y,RET:new game")
# を出す (同一プロセス継続)。wrapper (/usr/local/bin/moon-buggy_docich) が
# 開始・再開キーを駆動し、最終スコアを scorelog へ追記する。docich CLI adapter
# には wrapper 型ゲームの丸境界フックがまだ無いため、切替は従来の
# immediate-quiesce 経路を使う。
[lifecycle]
require_round_boundary = false

[cli]
command = "/usr/local/bin/moon-buggy_docich"
cols = 80
rows = 24
font = "monospace"
font_size = 18

[agent]
enabled = false  # wrapper が無人プレイする (bot は issue #15 の AI 方針で別途)

# Twitch 配信カテゴリー・タイトル連動 (soviet_now update_stream_game.sh が読む)。
# Moon Buggy (207111248) を採用 (照合済み)。
[twitch]
category_id = "207111248"
category_name = "Moon Buggy"
title_prefix = "[MoonBuggy]"
