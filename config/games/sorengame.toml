[game]
name = "sorengame"
title = "soren game (Unity WebGL)"
adapter = "soren"
submodule = "games/soviet_now"

[agent]
enabled = false  # 操作AIはsoviet_nowのgame-only lifecycleが所有する

# JEV本編プレイヤーコーナー。自動起動はなく、明示的な手動コマンドだけが
# player_change brokerを使う。実API・本番配信への接続をこの値だけでは有効化しない。
[jev_corner]
enabled = false
one_game = true
max_requests_per_run = 500
decision_budget_ms = 1500
http_timeout_ms = 1000
boundary_timeout_s = 7200
candidate_version = "uniform25-v1"
model = "jev-1.13.0"

[lifecycle]
require_round_boundary = true
boundary_timeout_s = 7200

[soren]
root = "/home/ubuntu/soren"

# Twitch 配信カテゴリー・タイトル連動 (soviet_now update_stream_game.sh が読む)。
# category は IGDB 照合済み。運用ルールは games/soviet_now/docs/twitch_game_sync.md。
[twitch]
category_id = "1530787860"
category_name = "Soren Game"
title_prefix = "[Soren]"
