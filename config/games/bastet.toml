[game]
name = "bastet"
title = "Bastet (Tetris)"
adapter = "cli"

# bastet はメニュー起動・試合終了時にダイアログ ("Try again!") → ハイスコア表 →
# メニューを経由する (同一プロセス継続・各画面は Enter で進む)。wrapper
# (/bin/sh games/cli-wrappers/bastet_docich.sh) が Enter を駆動し、最終スコアを scorelog へ
# 追記する。docich CLI adapter には wrapper 型ゲームの丸境界フックがまだ無い
# ため、切替は従来の immediate-quiesce 経路を使う。
[lifecycle]
require_round_boundary = false

[cli]
command = "/bin/sh games/cli-wrappers/bastet_docich.sh"
cols = 80
rows = 24
font = "monospace"
font_size = 18

[agent]
# プレイ中の落下は brain、開始・再開は wrapper が所有する。
# DOCICH_BRAIN_WEIGHTS または run/brain/bastet/weights.json を毎回読む。
enabled = true
brain = "command"
command = ["python3", "brains/bastet/brain.py"]
interval_ms = 500

[corner]
self_play = true
intro = "Bastetは意地悪なブロックが出現する落ち物ゲームです。自動プレイでピースを落下させます。"

[retro_corner]
unattended = true

# Twitch 配信カテゴリー・タイトル連動 (soviet_now update_stream_game.sh が読む)。
# IGDB に Bastet 項目は無いため Tetris 系として Tetris (128844908) で代替 (照合済み)。
[twitch]
category_id = "128844908"
category_name = "Tetris"
title_prefix = "[Bastet]"
