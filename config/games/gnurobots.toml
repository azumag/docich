[game]
name = "gnurobots"
title = "GNU Robots"
adapter = "cli"

# ゲームプロセスは試合ごとに終了し、wrapper (/usr/local/bin/gnurobots_docich)
# が pane を維持する。docich CLI adapter には wrapper 型ゲームの丸境界フックが
# まだ無いため、切替は従来の immediate-quiesce 経路を使う (試合は数十秒で終わる)。
[lifecycle]
require_round_boundary = false

[cli]
command = "/usr/local/bin/gnurobots_docich"
cols = 80
rows = 24
font = "monospace"
font_size = 18

[agent]
enabled = false  # ゲームが resolver script で自走するため per-move agent は不要

# Twitch 配信カテゴリー・タイトル連動 (soviet_now update_stream_game.sh が読む)。
# IGDB に GNU Robots 項目は無い (2026-09-06 照合済み)。ボットプログラミング実況として
# Software and Game Development (1469308723) で代替。
[twitch]
category_id = "1469308723"
category_name = "Software and Game Development"
title_prefix = "[GnuRobots]"
