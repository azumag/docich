[display]
number = 98          # DISPLAY=:98 (soren が :99 を使用中のため衝突回避。§0)
width = 1280
height = 720
color_depth = 24
managed = true       # false なら既存displayへ接続し、Xvfbを所有しない

[audio]
enabled = true       # pulseaudio が無い環境では false (無音配信)
sink_name = "docich_sink"
set_default = false  # true にしない限り set-default-sink はしない (soren 共存。§0)

[stream]
ffmpeg_bin = "ffmpeg"              # DOCICH_FFMPEG_BIN で上書き可能
mode = "null"                    # null | rtmp | file
rtmp_url = "rtmp://live.twitch.tv/app"
stream_key_env = "DOCICH_STREAM_KEY"
file_path = "run/out.flv"
framerate = 30
video_bitrate = "4500k"
maxrate = "5000k"
bufsize = "9000k"
preset = "veryfast"
audio_bitrate = "160k"
gop_seconds = 2

[captions]
enabled = false                    # DOCICH_CC_ENABLED=1 で有効化
# 空なら $XDG_RUNTIME_DIR/docich/ffmpeg-cc.sock。DOCICH_CC_SOCKET で上書き可能
socket_path = ""

[agent]
default_interval_ms = 2000
brain_timeout_s = 120

[paths]
state_dir = "run"                # リポジトリ相対
games_dir = "config/games"
roms_dir = "games/roms"

# --- Phase 3: 運用強化 (architecture.md §10) ---

[watchdog]
enabled = false       # 既定は無効。true にすると `docich up` が watchdog window も起動する
interval_s = 60       # 点検周期 (秒)。5以上
freeze_cycles = 5      # 連続同一スクリーンショットでフリーズ判定する回数。2以上
recover_windows = true # display/audio/stream window 消失時に `up` 相当で再生成する

[trading]
paper_worker_enabled = false
interval_s = 60
paper_capital_jpy = 10000
notifications_enabled = false
notification_speech_enabled = false

[rotation]
games = []            # `docich rotate` が巡回するゲーム名の順序 (例: ["nethack", "hanjuku-hero"])。空だとエラー

# --- メリケンAI レトロゲームコーナー ---
# 通常profileでは無効。本番は config/docich.soren-live.toml で明示的に有効化する。
[retro_corner]
enabled = false
start_hour = 20
duration_minutes = 60
timezone = "Asia/Tokyo"
games = ["robots"]

# --- Web UI (モデルチェーン / バックオフ管理) ---

[webui]
bind = "127.0.0.1"         # Tailscale serve 経由で公開する想定。非loopback+writable+token未設定は起動時error
port = 8787
soren_root = ""            # 空なら games/soviet_now (未導入ゲームなら "$DOCICH_SOREN_ROOT" または ELOOP_LIB_DIR 相当を指定)
token = ""                 # 空なら Tailscale ACL のみ。設定時は 8 文字以上
token_env = "DOCICH_WEBUI_TOKEN"   # token の上書き環境変数名
allow_cors = false         # 別オリジンからの API 呼び出しを許可 (開発用)
allowed_origins = []  # 実値は環境変数 DOCICH_WEBUI_ALLOWED_ORIGINS で設定（公開したくない private endpoint をコミットしないため）。カンマ/空白区切りで複数可。Tailscale serve 経由の mutation 許可 (#42)
read_only = false          # true だと閲覧専用 (設定変更・backoff 操作・reload 不可)
