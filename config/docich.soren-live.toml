# Soren本番のX displayへ、配信プロセスを止めずゲーム画面だけ載せる設定。
# Xvfb・音声bus・FFmpegはsoren-runtime.serviceが所有し続ける。
[display]
number = 99
width = 1280
height = 720
color_depth = 24
managed = false
viewport_x = 0
viewport_y = 90
viewport_width = 960
viewport_height = 540

[audio]
enabled = false
set_default = false

[stream]
mode = "null"

[agent]
default_interval_ms = 2000
brain_timeout_s = 120

[paths]
state_dir = "run-soren-live"
games_dir = "config/games"
roms_dir = "games/roms"

[watchdog]
enabled = false
recover_windows = false

[trading]
paper_worker_enabled = false
interval_s = 60
paper_capital_jpy = 10000
notifications_enabled = false
notification_speech_enabled = false

[rotation]
games = []

# Soren本番は背景で稼働させたまま、20:00 JSTから1時間だけRobotsを前面へ載せる。
# docich側canonicalがidleなら、終了時はstopして背景のSorenへ自然に戻る。
[retro_corner]
enabled = true
start_hour = 20
duration_minutes = 60
timezone = "Asia/Tokyo"
games = ["robots"]
