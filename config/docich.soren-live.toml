# Soren本番のX displayへ、配信プロセスを止めずゲーム画面だけ載せる設定。
# Xvfb・音声bus・FFmpegはsoren-runtime.serviceが所有し続ける。
[display]
number = 99
width = 1280
height = 720
color_depth = 24
managed = false
viewport_x = 0
viewport_y = 90
viewport_width = 960
viewport_height = 540

[audio]
enabled = false
set_default = false

[stream]
mode = "null"

[agent]
default_interval_ms = 2000
brain_timeout_s = 120

[paths]
state_dir = "run-soren-live"
games_dir = "config/games"
roms_dir = "games/roms"

[watchdog]
enabled = false
recover_windows = false

[trading]
paper_worker_enabled = true
interval_s = 60
paper_capital_jpy = 10000
notifications_enabled = true
notification_speech_enabled = true

# 新記録の確定だけを既存Twitchクリップキューへ渡す。資格情報はSorenが所有。
[record_clips]
enabled = true

[rotation]
games = []

[corner_rotation]
enabled = true
# "interval": 一定間隔。次の発火は「直近の発火 + interval_minutes」。
# "queue": 間隔アンカーを使わず、共有スロットが空き次第、cooldown外の候補から
#          一様ランダム（seed再現・slotごとに再抽選）で連続発火する。
schedule_mode = "interval"
# 目標間隔（分）。60 = 1時間ごとに1本。未設定なら 24h/N（N=13 なら約1時間51分）。
interval_minutes = 60
# 同一cornerの再選択を許すまでのrolling窓。予約・実開始・終了・手動使用を数える。
cooldown_hours = 24.0
# 唯一のproduction corner catalog。選択・実行履歴はrolling 24hで除外。
# 候補数Nは実行可能・非休止の件数（24h/Nはinterval_minutes未設定時の目標）。
# adapter設定のstart_hourは互換用のみ。
# 定期tickは canonical `docich-corner-rotation.timer`（移行期間は
# `docich-retro-corner.timer` が同unitへのalias）が毎分実行する。
corners = [
  { id = "ninvaders", adapter = "game", game = "ninvaders" },
  { id = "nsnake", adapter = "game", game = "nsnake", target_matches = 1 },
  { id = "bastet", adapter = "game", game = "bastet" },
  { id = "moon-buggy", adapter = "game", game = "moon-buggy" },
  { id = "pacman4console", adapter = "game", game = "pacman4console" },
  { id = "nethack", adapter = "nethack", game = "nethack" },
  # ROM本体は著作権物のためGit追跡外。自己吸い出しROMはVMにのみ配置し、
  # ROM/core/実行環境が揃ったVMでだけ適格性検査を通過して抽選される。
  { id = "hanjuku-hero", adapter = "game", game = "hanjuku-hero" },
  { id = "paper", adapter = "paper", game = "paper-view", live_eligible = false },
  { id = "meriken", adapter = "meriken", game = "soren91" },
  # beta.tsuitate.info の1局owner。次局開始可能なWorkerだけを自動抽選候補にする。
  { id = "tsuitate", adapter = "tsuitate", game = "tsuitate-view", audio_enabled = true },
  # 音声の再生完了receiptに合わせて全国→11地点→全国を進行。4分は安全上限で、完了時は即復帰。
  { id = "weather", adapter = "weather", game = "weather-view", enabled = true, duration_minutes = 4, fetch_on_start = true, audio_enabled = true },
  # 予想王: チャネルポイント予想の的中率ランキング（上位予想者のみ集計）。
  # 2026-10-14 オーナー承認で有効化（enabled = true）。
  # 2026-10-15 オーナー判断で読み上げを有効化（audio_enabled = true）。
  # 2026-10-15 オーナー判断で manual_only を解除し、24時間 rolling rotation の
  # 自動抽選に組み入れる（WebUI からの手動予約も従来どおり可能）。
  # コーナー紹介と上位3名のrankingを、共有 audio worker の既定音声で2発話する。
  { id = "yosou-oh", adapter = "yoso", game = "yosou-view", enabled = true, audio_enabled = true },
  # 同志カード大賞: TwiCaの opt-in 済みランキングから集計済みの4部門を表示する。
  # 公開は配信者単位の opt-in（既定OFF・設定UI無し）で、未 opt-in は 404 になり
  # 当該コーナーは開始しない。privacy 方針（周知・非表示申請は行わない。不適切名は
  # Twitch 側の処理）は 2026-10-15 に決着済み。
  # 2026-10-15 オーナー承認で有効化し、24時間ローテーションの抽選対象へ入れる
  # （docs/features/doushi-card-corner.md §5）。表示は 15 秒 × 4 ページ、上限は
  # doushi_corner.DEFAULT_DURATION_MINUTES（2分。duration_minutes 未指定時）。
  # 読み上げ・overlay は出さない（doushi_narration.ANNOUNCEMENT_ENABLED）。
  { id = "doushi-card", adapter = "doushi", game = "doushi-view", enabled = true },
  # ぷよぷよクローン (#698): オフライン自対戦1局の読み取り専用ビュー。
  # 既定無効・WebUI手動予約のみ (manual_only)。音声・fetch・live は対象外。
  # 24h自動抽選への組入は、オーナーの別承認ステップで行う。
  { id = "puyo-corner", adapter = "puyo", game = "puyo-view", enabled = false, manual_only = true },
  # AI探偵ミステリー: 視聴者参加型の1話完結推理コーナー（docich#684、2026-10-18
  # オーナー承認の案A＋統合判断）。事件の答え（犯人・手法・動機）は決定論エンジンが
  # 開始時にseed確定し、コミットメント（SHA-256）を配信ボードへ表示。調査の行動選択は
  # Twitchアンケート（TWITCH_POLLS_ENABLED=1 のとき）、最終「犯人は誰？」は
  # チャンネルポイント予想（TWITCH_PREDICTIONS_ENABLED=1 のとき）。どちらも
  # 無効・失敗時は seeded のAI探偵が進行する展示モードで完走する。30分枠は
  # 約13分の進行＋余裕で、終了時に必ず答えを開示してから復帰する。
  # trpgオフラインコア(#2481)の汎用ロジック（投票・台帳・検証）を統合済み。
  { id = "mystery", adapter = "mystery", game = "mystery-view", enabled = true, duration_minutes = 30, audio_enabled = true },
  # TRPG / マーダーミステリー (#684, PR-3): 既定無効・WebUI手動予約のみ。
  # 既存 weather/paper/tsuitate と同じ合成 view 方式。有効化・VM反映はオーナー承認後。
  { id = "trpg-corner", adapter = "trpg", game = "trpg-view", enabled = false, manual_only = true },
  # 2026-10-18 オーナー承認（#697 スレッドの承認ボタン）で #697 共産主義法律シミュレーター
  # の production 配線を有効化する。決定論セッションバンク（LLMなし・読み上げなし）を
  # lawsim_corner.DEFAULT_DURATION_MINUTES（3分。duration_minutes 未指定時）で1回転。
  { id = "communist-law-simulator", adapter = "lawsim", game = "lawsim-view", enabled = true },
]

[nethack_corner]
# NetHackの固定時刻cornerは無効のまま、毎朝のローカルretrospectiveだけ有効化する。
enabled = false
daily_improvement = true
daily_improvement_timezone = "Asia/Tokyo"
# direct proposer は別受入。false時は既存retro_corner.improve_agents継承を維持。
daily_improvement_direct_enabled = false
daily_improvement_direct_agents = ""

# docich側canonicalがidleなら、終了時はstopして背景のSorenへ自然に戻る。
[retro_corner]
enabled = true
require_program_boundary = true
timezone = "Asia/Tokyo"
# 以下は実行adapter設定。日次/lottery/rotation設定は旧profileとの互換用。
# 統一モードの選択・間隔・cooldownはcorner_rotationが所有する。
mode = "rotation"
rotation_period_hours = 24.0
rotation_wait_minutes = 10
duration_minutes = 20
target_matches = 3
# mode = "daily" (旧方式: 各ゲームを日1回・start_hour からランダム開始) へ戻すときだけ使う。
start_hour = 19
daily_each_game = true
randomize_start = true
start_window_minutes = 30
# 半熟英雄はVM限定の自己吸い出しROMを使う。ROM本体はGitへ含めず、VMの実行時適格性検査で抽選可否を決める。
# 最初の5ゲームは command brain と bot_eval の bounded headless 評価を使う。
# NetHackは専用adapterで同列のcatalogに入り、persistent_runのセーブ境界を使うbounded slot。
# 旧来の [nethack_corner] 固定tickを別途有効化しない。
# コーナー終了後は対応ゲームだけ改善候補を判定する。Moon Buggy候補は次枠でABBA実戦比較し、
# 平均スコアの高い腕を採用する。
# improve_agents はゲーム一覧ではなく既存のAI委任先チェーン。
improve_agents = "opencode-go:longcat-2.5-preview-free,opencode-go:space-bunny-free,opencode-go:deepseek-v4.1-flash,amd:DeepSeek-V4-Flash,opencode-go:deepseek-v4-flash,opencode-go:muse-spark-1.3-contributor,opencode:mimo-v2.6-flash-free,opencode-go:mimo-v2.6-flash"
# DOCICH_PAPER_IMPROVE_DIRECT_ENABLED=1 のときだけ使うdirect-only候補。
# 未設定/0では従来improve_agentsを維持。本番flagはこのPRでは変更しない。
improve_direct_agents = "cloudflare-api:cf/qwen/qwen3-30b-a3b-fp8"
improve_matches = 2
improve_margin_pct = 10.0

[paper_corner]
enabled = true
# 共通rotation有効時は選択時刻に使わない（旧daily運用への互換値）。
start_hour = 22
timezone = "Asia/Tokyo"
# PAPER ビューの表示: "html" = read-only HTML/canvas ダッシュボード (既定)、
# "text" = 従来の 80x24 テキスト。切り戻しはこの1行のみ。
dashboard = "html"
dashboard_port = 8799
# 開始ナレーションのAI委任先チェーン。非空にすると課金LLM実行の合意とみなす
# (tick 内で DOCICH_ALLOW_REAL_AI=1 を付与して実実行する)。失敗時は
# 決定論的フォールバック文面を読み上げるためコーナーは止まらない。
script_agents = "opencode:muse-spark-1.3-contributor-free,opencode-go:longcat-2.5-preview-free,opencode-go:space-bunny-free,opencode-go:muse-spark-1.3-contributor,opencode:mimo-v2.6-flash-free,opencode-go:mimo-v2.6-flash,amd:DeepSeek-V4-Flash,opencode-go:deepseek-v4.1-flash,opencode-go:deepseek-v4-flash"
# DOCICH_PAPER_SCRIPT_DIRECT_ENABLED=1 のときだけ使うdirect-only候補。
# 未設定/0では上の既存script_agentsを維持する。本番flagはこのPRでは変更しない。
direct_script_agents = "cloudflare-api:cf/qwen/qwen3-30b-a3b-fp8"
script_timeout_s = 240
# 終了後の戦略パラメータ改善の委任先。非空で改善ジョブを切り離し起動する。
improve_agents = "opencode-go:longcat-2.5-preview-free,opencode-go:space-bunny-free,opencode-go:deepseek-v4.1-flash,amd:DeepSeek-V4-Flash,opencode-go:deepseek-v4-flash,opencode-go:muse-spark-1.3-contributor,opencode:mimo-v2.6-flash-free,opencode-go:mimo-v2.6-flash"
# DOCICH_PAPER_IMPROVE_DIRECT_ENABLED=1 のときだけ使うdirect-only候補。
# 未設定/0では従来improve_agentsを維持。本番flagはこのPRでは変更しない。
improve_direct_agents = "cloudflare-api:cf/qwen/qwen3-30b-a3b-fp8"

# メリケン実行adapter。共通catalogでPAPER/各ゲームと同列に選択される。
# start_hourは共通rotation有効時には選択時刻へ影響しない旧daily互換値。
[soren91_corner]
enabled = true
start_hour = 18
duration_minutes = 30
timezone = "Asia/Tokyo"

# ついたて将棋コーナーの読み上げ。audio_enabled は catalog 行、ここは終局後の
# 感想戦を共通LLMで書くためのagent chain。空なら定型文だけを読む（課金実行なし）。
# 非空のchainが課金LLM実行の合意（呼び出し側が DOCICH_ALLOW_REAL_AI=1 を付与する）。
# 入力は公開リプレイから検証済みの事実だけで、盤面・駒種・捕獲は渡さない。
[tsuitate_corner]
review_agents = "opencode:muse-spark-1.3-contributor-free,opencode-go:longcat-2.5-preview-free,opencode-go:space-bunny-free,amd:DeepSeek-V4-Flash"

# AI探偵ミステリーのナレーション。空（既定）なら決定論テンプレートだけを読む
# （課金LLM実行なし）。非空のchainは課金LLM実行の合意（DOCICH_ALLOW_REAL_AI=1）。
# 入力は決定論エンジンが確定させた事件の事実だけで、LLM出力は読み上げにしか
# 使われない（ゲーム状態・答えには一切ならない）。開示フェーズは常に定型文。
[mystery_corner]
narration_agents = ""

[webui]
soren_root = "/home/ubuntu/soren"

# 手動の特別コーナー（OBS→SRT、external-video-corner）。WebUI の「SRT 受付開始」が
# 受信を bind する VM の Tailscale IPv4。自動 rotation には載せない。
[external_video_corner]
listen_ip = "100.71.107.106"
