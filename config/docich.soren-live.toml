# Soren本番のX displayへ、配信プロセスを止めずゲーム画面だけ載せる設定。
# Xvfb・音声bus・FFmpegはsoren-runtime.serviceが所有し続ける。
[display]
number = 99
width = 1280
height = 720
color_depth = 24
managed = false
viewport_x = 0
viewport_y = 90
viewport_width = 960
viewport_height = 540

[audio]
enabled = false
set_default = false

[stream]
mode = "null"

[agent]
default_interval_ms = 2000
brain_timeout_s = 120

[paths]
state_dir = "run-soren-live"
games_dir = "config/games"
roms_dir = "games/roms"

[watchdog]
enabled = false
recover_windows = false

[trading]
paper_worker_enabled = true
interval_s = 60
paper_capital_jpy = 10000
notifications_enabled = true
notification_speech_enabled = true

[rotation]
games = []

# docich側canonicalがidleなら、終了時はstopして背景のSorenへ自然に戻る。
[retro_corner]
enabled = true
require_program_boundary = true
timezone = "Asia/Tokyo"
# rolling: 24時間を登録ゲーム数で割った間隔で必ず候補を抽選する。
# 直近24時間以内に選ばれたゲームは候補から外すので、6ゲームなら4時間ごとに
# 最初の6枠は重複なしのランダム順になり、24時間経過後に再び候補へ戻る。
# 実行ファイルが無いゲームはその枠の候補から除外し、他コーナーが塞いでいる場合は
# 次のtickで再試行する。毎時の確率抽選ではない。PAPER/Soren91/専用NetHackの固定枠が近い場合は、
# 最悪の待ち時間＋durationが固定枠の5分前までに収まるときだけ開始し、固定枠を優先する。
mode = "rotation"
rotation_period_hours = 24.0
rotation_wait_minutes = 10
duration_minutes = 20
target_matches = 3
# mode = "daily" (旧方式: 各ゲームを日1回・start_hour からランダム開始) へ戻すときだけ使う。
start_hour = 19
daily_each_game = true
randomize_start = true
start_window_minutes = 30
games = ["ninvaders", "nsnake", "bastet", "moon-buggy", "pacman4console", "nethack"]
# 最初の5ゲームは command brain と bot_eval の bounded headless 評価を使う。
# NetHackは専用brainと persistent_run のセーブ境界を使うbounded slotで、改善評価は未対応。
# 専用の [nethack_corner] を有効化する場合は、rolling候補からNetHackを外す。
# コーナー終了後は対応ゲームだけ同じ baseline/candidate 比較から改善候補を判定する。
# improve_agents はゲーム一覧ではなく既存のAI委任先チェーン。
improve_agents = "opencode-go:deepseek-v4.1-flash,amd:DeepSeek-V4-Flash,opencode-go:deepseek-v4-flash,opencode-go:muse-spark-1.3-contributor"
improve_matches = 2
improve_margin_pct = 10.0

[paper_corner]
enabled = true
start_hour = 22
timezone = "Asia/Tokyo"
# PAPER ビューの表示: "html" = read-only HTML/canvas ダッシュボード (既定)、
# "text" = 従来の 80x24 テキスト。切り戻しはこの1行のみ。
dashboard = "html"
dashboard_port = 8799
# 開始ナレーションのAI委任先チェーン。非空にすると課金LLM実行の合意とみなす
# (tick 内で DOCICH_ALLOW_REAL_AI=1 を付与して実実行する)。失敗時は
# 決定論的フォールバック文面を読み上げるためコーナーは止まらない。
script_agents = "opencode:muse-spark-1.3-contributor-free,opencode-go:muse-spark-1.3-contributor,amd:DeepSeek-V4-Flash,opencode-go:deepseek-v4.1-flash,opencode-go:deepseek-v4-flash"
script_timeout_s = 240
# 終了後の戦略パラメータ改善の委任先。非空で改善ジョブを切り離し起動する。
improve_agents = "opencode-go:deepseek-v4.1-flash,amd:DeepSeek-V4-Flash,opencode-go:deepseek-v4-flash,opencode-go:muse-spark-1.3-contributor"

# Soren91 定時コーナー (Phase 3)。当面は無効のまま置く。有効化はユーザー判断。
# 検証時は一時的に enabled=true + start_hour/duration_minutes を短時間へ変える。
[soren91_corner]
enabled = true
start_hour = 18
duration_minutes = 30
timezone = "Asia/Tokyo"

[webui]
soren_root = "/home/ubuntu/soren"
