# Soren本番のX displayへ、配信プロセスを止めずゲーム画面だけ載せる設定。
# Xvfb・音声bus・FFmpegはsoren-runtime.serviceが所有し続ける。
[display]
number = 99
width = 1280
height = 720
color_depth = 24
managed = false
viewport_x = 0
viewport_y = 90
viewport_width = 960
viewport_height = 540

[audio]
enabled = false
set_default = false

[stream]
mode = "null"

[agent]
default_interval_ms = 2000
brain_timeout_s = 120

[paths]
state_dir = "run-soren-live"
games_dir = "config/games"
roms_dir = "games/roms"

[watchdog]
enabled = false
recover_windows = false

[trading]
paper_worker_enabled = true
interval_s = 60
paper_capital_jpy = 10000
notifications_enabled = true
notification_speech_enabled = true

[rotation]
games = []

# 19:00 JSTに開始し、実際の切替完了から30分NInvadersを載せる。
# docich側canonicalがidleなら、終了時はstopして背景のSorenへ自然に戻る。
[retro_corner]
enabled = true
require_program_boundary = true
timezone = "Asia/Tokyo"
# 毎時抽選: 固定枠を持たず、毎時 lottery_minute 分に lottery_probability の確率で
# 発火を抽選する。当たれば遊べる (実行ファイルが実在する) ゲームを無作為に選び、
# target_matches 試合の完了を scorelog で検知できれば早期終了し、来なければ
# duration_minutes を上限として終了して元のゲームへ戻る (入力停止で強制終了しない)。
# 他コーナーが進行中/待機中、またはゲーム切替中なら抽選そのものを取りやめる (待たない)。
# 抽選は :05 = 毎正時に始まる固定枠 (soren91 18:00 / PAPER 22:00 など) が先に枠を取れる
# よう正時をずらし、境界待ちを含めても次の正時までに終わる長さにする
# (lottery_minute + lottery_wait_minutes + duration_minutes <= 55。読込時に検証)。
# 前回と同じゲームは、他に遊べるゲームがある限り選ばない。
mode = "lottery"
lottery_probability = 0.3
lottery_minute = 5
lottery_wait_minutes = 10
lottery_avoid_repeat = true
duration_minutes = 20
target_matches = 3
# mode = "daily" (旧方式: 各ゲームを日1回・start_hour からランダム開始) へ戻すときだけ使う。
start_hour = 19
daily_each_game = true
randomize_start = true
start_window_minutes = 30
games = ["ninvaders", "nsnake", "bastet", "moon-buggy", "pacman4console"]
# 5ゲームとも command brain と bot_eval の bounded headless 評価を使い、
# コーナー終了後に同じ baseline/candidate 比較から改善候補を判定する。
# improve_agents はゲーム一覧ではなく既存のAI委任先チェーン。
improve_agents = "opencode-go:deepseek-v4.1-flash,amd:DeepSeek-V4-Flash,opencode-go:deepseek-v4-flash,opencode-go:muse-spark-1.3-contributor"
improve_matches = 2
improve_margin_pct = 10.0

[paper_corner]
enabled = true
start_hour = 22
duration_minutes = 30
timezone = "Asia/Tokyo"
# PAPER ビューの表示: "html" = read-only HTML/canvas ダッシュボード (既定)、
# "text" = 従来の 80x24 テキスト。切り戻しはこの1行のみ。
dashboard = "html"
dashboard_port = 8799
# 開始ナレーションのAI委任先チェーン。非空にすると課金LLM実行の合意とみなす
# (tick 内で DOCICH_ALLOW_REAL_AI=1 を付与して実実行する)。失敗時は
# 決定論的フォールバック文面を読み上げるためコーナーは止まらない。
script_agents = "opencode:muse-spark-1.3-contributor-free,opencode-go:muse-spark-1.3-contributor,amd:DeepSeek-V4-Flash,opencode-go:deepseek-v4.1-flash,opencode-go:deepseek-v4-flash"
script_timeout_s = 240
# 終了後の戦略パラメータ改善の委任先。非空で改善ジョブを切り離し起動する。
improve_agents = "opencode-go:deepseek-v4.1-flash,amd:DeepSeek-V4-Flash,opencode-go:deepseek-v4-flash,opencode-go:muse-spark-1.3-contributor"

# Soren91 定時コーナー (Phase 3)。当面は無効のまま置く。有効化はユーザー判断。
# 検証時は一時的に enabled=true + start_hour/duration_minutes を短時間へ変える。
[soren91_corner]
enabled = true
start_hour = 18
duration_minutes = 30
timezone = "Asia/Tokyo"

[webui]
soren_root = "/home/ubuntu/soren"
