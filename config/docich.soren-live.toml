# Soren本番のX displayへ、配信プロセスを止めずゲーム画面だけ載せる設定。
# Xvfb・音声bus・FFmpegはsoren-runtime.serviceが所有し続ける。
[display]
number = 99
width = 1280
height = 720
color_depth = 24
managed = false
viewport_x = 0
viewport_y = 90
viewport_width = 960
viewport_height = 540

[audio]
enabled = false
set_default = false

[stream]
mode = "null"

[agent]
default_interval_ms = 2000
brain_timeout_s = 120

[paths]
state_dir = "run-soren-live"
games_dir = "config/games"
roms_dir = "games/roms"

[watchdog]
enabled = false
recover_windows = false

[trading]
paper_worker_enabled = true
interval_s = 60
paper_capital_jpy = 10000
notifications_enabled = true
notification_speech_enabled = true

[rotation]
games = []

# 19:00 JSTに開始し、実際の切替完了から30分GNU Robotsを載せる。
# docich側canonicalがidleなら、終了時はstopして背景のSorenへ自然に戻る。
[retro_corner]
enabled = true
require_program_boundary = true
start_hour = 19
duration_minutes = 30
timezone = "Asia/Tokyo"
games = ["gnurobots"]

[paper_corner]
enabled = true
start_hour = 22
duration_minutes = 30
timezone = "Asia/Tokyo"

[webui]
soren_root = "/home/ubuntu/soren"
