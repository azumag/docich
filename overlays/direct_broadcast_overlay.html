<style>

.feed-line.g-recent { color: #fcd34d; border-color: #f59e0b; }

.feed-line.g-ab { color: #f0abfc; border-color: #d946ef; font-weight: 950; }
.feed-line.g-live { color: #86efac; border-color: #22c55e; }
.feed-line.g-drop { color: #fdba74; border-color: #f97316; }

}

.summary-line.sum-head { color: #67e8f9; background: rgba(8, 51, 68, .72); }

}

@keyframes genSpin { to { transform: rotate(360deg); } }
.work-bar { align-self: stretch; background: linear-gradient(180deg, #f97316, #facc15); border-radius: 5px 0 0 5px; }
.work-copy { min-width: 0; }
.work-title { font-size: 20px; font-weight: 950; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.work-body { margin-top: 4px; color: #fed7aa; font-size: 12px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.work-elapsed { color: #fdba74; font: 900 14px/1 "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
#toast-grid {
  height: 73px;

  grid-template-columns: repeat(3, minmax(0, 1fr));

}

.toast-bar { background: #8ab4ff; }

.toast-title { min-width: 0; flex: 1; font-size: 11.5px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.toast-body { margin-top: 5px; color: #c9daea; font-size: 10px; font-weight: 650; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

@keyframes enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* Approved preview v2 (941edb59): reuse its flat panels, palette and rail spacing.
   The live feed/parser/health contract and three surface rectangles stay intact.
   Do not add mock services or logs: the production feeds remain authoritative. */
:root { --cyan: #8ce5f0; --blue: #75daec; --muted: #829aae; --line: #36566b; }
html, body { color: #deedf7; font-family: "Noto Sans JP", "Segoe UI", sans-serif; font-synthesis: none; }
#broadcast-sidebar { padding: 8px; background: #040e17; }
.feed-head { height: 28px; padding: 0 5px; border-bottom-color: #33566c; color: #a5e6f3; font-size: 12px; font-weight: 600; letter-spacing: .07em; }
.live-dot { width: 6px; height: 6px; background: #34e6ad; box-shadow: none; }
#feed-label { font-size: 8px; color: #91abc0; }
#feed-age { color: #91b3cc; }
#feed { width: 303px; height: 642px; gap: 7px; }
.feed-panel { border: 1px solid #36566b; background: #040e17; }
.feed-panel + .feed-panel { padding-top: 0; border-top: 1px solid #36566b; }
.panel-head { height: 25px; gap: 6px; padding: 0 8px; border-bottom: 1px solid #36566b; color: #8ce5f0; }
.badge { padding: 0; border: 0; border-radius: 0; background: transparent; font-size: 10px; color: #8ce5f0; }
.panel-name { color: #91abc0; font-size: 8px; }
.panel-meta { color: #829aae; font-size: 8px; }
.feed-lines, .feed-line { width: 301px; }
/* Keep dense all-line feeds until their structured status/log contract exists. */
.feed-line { min-height: 0; padding-left: 5px; border-left: 0; text-shadow: none; }
.feed-foot { color: #7896aa; font-size: 7px; font-weight: 500; }
#top-rail, #bottom-rail { padding: 8px; background: #020b13; border-color: #2d596c; }
#bottom-rail { padding: 7px 8px; }
#summary { height: 73px; gap: 6px 7px; }
.summary-line { border: 1px solid #325e77; border-radius: 4px; background: #051422; font-weight: 500; }
.summary-line[class] { background: #051422; }
#work, #gen-top { grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 8px 12px; border-radius: 4px; border-color: #a77727; background: #171206; color: #f6c564; }
.work-bar, #gen-top .gen-top-bar, .toast-bar { display: none; }
.work-title { color: #f6f0dc; font-size: 21px; font-weight: 700; line-height: 1.4; }
.work-body, #gen-top .gen-top-body { margin-top: 2px; color: #e0d5bd; font-size: 12px; font-weight: 400; line-height: 1.5; white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
/* Keep a 21px title and two readable body lines inside the fixed 73px card. */
#work { padding-top: 4px; padding-bottom: 4px; }
.work-title { line-height: 1.2; }
.work-body { line-height: 1.4; }
.work-elapsed, #gen-top .gen-top-elapsed { align-self: stretch; display: flex; align-items: center; border-left: 1px solid #715926; padding-left: 12px; color: #f6c564; font-size: 24px; font-weight: 500; }
#gen-top .gen-top-title { color: #f6f0dc; font-weight: 700; }
#toast-grid { height: 75px; gap: 7px; }
.toast { grid-template-columns: minmax(0, 1fr); background: #051422; border: 1px solid #325e77; border-radius: 4px; box-shadow: none; }
.toast-copy { padding: 0; }
.toast-head { height: 24px; align-items: center; padding: 0 8px; border-bottom: 1px solid #24485f; color: #75daec; }

/* Broadcast status hierarchy v4: make GAME/OPS readable as cards, not a log dump. */

#feed-label { margin-left: auto; color: #8fb2c7; font-size: 8px; font-weight: 700; }

#feed { margin-top: 8px; width: 303px; height: 632px; gap: 8px; }

/* Structured broadcast dashboard. Raw status feeds remain the source of truth,
   but Soren91/JEV and OPS are projected into a scannable 320px surface. */
.game-dashboard,
.ops-dashboard {
  height: 100%;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow: hidden;
}
.dash-eyebrow {
  color: #7896aa;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .10em;
}
.game-title-row,
.ops-title-row {
  min-height: 28px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.game-title {
  min-width: 0;
  color: #f0fbff;
  font-size: 15px;
  line-height: 18px;
  font-weight: 900;
  letter-spacing: .02em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ops-title-row .game-title {
  font-size: 13px;
  line-height: 16px;
  letter-spacing: .05em;
}
.dash-pill {
  margin-left: auto;
  flex: 0 0 auto;
  padding: 3px 7px;
  border: 1px solid #315d70;
  border-radius: 999px;
  background: #091923;
  color: #a9cad8;
  font-size: 8px;
  font-weight: 900;
  letter-spacing: .04em;
}
.dash-pill.ok { color: #a7f3d0; border-color: #267158; background: rgba(16, 185, 129, .10); }
.dash-pill.warn { color: #fde68a; border-color: #83631e; background: rgba(245, 158, 11, .11); }
.dash-pill.down { color: #fecaca; border-color: #7f3434; background: rgba(239, 68, 68, .12); }
.game-kpis,
.ops-kpis {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
}
.dash-kpi {
  min-width: 0;
  padding: 8px 9px;
  border: 0;
  border-radius: 5px;
  background: #081a25;
}
.dash-kpi-label {
  color: #7895a8;
  font-size: 7px;
  font-weight: 900;
  letter-spacing: .11em;
}
.dash-kpi-value {
  margin-top: 2px;
  color: #f1fbff;
  font-size: 23px;
  line-height: 1.05;
  font-weight: 950;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dash-kpi-sub {
  margin-top: 3px;
  color: #7392a4;
  font-size: 6px;
  line-height: 8px;
  font-weight: 900;
  letter-spacing: .09em;
}
.dash-kpi-value.warn { color: #fde68a; }
.dash-kpi-value.down { color: #fca5a5; }
.dash-kpi-value.unknown { color: #aec0c9; }
.ops-kpis .dash-kpi-value { font-size: 19px; }
.ops-system-metrics {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 5px;
  padding: 3px 6px;
  border-radius: 4px;
  background: #071720;
}
.ops-metric-row {
  min-width: 0;
  display: grid;
  grid-template-columns: 26px minmax(40px, auto) minmax(0, 1fr) auto;
  align-items: center;
  gap: 3px;
  min-height: 16px;
}
.ops-metric-label,
.ops-metric-state {
  color: #8ba5b4;
  font-size: 7px;
  font-weight: 900;
  letter-spacing: .07em;
}
.ops-metric-value {
  color: #e5f4fa;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  font-weight: 900;
  white-space: nowrap;
}
.ops-metric-value.warn { color: #f4d486; }
.ops-metric-value.unknown { color: #aec0c9; }
.ops-metric-spark {
  min-width: 0;
  overflow: hidden;
  color: #79bdc7;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10px;
  letter-spacing: .04em;
  line-height: 12px;
  white-space: nowrap;
}
.ops-metric-state { text-align: right; white-space: nowrap; }
.ops-metric-state:empty { display: none; }
.game-live,
.game-trend-line {
  padding: 6px 8px;
  border-radius: 5px;
  background: #071720;
  color: #aac3d2;
  font-size: 9px;
  line-height: 1.35;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.game-records { display: grid; gap: 4px; }
.game-record { color: #aac3d2; font-size: 10px; line-height: 1.3; overflow-wrap: anywhere; }
.ops-activity-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 5px;
}
.ops-activity-item {
  min-width: 0;
  padding: 5px 6px;
  border: 0;
  border-radius: 4px;
  background: #071720;
}
.ops-activity-label {
  color: #6f8b9e;
  font-size: 6px;
  font-weight: 900;
  letter-spacing: .08em;
}
.ops-activity-value {
  margin-top: 2px;
  color: #b8d0dc;
  font-size: 8px;
  line-height: 10px;
  font-weight: 900;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.game-trend-line.better { color: #a7f3d0; background: rgba(16, 185, 129, .08); }
.game-trend-line.worse { color: #fecaca; background: rgba(239, 68, 68, .09); }
.game-trend-line.flat { color: #cbd5e1; }
.game-history-head,
.ops-services-head,
.ops-alerts-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #7895a8;
  font-size: 7px;
  font-weight: 900;
  letter-spacing: .10em;
}
.game-bars {
  height: 52px;
  display: flex;
  align-items: flex-end;
  gap: 5px;
  padding: 4px 6px 0;
  border-radius: 5px;
  background: #06141d;
}
.game-bar-wrap {
  flex: 1 1 0;
  min-width: 0;
  height: 46px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: stretch;
}
.game-bar {
  min-height: 5px;
  border-radius: 3px 3px 1px 1px;
  background: linear-gradient(180deg, #67e8f9, #0e7490);
  opacity: .88;
}
.game-bar-wrap:last-child .game-bar {
  background: linear-gradient(180deg, #fde68a, #d97706);
  opacity: 1;
}
.game-bar-label {
  margin-top: 2px;
  color: #718b9d;
  font-size: 6px;
  line-height: 8px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.ops-worker-value.ok { color: #a7f3d0; }
.ops-worker-value.warn { color: #fde68a; }
.ops-worker-value.down { color: #fecaca; }
.ops-services {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 5px;
}
.ops-service {
  min-width: 0;
  padding: 5px 7px;
  border: 0;
  border-radius: 4px;
  background: #071720;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
}
.ops-service-name {
  color: #819bab;
  font-size: 7px;
  font-weight: 900;
  letter-spacing: .07em;
}
.ops-service-value {
  min-width: 0;
  color: #b8ccd8;
  font-size: 8px;
  font-weight: 900;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ops-service.ok .ops-service-value { color: #a7f3d0; }
.ops-service.warn .ops-service-value { color: #fde68a; }
.ops-service.down .ops-service-value { color: #fecaca; }
.ops-alerts {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-height: 0;
}
.ops-alert {
  padding: 5px 7px;
  border-radius: 4px;
  background: rgba(245, 158, 11, .10);
  color: #fde68a;
  font-size: 8px;
  font-weight: 800;
  line-height: 1.25;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ops-alert.down { background: rgba(239, 68, 68, .12); color: #fecaca; }
.ops-clear {
  padding: 7px 8px;
  border: 1px solid #255844;
  border-radius: 5px;
  background: rgba(16, 185, 129, .06);
  color: #9fe4c5;
  font-size: 8px;
  font-weight: 850;
  text-align: center;
  letter-spacing: .04em;
}
.ops-dashboard.compact {
  padding: 7px 8px;
  gap: 5px;
}
.ops-dashboard.compact .ops-title-row { min-height: 20px; }
.ops-dashboard.compact .ops-title-row .game-title { font-size: 11px; line-height: 14px; }
.ops-dashboard.compact .dash-pill { padding: 2px 5px; font-size: 7px; }
.ops-dashboard.compact .dash-kpi { padding: 5px 7px; }
.ops-dashboard.compact .dash-kpi-value { font-size: 16px; }
.ops-dashboard.compact .dash-kpi-sub,
.ops-dashboard.compact .ops-services-head,
.ops-dashboard.compact .ops-activity-grid { display: none; }
.ops-dashboard.compact .ops-services { gap: 4px; }
.ops-dashboard.compact .ops-service { padding: 4px 6px; }
.ops-dashboard.micro {
  padding: 5px 6px;
  gap: 4px;
}
.ops-dashboard.micro .ops-title-row,
.ops-dashboard.micro .ops-services-head,
.ops-dashboard.micro .ops-services,
.ops-dashboard.micro .ops-activity-grid { display: none; }
.ops-dashboard.micro .ops-kpis { gap: 4px; }
.ops-dashboard.micro .dash-kpi { padding: 4px 5px; border-radius: 4px; }
.ops-dashboard.micro .dash-kpi-label { font-size: 5.5px; }
.ops-dashboard.micro .dash-kpi-value { margin-top: 1px; font-size: 13px; line-height: 14px; }
.ops-dashboard.micro .dash-kpi-sub { display: none; }
.ops-dashboard.micro .ops-alerts-head { font-size: 6px; }
.ops-dashboard.micro .ops-alerts { gap: 2px; }
.ops-dashboard.micro .ops-alert { padding: 3px 5px; font-size: 7px; line-height: 9px; }
.ops-dashboard.micro.has-alerts .ops-kpis { display: none; }
/* Use one content inset for every game and health view. */
.feed-head { display: none; }
#feed { margin-top: 0; height: 680px; }
html[data-prediction-active="1"] #feed { margin-top: 8px; height: 616px; }
.feed-lines:has(.hanjuku-card) { padding: 0; }
.hanjuku-card { width: 100%; padding: 5px 2px 0; background: transparent; }
.hanjuku-card.stale { background: transparent; }
/* Prioritize the game state over automation telemetry. */
.hanjuku-card { font-family: system-ui, sans-serif; }
.hanjuku-period { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 5px; }
.hanjuku-chapter { font-size: 26px; line-height: 1.2; letter-spacing: 0; }
.hanjuku-month { margin: 0; font-size: 12px; }
/* 兵力/将軍数, 所持金/勝敗, 収入/総賃金, 半熟Lv/半熟値 share two columns.
   The rows are written in display order so no grid reordering is needed, and
   the gap/margins stay tight so the OPS rail below keeps its measured room. */
.hanjuku-kpis { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 4px 12px; margin-top: 4px; margin-bottom: 2px; }
.hanjuku-label { white-space: nowrap; }
.hanjuku-detail-row + .hanjuku-detail-row { margin-top: 5px; }
.hanjuku-details { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; color: #edf5fb; font-size: 18px; line-height: 1.35; }
.hanjuku-group { min-width: 0; }
/* #2364: dense live-battle reference text. It wraps instead of truncating so
   long 趣味/思考/得意 strings and seasonal 卵補正 stay readable. */
.hanjuku-general, .hanjuku-eggpredict, .hanjuku-cardline {
  font-size: 11px; line-height: 1.42; font-weight: 500; overflow-wrap: anywhere;
}
.hanjuku-eggpredict { color: #ffe6a2; }
.hanjuku-cardline { color: #bae6fd; }
/* Dense battle reference rows: keep the card inside the 632px sidebar even
   with two generals and the whole carried kit. */
.hanjuku-duel-row { padding: 2px 7px; }
.hanjuku-duel-row + .hanjuku-duel-row { margin-top: 2px; }
.hanjuku-group-title { margin-bottom: 2px; color: #bdcdd9; font-size: 14px; font-weight: 600; }
.hanjuku-detail-row { display: block; margin-top: 0; }
.hanjuku-detail-label { margin-bottom: 3px; color: #bdcdd9; font-size: 14px; }
.hanjuku-detail-row > :last-child { min-width: 0; overflow-wrap: anywhere; }
.hanjuku-troops { color: #f7fafc; font-size: 24px; font-weight: 700; line-height: 1.15; }
.hanjuku-castles, .hanjuku-orders { color: #deedf7; font-size: 16px; }
.hanjuku-records { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.hanjuku-note { font-size: 11px; line-height: 1.4; color: #bdcdd9; }
.hanjuku-kpi { padding: 0; border: 0; background: transparent; }
.hanjuku-label { color: #bdcdd9; font-size: 12px; }
.hanjuku-value, .hanjuku-kpi:nth-child(2) .hanjuku-value { font-size: 24px; line-height: 1.12; }
.hanjuku-status { margin-top: 4px; padding: 0; border: 0; background: transparent; font-size: 17px; }
.hanjuku-duel { padding: 0; border: 0; background: transparent; font-size: 18px; line-height: 1.35; }
/* Game details are distinct cards, without decorative edge accents. */
.hanjuku-details { gap: 4px; margin-top: 4px; }
.hanjuku-group, .hanjuku-detail-row, .hanjuku-duel {
  box-sizing: border-box; padding: 5px 10px; border: 1px solid #28404f;
  border-radius: 7px; background: #0b1c28;
}
.hanjuku-detail-row + .hanjuku-detail-row { margin-top: 0; }
.hanjuku-duel { background: #211b26; border-color: #493341; }
.hanjuku-garrison, .hanjuku-marching {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  overflow: hidden;
}
.hanjuku-records { display: flex; flex-direction: column; gap: 4px; padding: 5px 10px; border: 1px solid #28404f; border-radius: 7px; background: #0b1c28; }
.hanjuku-records > div { padding: 0; }
html[data-soren-monitor="1"]:not([data-improve-active="1"]) .feed-panel.panel-g { flex: 1 1 0; }
html[data-soren-monitor="1"]:not([data-improve-active="1"]) #feed-g { height: 100%; }
html[data-soren-monitor="1"]:not([data-improve-active="1"]) .soren-monitor { height: 100%; min-height: 0; }
html[data-soren-monitor="1"]:not([data-improve-active="1"]) .feed-panel.panel-s { position: relative; flex: 0 0 190px; padding-top: 0; border-top: 0; background: #040e17; }
html[data-soren-monitor="1"]:not([data-improve-active="1"]) #feed-s,

<script>
(() => {
  'use strict';
  const STATE_ROUTE = '/__soren_overlay/broadcast/state';
  const TOAST_PAGE_MS = 3000;
  const TOASTS_PER_PAGE = 3;
  const SURFACE_REGION = document.documentElement.dataset.sorenRegion || 'full';
  const feedG = document.getElementById('feed-g');
  const feedS = document.getElementById('feed-s');
  const feedI = document.getElementById('feed-i');
  const feedGLines = document.getElementById('feed-g-lines');
  const feedSLines = document.getElementById('feed-s-lines');
  const feedGState = document.getElementById('feed-g-state');
  const feedSState = document.getElementById('feed-s-state');
  const feedILines = document.getElementById('feed-i-lines');
  const feedIStatus = document.getElementById('feed-i-status');
  const feedLabel = document.getElementById('feed-label');
  const feedAge = document.getElementById('feed-age');
  const feedProgress = document.getElementById('feed-progress');
  const summary = document.getElementById('summary');
  const work = document.getElementById('work');
  const toastGrid = document.getElementById('toast-grid');
  let state = null;
  let lastFeedGKey = '';
  const MONITOR_VIEW_MS = 45000;
  // #970: the monitor pan moves 4px/s and the health/observer view flips every
  // MONITOR_VIEW_MS, yet the motion loop used to read and write layout on every
  // native animation frame (about 100 Hz under Xvfb). Doing that work at a
  // bounded rate is visually identical and removes most of the steady
  // forced-layout cost. requestAnimationFrame is still the scheduler so a
  // hidden page stops the loop by itself.
  const MONITOR_ANIM_MIN_MS = 66;
  const monitorMotion = { startedAt: null, lastTick: null, lastWork: null, frame: null,
    upper: { position: 0, direction: 1, waitUntil: 0 },
    observer: { position: 0, direction: 1, waitUntil: 0 } };
  let lastFeedSKey = '';
  let lastFeedIKey = '';
  let lastSummaryKey = '';
  let lastToastKey = '';

  function pad(value) { return String(value).padStart(2, '0'); }
  function timeLabel(epoch) {
    const date = new Date(Number(epoch || Date.now() / 1000) * 1000);
    return `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
  }
  function elapsedLabel(epoch) {
    const seconds = Math.max(0, Math.floor(Date.now() / 1000) - Number(epoch || 0));
    return `${Math.floor(seconds / 60)}:${pad(seconds % 60)}`;
  }
  function ageLabel(epoch) {
    const seconds = Math.max(0, Math.floor(Date.now() / 1000) - Number(epoch || 0));
    return seconds < 60 ? `${seconds}s` : `${Math.floor(seconds / 60)}m`;
  }
  function feedLineClass(line, opts = {}) {
    const raw = String(line || '');
    const text = raw.replace(/^[│┃\s]+/, '');
    if (/^━+$/.test(raw) || /^[┌└]─+[┐┘]$/.test(raw)) return 'dim';
    if (/^  (?:CORE|HEALTH)$/.test(raw)) return 's-health';
    if (/^  ACTIVITY$/.test(raw)) return 's-activity';
    if (/^  AUDIO$/.test(raw)) return 's-audio';
    if (/^  TWITCH$/.test(raw)) return 's-twitch';
    if (/^  YOUTUBE$/.test(raw)) return 's-youtube';
    if (/^  ROLLBACKS$/.test(raw)) return 's-rollback';
    if (/^│? *SOREN[/]|^│? *Best:|^│? *Avg:/.test(raw)) return 'g-head';
    if (/^Score (Timeline|Distribution)/.test(text) || /^Strategy Comparison/.test(text)) return 'g-section';
    if (/^rk hash/.test(text)) return 'g-head';
    if (/^Stats:/.test(text)) return 'game-primary';
    if (/^Trend:/.test(text) || /^wins=/.test(text)) return 'game-trend';
    if (/Workers\s+.*\bONLINE\b/.test(text) || /^Backend\s+.*(?:LIVE|OBS|OK)/.test(text)) return 'ops-primary';
    if (/\b(?:STOPPED|DOWN|FAILED|INVALID)\b/.test(text) || /Duplicates\s+DETECTED/.test(text)) return 'down ops-alert';
    if (/\b(?:DEGRADED|CHECK|UNKNOWN|PAUSED)\b/.test(text) || /^(?:Stopped|Unexpected|Paused|AI 429)\b/.test(text)) return 'ops-warn';
    if (/^► 1 /.test(text)) return 'g-top';
    if (/^[0-9][0-9.,k]*[┃│]/.test(text)) return 'g-dist';
    if (/[⠀-⣿]/.test(text)) return 'g-chart';
    if (/^● /.test(text)) return 'run';
    if (/^○ /.test(text)) return 'down';
    if (/^✓ /.test(text)) return 'ok';
    if (/^◉ /.test(text)) return 'amber';
    if (/^◆ /.test(text)) return 'yellow';
    if (/^▾ /.test(text)) return 'orange';
    if (/^▸ /.test(text)) return 'blue';
    if (/^◇ /.test(text)) return 'purple';
    if (/^♪ |^♫ /.test(text)) return 'pink';
    if (/^📻 /.test(text)) return 'teal';
    if (/^⟳ /.test(text)) return 'violet';
    if (/^💬 /.test(text)) return 'indigo';
    if (opts.improve) {
      if (/^\[\d{2}:\d{2}:\d{2}\] \[IMPROVE\]/.test(raw)) return 'teal';
      if (/^\[\d{2}:\d{2}:\d{2}\] \[(PIN|BRANCH)\]/.test(raw)) return 'purple';
      if (/^\[\d{2}:\d{2}:\d{2}\] \[(WARN|ERROR)\]/.test(raw)) return 'down';
      if (/FAILED|failed|失敗/.test(text)) return 'down';
    }
    if (/Recent30/.test(text)) return 'g-recent';
    if (/Strategy:/.test(text)) return 'g-strategy';
    if (/A\/B:/.test(text)) return 'g-ab';
    if (/^Live:/.test(text)) return 'g-live';
    if (/LastDrop/.test(text)) return 'g-drop';
    if (/Curr |Reg NO/.test(text)) return 'g-core';
    if (/RUNNING|CONNECTED/.test(text)) return 'run';
    if (/STOPPED/.test(text)) return 'down';
    if (/SILENT|IDLE|empty/.test(text)) return 'idle';
    if (/PASSED|none/.test(text)) return 'ok';
    return 'dim';
  }
  function appendFeedLineContent(row, line, segments) {
    if (!Array.isArray(segments) || !segments.length) {
      row.textContent = line === '' ? ' ' : line;
      return;
    }
    for (const segment of segments) {
      const span = document.createElement('span');
      span.textContent = String(segment?.t ?? '');
      if (segment?.c) span.style.color = String(segment.c);
      if (segment?.b) span.style.fontWeight = '700';
      if (segment?.o) span.style.opacity = String(segment.o);
      row.appendChild(span);
    }
  }
  // サイドバーの SHOW-STATUS-G から「ヘッダーの枠」だけを外す。
  //
  // status_overlay.html の <pre> テキストは 2 役を兼ねている:
  //   * 上部 4 枠 (selectedSummaryLines) が SOREN/OBS / A/B: / Recent30: /
  //     Strategy: を拾う供給元
  //   * このサイドバーがそのまま行として描画する中身
  // 供給元としては要るが、サイドバーには出したくない (2026-09-10 の指示)。
  // 生成側で消すと上部 4 枠から A/B が消えるので、描画側で落とす。
  // 対象は "SOREN/" を含む行が属する枠 (┌ … └)。AI 429 の枠は残す。
  //
  // segments は行番号で text と対応しているので、同じ範囲を両方から削る。
  // 片方だけ削ると色付けが 1 行ずつずれ、segments を捨てると色が全部消える。
  function headerBoxRange(lines) {
    const head = lines.findIndex((line) => line.includes('SOREN/'));
    if (head < 0) return null;
    let start = head;
    while (start > 0 && !lines[start].includes('\u250c')) {
      start -= 1;
      // A closed preceding box is unrelated to this unboxed corner header.
      if (lines[start].includes('\u2514')) return null;
    }
    if (!lines[start].includes('\u250c')) return null;
    let end = head;
    while (end < lines.length - 1 && !lines[end].includes('\u2514')) end += 1;
    if (!lines[end].includes('\u2514')) return null;
    return [start, end];
  }
  function stripHeaderBox(text, segments) {
    const lines = String(text ?? '').split('\n');
    const range = headerBoxRange(lines);
    const segs = Array.isArray(segments) ? segments : [];
    if (!range) return { text: String(text ?? ''), segments: segs };
    const [start, end] = range;
    const drop = (arr) => arr.slice(0, start).concat(arr.slice(end + 1));

      if (compact[3] === 'ONLINE') return [`${compact[1]}/${compact[2]} OK`, 'ok'];
      return [compact[3], compact[3] === 'DEGRADED' ? 'down' : 'warn'];
    }
    const legacy = text.match(/Workers.*?(\d+)\/(\d+) expected online/);
    if (legacy) return [`${legacy[1]}/${legacy[2]} OK`, 'ok'];

    return ['OPS', 'info'];

  function abRemainingSummary(stats) {

        return;
      }
      const lines = (topO && topO.enabled === true && Array.isArray(topO.lines) && topO.lines.length)
        ? topO.lines.slice(0, 4).map((s) => String(s).trim()).filter(Boolean)
        : selectedSummaryLines();
      const key = JSON.stringify(lines);
      if (key !== lastSummaryKey) {
        summary.replaceChildren(...lines.map((text) => {
          const row = document.createElement('div');
          row.className = `summary-line ${summaryClass(text)}`;
          row.textContent = text;
          return row;
        }));
        lastSummaryKey = key;
      }
    }
  }
  function monitorText(text) {
    return text.replace(/\bBackend\s+(?:FFMPEG|OBS)\s*/g, '配信 ')
      .replace(/\bSOREN\/(?:FFMPEG|OBS)\b/g, 'SOREN');
  }
  function liveStatusCards() {
    const ops = String(state?.feeds?.showStatus?.text || '').split('\n');
    return [/Backend/, /Game|Queued/, /LastDrop/].map((pattern) => ops.find((line) => pattern.test(line)))
      .filter(Boolean).map((line) => ({
        category: 'system',
        title: 'LIVE STATUS',
        body: monitorText(line.trim()),
        ts: 0,
        liveStatus: true,
      }));
  }
  function aiThinkingCard(generators) {
    const labels = generators.map((item) => String(item.label || '').trim()).filter(Boolean).sort();
    return {
      category: 'ai-thinking',
      title: 'AI思考中',
      body: labels.join(' / ') || '生成処理を実行中',
      liveStatus: true,
    };
  }
  function currentToasts() {
    const now = Math.floor(Date.now() / 1000);
    const visibleSec = Number(state?.notifications?.visibleSec || 18);
    const events = (Array.isArray(state?.notifications?.events) ? state.notifications.events : [])
      .filter((item) => now - Number(item.ts || 0) <= visibleSec);
    const rawGenerators = Array.isArray(state?.notifications?.generators) ? state.notifications.generators : [];
    const generatorEvents = rawGenerators.map((item) => ({
      category: item.key || 'worker',
      title: `${item.icon || '⏳'} ${item.label || '生成中'}`,
      body: `処理継続中 ${elapsedLabel(item.ts)}`,
      ts: item.ts || now,
    }));
    if (!events.length && rawGenerators.length) {
      // AI思考中は下枠の先頭カードを思考中表示へ置き換え、LIVE STATUS は2枚へ圧縮する。
      return [aiThinkingCard(rawGenerators), ...liveStatusCards().slice(0, TOASTS_PER_PAGE - 1)];
    }
    const displayItems = [...generatorEvents, ...events];
    if (!displayItems.length) {
      return liveStatusCards();
    }
    const pageCount = Math.max(1, Math.ceil(displayItems.length / TOASTS_PER_PAGE));
    const page = Math.floor(Date.now() / TOAST_PAGE_MS) % pageCount;
    return displayItems.slice(page * TOASTS_PER_PAGE, (page + 1) * TOASTS_PER_PAGE);
  }
  function renderToasts() {
    const items = currentToasts();
    const key = JSON.stringify(items.map((item) => item.liveStatus
      ? ['live-status', item.category, item.title, item.body]
      : [item.ts, item.category, item.title, item.body]));
    const now = Math.floor(Date.now() / 1000);
    if (key === lastToastKey) {
      // 既定 LIVE STATUS カードは再構築せず時計だけ進め、enter アニメーションの再実行を防ぐ。
      for (const card of toastGrid.querySelectorAll('.toast[data-live-status="1"]')) {
        const time = card.querySelector('.toast-time');
        if (time) time.textContent = timeLabel(now);
      }
      return;
    }
    toastGrid.replaceChildren(...items.map((item) => {
      const category = String(item.category || 'system').toLowerCase().replace(/[^a-z0-9_-]/g, '');
      const card = document.createElement('article');
      card.className = `toast ${category}${!item.liveStatus && now - Number(item.ts || 0) <= 3 ? ' fresh' : ''}`;
      if (item.liveStatus) card.dataset.liveStatus = '1';
      const bar = document.createElement('div');
      bar.className = 'toast-bar';
      const copy = document.createElement('div');
      copy.className = 'toast-copy';
      const head = document.createElement('div');
      head.className = 'toast-head';
      const title = document.createElement('div');
      title.className = 'toast-title';
      title.textContent = item.title || item.category || 'event';
      const time = document.createElement('div');
      time.className = 'toast-time';
      time.textContent = item.liveStatus ? timeLabel(now) : timeLabel(item.ts);
      const body = document.createElement('div');
      body.className = 'toast-body';
      body.textContent = item.body || '';
      head.append(title, time);
      copy.append(head, body);
      card.append(bar, copy);
      return card;
    }));
    lastToastKey = key;
  }
  function publishHealth(error = '') {
    window.__sorenBroadcastOverlayHealth = {
      version: 3,
      updatedAt: state?.updatedAt || 0,
      lastClientUpdateAt: Math.floor(Date.now() / 1000),
      showStatusGLineCount: state?.feeds?.showStatusG?.lineCount || 0,
      showStatusLineCount: state?.feeds?.showStatus?.lineCount || 0,
      improveActive: Boolean(state?.feeds?.improve?.active),
      improveLineCount: state?.feeds?.improve?.lineCount || 0,
      feedLines: (state?.feeds?.showStatusG?.lineCount || 0)
        + (state?.feeds?.showStatus?.lineCount || 0)
        + (state?.feeds?.improve?.active ? (state?.feeds?.improve?.lineCount || 0) : 0),
      notificationCount: state?.notifications?.events?.length || 0,
      workActive: Boolean(state?.notifications?.work?.active),
      generatorCount: state?.notifications?.generators?.length || 0,
      merged: true,
      error,
      region: SURFACE_REGION,
      layout: { game: [0, 90, 960, 540], sidebar: [960, 0, 320, 720], rails: [90, 90] },
    };
  }
  function renderPrediction() {
    const lines = String(state?.feeds?.showStatus?.text || '').split('\n').map(line => line.trim());
    const progress = lines.find(line => line.startsWith('予想対象：'));
    const current = lines.find(line => /^#\d+：今回の予想対象/.test(line));
    document.documentElement.dataset.predictionActive = progress ? '1' : '0';
    const panel = document.getElementById('prediction-round');
    const text = progress ? progress.replace('｜終了', '\n終了') + (current ? '\n' + current : '') : '';
    if (panel.textContent !== text) { panel.textContent = text; panel.style.whiteSpace = 'pre-line'; }
  }
  function render() {
    renderPrediction();
    if (!state) return;
    renderFeed();
    renderTopRail();
    renderToasts();
    publishHealth();
  }
  async function refresh() {
    try {
      if (window.parent !== window && window.parent?.__sorenBroadcastState) {
        state = window.parent.__sorenBroadcastState;
        render();
        return;
      }
      const response = await fetch(STATE_ROUTE, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      state = await response.json();
      render();
    } catch (error) {
      publishHealth(String(error?.message || error));
    }
  }
  void refresh();
  setInterval(refresh, 1000);
  setInterval(render, 1000);
})();
</script>
