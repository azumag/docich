<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=960,height=540,initial-scale=1">
<title>PAPER 暗号資産コーナー</title>
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>
<div id="app">
  <header id="header">
    <div class="title" id="title">PAPER 暗号資産コーナー</div>
    <div class="meta">
      <span class="badge">PAPER / 模擬</span>
      <span id="clock">--:--:-- JST</span>
      <span id="state">state: -</span>
      <span id="remaining"></span>
    </div>
  </header>

  <section id="cards">
    <div class="card"><div class="k">仮想資金</div><div class="v" id="capital">-</div></div>
    <div class="card"><div class="k">投入額</div><div class="v" id="deployed">-</div></div>
    <div class="card"><div class="k">保有一式</div><div class="v" id="positions">-</div></div>
    <div class="card"><div class="k">市場(新鮮)</div><div class="v" id="fresh">-</div></div>
  </section>

  <main>
    <section id="chartwrap">
      <div id="charthead">
        <span id="focus">注目: -</span>
        <span id="range">-</span>
      </div>
      <canvas id="chart" width="612" height="252"></canvas>
      <div id="chartnote" class="note">5分足の保存済み終値のみ。形成中/欠測は描画しない。</div>
    </section>
    <aside id="side">
      <div class="panel"><h3>BOT判断</h3><div id="decision">-</div></div>
      <div class="panel"><h3>見送り理由</h3><div id="skipped">-</div></div>
      <div class="panel"><h3>保有上位</h3><div id="holdings">-</div></div>
    </aside>
  </main>

  <footer>
    <div id="fillshead">直近の模擬約定</div>
    <div id="fills">-</div>
    <div id="disclaimer"></div>
  </footer>
</div>
<script src="/dashboard.js"></script>
</body>
</html>
