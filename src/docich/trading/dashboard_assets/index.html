<!doctype html>
<html lang="ja" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=960,height=540,initial-scale=1">
<title>PAPER 暗号資産コーナー</title>
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>
<div id="app">
  <header id="header">
    <div class="title" id="title">PAPER 暗号資産コーナー</div>
    <div class="meta">
      <span class="badge">PAPER / 模擬</span>
      <span id="funding">資金 - / 投入 -</span>
      <span id="clock">--:--:-- JST</span>
      <span id="state">状態:-</span>
      <span id="remaining"></span>
    </div>
  </header>

  <section id="cards">
    <div class="card"><div class="k">総資産</div><div class="v" id="equity">-</div></div>
    <div class="card"><div class="k">累積損益</div><div class="v" id="totalpnl">-</div></div>
    <div class="card"><div class="k">本日損益 <span class="tiny">確定分</span></div><div class="v" id="todaypnl">-</div></div>
    <div class="card"><div class="k">含み損益</div><div class="v" id="unrealized">-</div></div>
    <div class="card"><div class="k">保有</div><div class="v" id="positions">-</div></div>
    <div class="card"><div class="k">市場(新鮮)</div><div class="v" id="fresh">-</div></div>
  </section>

  <main>
    <section id="chartwrap">
      <div id="charthead">
        <span id="focus">注目: -</span>
        <span id="livequote" class="livequote">現在値 -</span>
        <span id="range">-</span>
      </div>
      <canvas id="chart" width="540" height="334"></canvas>
      <div id="chartnote" class="note">5分足の保存済み終値。PAPER台帳と公開価格から損益計算。</div>
    </section>

    <aside id="side">
      <div class="panel" id="decision-panel"><h3>BOT判断</h3><div id="decision">-</div></div>
      <div id="detail-row">
        <div class="panel" id="skipped-panel"><h3>見送り理由</h3><div id="skipped">-</div></div>
        <div class="panel" id="fills-panel">
          <h3>市場歩み値 <span id="liveage" class="muted"></span></h3>
          <div id="tape">-</div>
          <div class="paper-fill"><span class="paper-tag">PAPER</span><span id="paperfill">模擬約定なし</span></div>
        </div>
      </div>
      <div class="panel" id="holdings-panel">
        <h3>保有上位 <span id="holdingnote" class="muted"></span></h3>
        <div id="holdings">-</div>
      </div>
      <div class="panel" id="free-strategy-panel">
        <h3>AI戦略研究 <span class="paper-tag">独立PAPER</span></h3>
        <div id="free-strategies">-</div>
      </div>
    </aside>
  </main>

  <footer><div id="disclaimer"></div></footer>
</div>
<script src="/dashboard.js"></script>
<script>
(() => {
  "use strict";
  const target = document.getElementById("free-strategies");
  const escapeHtml = (value) => String(value ?? "")
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
  const phaseLabel = (phase) => ({
    research: "研究開始", paper_validating: "PAPER検証中", paused: "停止中",
    quarantined: "隔離", review_due: "評価待ち"
  })[String(phase)] || String(phase || "待機");
  const money = (value) => {
    if (value === null || value === undefined || value === "") return "損益待ち";
    const number = Number(value);
    if (!Number.isFinite(number)) return "損益待ち";
    const sign = number > 0 ? "+" : "";
    return `${sign}${number.toLocaleString("ja-JP", {maximumFractionDigits: 0})}円`;
  };
  function renderResearch() {
    if (!target || typeof render === "undefined" || !render.lastData) return;
    const group = render.lastData.free_strategies || {};
    const items = Array.isArray(group.experiments) ? group.experiments.slice(0, 2) : [];
    if (!items.length) {
      target.innerHTML = '<div class="muted">候補なし / worker未起動</div>';
      return;
    }
    target.innerHTML = items.map((item) => {
      const pnl = Number(item.net_pnl_jpy);
      const cls = Number.isFinite(pnl) && pnl !== 0 ? (pnl > 0 ? "pos" : "neg") : "muted";
      return `<div class="lab-row"><span class="lab-name">${escapeHtml(item.name || "候補")} ` +
        `<span class="lab-phase">${escapeHtml(phaseLabel(item.phase))}</span></span>` +
        `<span class="lab-meta ${cls}">${escapeHtml(money(item.net_pnl_jpy))}</span></div>`;
    }).join("");
  }
  renderResearch();
  setInterval(renderResearch, 2000);
})();
</script>
</body>
</html>
